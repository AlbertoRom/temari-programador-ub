summary:`
<h3>Oracle WebLogic Server</h3>
<p>Servidor d'aplicacions <b>Java EE / Jakarta EE</b> comercial d'Oracle, part d'Oracle Fusion Middleware. Està pensat per a aplicacions empresarials crítiques amb alta disponibilitat, i també es pot desplegar en contenidors i a Kubernetes (WebLogic Kubernetes Operator).</p>
<h3>Arquitectura</h3>
<ul>
<li><b>Domini</b>: unitat d'administració. Conté un <b>Administration Server</b> (només un per domini, gestiona la configuració) i un o diversos <b>Managed Servers</b> (executen les aplicacions).</li>
<li><b>Clúster</b>: grup de managed servers que treballen junts per escalabilitat i alta disponibilitat (replicació de sessions, balanceig de càrrega, <i>failover</i>, migració de serveis).</li>
<li><b>Node Manager</b>: utilitat que arrenca, atura i reinicia servidors de manera remota i automàtica.</li>
<li><b>Machine</b>: representació lògica de l'equip físic on s'executen servidors.</li>
<li>La configuració del domini es desa a <code>config/config.xml</code>.</li>
</ul>
<h3>Administració</h3>
<ul>
<li><b>Administration Console</b> (web) i la nova <b>WebLogic Remote Console</b>.</li>
<li><b>WLST</b> (WebLogic Scripting Tool): llenguatge de script basat en <b>Jython</b> per automatitzar tasques (<code>connect</code>, <code>edit</code>, <code>startEdit</code>, <code>activate</code>, <code>deploy</code>).</li>
<li>Gestió basada en <b>MBeans</b> (JMX). Canvis mitjançant <i>edit sessions</i> amb bloqueig i activació.</li>
<li>Eines de creació de dominis: Configuration Wizard i WebLogic Deploy Tooling (WDT).</li>
</ul>
<h3>Serveis</h3>
<ul>
<li><b>Data sources JDBC</b> (pool de connexions, també <i>multi data sources</i> i suport per a Oracle RAC amb Active GridLink), localitzats per <b>JNDI</b>.</li>
<li><b>JMS</b>: servidors JMS, mòduls, cues i temes amb persistència a fitxer o a base de dades.</li>
<li><b>Seguretat</b>: <i>security realms</i> amb proveïdors d'autenticació (LDAP, Active Directory, base de dades), rols i polítiques, SSL i <i>keystores</i>.</li>
<li><b>Desplegament</b> de JAR, WAR i EAR: per consola, WLST, <code>weblogic.Deployer</code>, carpeta <code>autodeploy</code> (només en mode desenvolupament) i desplegament per producció amb versions (<i>production redeployment</i>).</li>
<li>Modes de domini: <b>desenvolupament</b> (més permissiu) i <b>producció</b> (més segur, sense autodeploy).</li>
<li>Supervisió: logs de servidor i de domini, WLDF (diagnòstic), <i>work managers</i> per prioritzar peticions, i el <i>Proxy Plug-in</i> per a Apache, OHS o IIS.</li>
</ul>`,

"tomcat":{url:"https://tomcat.apache.org",prompt:'<span class="ps">$</span> ./catalina.sh run',
summary:`
<h3>Apache Tomcat</h3>
<p>Contenidor web de codi obert que implementa <b>Jakarta Servlet</b>, <b>Pages (JSP)</b>, <b>Expression Language</b> i <b>WebSocket</b>. No és un servidor Jakarta EE complet (no inclou EJB, JMS ni JTA). Versions: Tomcat 9 (Java EE 8, <code>javax.*</code>), 10.1 (Jakarta EE 10, <code>jakarta.*</code>) i 11.</p>
<h3>Arquitectura</h3>
<ul>
<li><b>Catalina</b>: contenidor de servlets. <b>Coyote</b>: connector HTTP. <b>Jasper</b>: motor que compila els JSP.</li>
<li>Jerarquia definida a <code>server.xml</code>: <b>Server</b> &gt; <b>Service</b> &gt; <b>Connector</b> (port) i <b>Engine</b> &gt; <b>Host</b> &gt; <b>Context</b> (aplicació).</li>
<li>Ports per defecte: <b>8080</b> (HTTP), 8443 (HTTPS), <b>8005</b> (ordre d'aturada) i 8009 (AJP, desactivat per defecte des de l'incident Ghostcat).</li>
</ul>
<h3>Directoris i fitxers</h3>
<div class="tbl"><table>
<tr><th>Ruta</th><th>Contingut</th></tr>
<tr><td><code>bin/</code></td><td><code>startup.sh</code>, <code>shutdown.sh</code>, <code>catalina.sh</code>; variables a <code>setenv.sh</code> (<code>JAVA_OPTS</code>, <code>CATALINA_OPTS</code>)</td></tr>
<tr><td><code>conf/</code></td><td><code>server.xml</code>, <code>web.xml</code> (global), <code>context.xml</code>, <code>tomcat-users.xml</code> (usuaris i rols de les aplicacions de gestió)</td></tr>
<tr><td><code>webapps/</code></td><td>Aplicacions desplegades (WAR o carpetes)</td></tr>
<tr><td><code>logs/</code></td><td><code>catalina.out</code>, logs d'accés</td></tr>
<tr><td><code>lib/</code></td><td>Biblioteques compartides (p. ex. el driver JDBC)</td></tr>
<tr><td><code>work/</code>, <code>temp/</code></td><td>JSP compilats i fitxers temporals</td></tr>
</table></div>
<p>Variables <code>CATALINA_HOME</code> (instal·lació) i <code>CATALINA_BASE</code> (instància, per tenir-ne diverses amb la mateixa instal·lació).</p>
<h3>Desplegament i administració</h3>
<ul>
<li>Copiar el WAR a <code>webapps/</code> (amb <code>autoDeploy</code>), fitxers de context a <code>conf/Catalina/localhost/</code> o el <b>Manager</b> (web o API de text, amb rols <code>manager-gui</code> o <code>manager-script</code>). El nom del WAR determina el <i>context path</i>; <code>ROOT.war</code> va a l'arrel.</li>
<li><b>Recursos JNDI</b>: data sources definits a <code>context.xml</code> amb pool de connexions (Tomcat JDBC o DBCP).</li>
<li><b>Realms</b> per a l'autenticació (UserDatabase, JDBC, DataSource, JNDI/LDAP).</li>
<li>TLS al connector o, més habitual, darrere d'un proxy invers (Apache, Nginx). Clúster amb replicació de sessions.</li>
<li>Seguretat: eliminar les aplicacions d'exemple, protegir el Manager i el port d'aturada, i executar amb un usuari sense privilegis.</li>
</ul>`,

"json":{url:"https://es.wikipedia.org/wiki/JSON",prompt:'<span class="ps">$</span> jq . dades.json',
summary:`
<h3>Què és JSON</h3>
<p><b>JSON</b> (JavaScript Object Notation) és un format lleuger d'intercanvi de dades en text, fàcil de llegir per a persones i de processar per a màquines. Deriva de la sintaxi d'objectes de JavaScript, però és <b>independent del llenguatge</b>. El va popularitzar <b>Douglas Crockford</b> a principis dels anys 2000. Està estandarditzat a l'<b>RFC 8259</b> i a l'<b>ECMA-404</b>. Tipus MIME: <code>application/json</code>; extensió <code>.json</code>; codificació <b>UTF-8</b>.</p>
<h3>Sintaxi</h3>
<ul>
<li>Dues estructures: <b>objecte</b> (parells clau-valor entre claus <code>{ }</code>) i <b>array</b> (llista ordenada entre claudàtors <code>[ ]</code>).</li>
<li>Tipus de valor: <b>cadena</b> (sempre amb <b>cometes dobles</b>), <b>número</b> (sense distinció entre enter i decimal, sense <code>NaN</code> ni <code>Infinity</code>), <b>booleà</b> (<code>true</code>/<code>false</code>), <b>null</b>, objecte i array.</li>
<li>Les claus han de ser cadenes amb cometes dobles. No admet comentaris, comes finals, dates natives (es fan servir cadenes ISO 8601) ni funcions.</li>
</ul>
<pre>{
  "id": 42,
  "titol": "La plaça del Diamant",
  "autora": { "nom": "Mercè Rodoreda", "naixement": 1908 },
  "disponible": true,
  "exemplars": ["BUB-001", "BUB-002"],
  "notes": null
}</pre>
<h3>Ús i ecosistema</h3>
<ul>
<li>Format habitual de les <b>API REST</b>, fitxers de configuració (<code>package.json</code>), bases de dades documentals (MongoDB fa servir BSON) i tokens <b>JWT</b>.</li>
<li>Comparat amb <b>XML</b>: més compacte i senzill de processar, però sense atributs, espais de noms ni comentaris.</li>
<li><b>JSON Schema</b>: validació de l'estructura. <b>JSONPath</b> i <code>jq</code>: consulta. <b>JSON-LD</b>: dades enllaçades. <b>JSONP</b>: tècnica antiga per evitar la política del mateix origen, avui substituïda per <b>CORS</b>.</li>
<li>En JavaScript: <code>JSON.parse()</code> i <code>JSON.stringify()</code>. No s'ha de fer servir mai <code>eval()</code> per interpretar JSON.</li>
<li>En Java: Jackson, Gson, JSON-P i JSON-B. En PHP: <code>json_encode</code> i <code>json_decode</code>.</li>
</ul>`,

"ws":{url:"https://es.wikipedia.org/wiki/Servicio_web",prompt:'<span class="ps">$</span> curl -X GET /api/v1',
summary:`
<h3>Concepte</h3>
<p>Un <b>servei web</b> és una tecnologia que permet que aplicacions diferents, fetes en llenguatges i plataformes diferents, intercanviïn dades a través de la xarxa amb protocols i estàndards oberts, sobretot HTTP. L'objectiu és la <b>interoperabilitat</b>. Organismes d'estàndards: <b>W3C</b> i <b>OASIS</b>; el <b>WS-I</b> va definir perfils d'interoperabilitat.</p>
<h3>Serveis SOAP (WS-*)</h3>
<ul>
<li><b>SOAP</b>: protocol de missatges <b>XML</b> amb un sobre (<code>Envelope</code>), capçalera opcional (<code>Header</code>), cos (<code>Body</code>) i, si hi ha error, <code>Fault</code>. Normalment sobre HTTP POST, però és independent del transport.</li>
<li><b>WSDL</b>: document XML que descriu el servei (tipus, missatges, operacions, <i>bindings</i> i l'adreça del servei). És el <b>contracte</b>.</li>
<li><b>UDDI</b>: registre per publicar i descobrir serveis; avui pràcticament en desús.</li>
<li>Extensions WS-*: <b>WS-Security</b> (signatura i xifratge de missatges), WS-ReliableMessaging, WS-Addressing, WS-Policy, WS-AtomicTransaction.</li>
<li>Rols: proveïdor, consumidor i registre (arquitectura SOA).</li>
</ul>
<h3>Serveis REST</h3>
<ul>
<li><b>REST</b> (Representational State Transfer), definit per Roy Fielding el 2000. És un <b>estil arquitectònic</b>, no un protocol.</li>
<li>Principis: arquitectura client-servidor, <b>sense estat</b> (<i>stateless</i>), respostes que es poden desar a la memòria cau, interfície uniforme, sistema en capes i, opcionalment, codi sota demanda. HATEOAS: les respostes inclouen enllaços a les accions possibles.</li>
<li>Recursos identificats per <b>URI</b> i manipulats amb verbs HTTP: <code>GET</code> (llegir), <code>POST</code> (crear), <code>PUT</code> (substituir), <code>PATCH</code> (modificar parcialment), <code>DELETE</code> (esborrar). GET, PUT i DELETE són <b>idempotents</b>; POST no.</li>
<li>Formats: JSON sobretot, també XML. Descripció del contracte amb <b>OpenAPI</b> (Swagger).</li>
<li>Codis d'estat: <b>2xx</b> èxit (200, 201 Created, 204 No Content), <b>3xx</b> redirecció, <b>4xx</b> error del client (400, 401 no autenticat, 403 prohibit, 404, 409), <b>5xx</b> error del servidor (500, 503).</li>
</ul>
<h3>Altres enfocaments</h3>
<p>XML-RPC i JSON-RPC (crida a procediments remots), <b>GraphQL</b> (el client demana exactament els camps que necessita, amb un sol endpoint), <b>gRPC</b> (HTTP/2 i Protocol Buffers) i webhooks. Avantatges generals: interoperabilitat, reutilització i desacoblament. Inconvenients: sobrecàrrega de format (sobretot SOAP) i dependència de la xarxa.</p>`,

<p>Versió de suport a llarg termini de la família 12.2 (la "c" és de <i>cloud</i>). La documentació inclou conceptes, administració (Administrator's Guide), referència SQL i PL/SQL, rendiment, seguretat, còpies de seguretat i alta disponibilitat. La versió LTS posterior és 23ai.</p>
<h3>Arquitectura</h3>

</ul>`,

"relacional":{url:"https://www.campusmvp.es/recursos/post/Disenando-una-base-de-datos-en-el-modelo-relacional.aspx",prompt:'<span class="ps">$</span> design --model relacional',
summary:`
<h3>Model relacional</h3>
<p>Proposat per <b>Edgar F. Codd</b> (IBM, 1970). Les dades s'organitzen en <b>relacions</b> (taules) formades per <b>tuples</b> (files) i <b>atributs</b> (columnes) amb un <b>domini</b> (valors possibles). El <b>grau</b> és el nombre d'atributs i la <b>cardinalitat</b>, el nombre de tuples. L'ordre de files i columnes no és significatiu.</p>
<h3>Claus i integritat</h3>
<ul>
<li><b>Superclau</b>: atributs que identifiquen una fila. <b>Clau candidata</b>: superclau mínima. <b>Clau primària</b>: la candidata escollida (única i no nul·la). <b>Claus alternatives</b>: les candidates no escollides.</li>
<li><b>Clau forana</b>: atribut que fa referència a la clau primària d'una altra taula.</li>
<li>Regles: <b>integritat d'entitat</b> (la clau primària no pot ser nul·la) i <b>integritat referencial</b> (una clau forana apunta a una fila existent o és nul·la). Accions en esborrar o actualitzar: <code>RESTRICT</code>, <code>CASCADE</code>, <code>SET NULL</code>, <code>SET DEFAULT</code>.</li>
<li>Restriccions: <code>NOT NULL</code>, <code>UNIQUE</code>, <code>CHECK</code>, <code>DEFAULT</code>.</li>
</ul>
<h3>Procés de disseny</h3>
<ol>
<li><b>Disseny conceptual</b>: model <b>entitat-relació</b> (Chen): entitats, atributs, relacions i <b>cardinalitats</b> (1:1, 1:N, N:M). Entitats febles, generalització i especialització.</li>
<li><b>Disseny lògic</b>: transformació a taules. Cada entitat és una taula; en una relació 1:N, la clau del costat 1 passa com a forana al costat N; una relació <b>N:M</b> genera una <b>taula intermèdia</b> amb les dues claus foranes (i els atributs de la relació); en una 1:1, la clau passa a qualsevol dels dos costats.</li>
<li><b>Normalització</b>.</li>
<li><b>Disseny físic</b>: tipus de dades, índexs, particions, segons l'SGBD.</li>
</ol>
<h3>Normalització</h3>
<div class="tbl"><table>
<tr><th>Forma</th><th>Condició</th></tr>
<tr><td><b>1FN</b></td><td>Valors atòmics, sense grups repetitius.</td></tr>
<tr><td><b>2FN</b></td><td>1FN i cap atribut no clau depèn només d'una part d'una clau composta (sense dependències parcials).</td></tr>
<tr><td><b>3FN</b></td><td>2FN i cap atribut no clau depèn d'un altre atribut no clau (sense dependències transitives).</td></tr>
<tr><td><b>FNBC</b></td><td>Tot determinant és clau candidata.</td></tr>
<tr><td>4FN, 5FN</td><td>Eliminen dependències multivalor i de combinació.</td></tr>
</table></div>
<p>La normalització evita redundàncies i anomalies d'inserció, actualització i esborrament. La <b>desnormalització</b> controlada pot millorar el rendiment de lectura (p. ex. en magatzems de dades).</p>
<h3>Àlgebra i SQL</h3>
<p>Operacions de l'àlgebra relacional: selecció (σ), projecció (π), unió, diferència, producte cartesià, intersecció, combinació (<i>join</i>) i divisió. Tipus de JOIN en SQL: <code>INNER</code>, <code>LEFT</code>, <code>RIGHT</code>, <code>FULL OUTER</code>, <code>CROSS</code>. Transaccions amb propietats <b>ACID</b>: atomicitat, consistència, aïllament i durabilitat.</p>`,

"mysql":{url:"https://www.mysql.com",prompt:'<span class="ps">mysql&gt;</span> SHOW DATABASES;',
summary:`
<h3>MySQL</h3>
<p>SGBD relacional de <b>codi obert</b> (llicència GPL) propietat d'<b>Oracle</b> des del 2010 (abans MySQL AB i Sun). Té també edicions comercials (<b>Enterprise</b>) i el servei al núvol <b>HeatWave</b>. <b>MariaDB</b> és una bifurcació comunitària. Forma part de la pila <b>LAMP</b>. Port per defecte: <b>3306</b>. Versions: 8.0, 8.4 LTS i 9.x (<i>innovation</i>).</p>
<h3>Motors d'emmagatzematge</h3>
<ul>
<li><b>InnoDB</b> (per defecte des de 5.5): transaccions <b>ACID</b>, bloqueig per fila, <b>claus foranes</b>, recuperació davant fallades, MVCC. Nivell d'aïllament per defecte: <b>REPEATABLE READ</b>.</li>
<li><b>MyISAM</b>: antic, sense transaccions ni claus foranes, bloqueig per taula.</li>
<li>Altres: MEMORY, CSV, ARCHIVE. Es pot veure el motor amb <code>SHOW TABLE STATUS</code> o <code>SHOW ENGINES</code>.</li>
</ul>
<h3>SQL i objectes</h3>
<ul>
<li>Tipus: <code>INT</code>, <code>BIGINT</code>, <code>DECIMAL</code>, <code>VARCHAR</code>, <code>TEXT</code>, <code>DATE</code>, <code>DATETIME</code>, <code>TIMESTAMP</code>, <code>ENUM</code>, <b><code>JSON</code></b>. Autonumèric amb <code>AUTO_INCREMENT</code>.</li>
<li>Joc de caràcters recomanat: <b>utf8mb4</b> (UTF-8 complet, emojis inclosos). L'antic <code>utf8</code> (utf8mb3) només admet fins a 3 bytes.</li>
<li>Paginació amb <code>LIMIT</code> i <code>OFFSET</code>. Des de la 8.0: <b>funcions de finestra</b> (<code>ROW_NUMBER</code>, <code>RANK</code>), <b>CTE</b> (<code>WITH</code>, també recursives), rols.</li>
<li>Vistes, procediments emmagatzemats, funcions, disparadors i esdeveniments programats (<i>event scheduler</i>).</li>
<li>Rendiment: índexs (B-tree, FULLTEXT, espacials), <code>EXPLAIN</code> / <code>EXPLAIN ANALYZE</code>, <i>slow query log</i>.</li>
</ul>
<h3>Administració</h3>
<ul>
<li>Client <code>mysql</code>, <b>MySQL Workbench</b> (disseny, SQL i administració) i <b>MySQL Shell</b>. Configuració a <code>my.cnf</code> / <code>my.ini</code>.</li>
<li>Usuaris amb format <code>'usuari'@'host'</code>: <code>CREATE USER</code>, <code>GRANT</code>, <code>REVOKE</code>. Autenticació per defecte a 8.x: <code>caching_sha2_password</code>.</li>
<li>Còpies: <b>mysqldump</b> (lògica), MySQL Shell dump, MySQL Enterprise Backup (física), registre binari (<i>binlog</i>) per a la recuperació en un punt del temps.</li>
<li>Alta disponibilitat: <b>replicació</b> origen-rèplica (asíncrona o semisíncrona, amb GTID), <b>Group Replication</b>, <b>InnoDB Cluster</b> (amb MySQL Router) i InnoDB ClusterSet.</li>
</ul>`,

summary:`
<h3>Contenidors i Docker</h3>
<p>Un <b>contenidor</b> és un procés aïllat que empaqueta una aplicació amb les seves dependències. A diferència d'una màquina virtual, <b>comparteix el nucli</b> del sistema amfitrió, de manera que és més lleuger i arrenca en segons. A Linux, l'aïllament es basa en <b>namespaces</b> (processos, xarxa, muntatges, usuaris) i <b>cgroups</b> (límits de CPU i memòria). Docker segueix els estàndards de l'<b>OCI</b> (Open Container Initiative).</p>
<h3>Components</h3>
<ul>
<li><b>Docker Engine</b>: dimoni <code>dockerd</code>, API REST i client <code>docker</code>. Fa servir <b>containerd</b> i <b>runc</b> per executar contenidors.</li>
<li><b>Imatge</b>: plantilla de només lectura formada per <b>capes</b>. <b>Contenidor</b>: instància en execució d'una imatge, amb una capa d'escriptura.</li>
<li><b>Registre</b>: magatzem d'imatges (<b>Docker Hub</b>, registres privats com Harbor). Nom: <code>registre/repositori:etiqueta</code> (per defecte <code>latest</code>).</li>
<li><b>Docker Desktop</b> (Windows i macOS), <b>Docker Compose</b> i <b>Docker Swarm</b> (orquestració nativa).</li>
</ul>
<h3>Dockerfile</h3>
<pre>FROM eclipse-temurin:21-jre           # imatge base
WORKDIR /app
COPY target/app.jar app.jar
ENV TZ=Europe/Madrid
EXPOSE 8080                           # documenta el port
USER 1000                             # no executar com a root
ENTRYPOINT ["java", "-jar", "app.jar"]</pre>
<ul>
<li>Instruccions: <code>FROM</code>, <code>RUN</code> (s'executa en construir), <code>COPY</code> / <code>ADD</code>, <code>WORKDIR</code>, <code>ENV</code>, <code>ARG</code> (només en construir), <code>EXPOSE</code>, <code>VOLUME</code>, <code>USER</code>, <code>HEALTHCHECK</code>, <code>CMD</code> i <code>ENTRYPOINT</code>.</li>
<li><code>CMD</code> dona l'ordre o els arguments per defecte i es pot substituir en el <code>docker run</code>; <code>ENTRYPOINT</code> fixa l'executable.</li>
<li>Bones pràctiques: <b>construccions multietapa</b> (compilar en una etapa i copiar només el resultat), imatges base petites, <code>.dockerignore</code>, ordenar les capes per aprofitar la memòria cau, no posar secrets a la imatge.</li>
</ul>
<h3>Ordres i conceptes</h3>
<ul>
<li><code>docker build -t app:1.0 .</code>, <code>docker run -d -p 8080:8080 --name app app:1.0</code>, <code>docker ps -a</code>, <code>docker logs -f</code>, <code>docker exec -it app sh</code>, <code>docker stop</code>, <code>docker rm</code>, <code>docker images</code>, <code>docker pull</code> / <code>push</code>, <code>docker system prune</code>.</li>
<li><b>Persistència</b>: les dades del contenidor es perden en eliminar-lo. Es fan servir <b>volums</b> (gestionats per Docker), <b>bind mounts</b> (carpeta de l'amfitrió) o <code>tmpfs</code>.</li>
<li><b>Xarxes</b>: <code>bridge</code> (per defecte), <code>host</code>, <code>none</code> i <code>overlay</code> (Swarm). En una xarxa bridge definida per l'usuari, els contenidors es troben pel nom.</li>
<li><b>Docker Compose</b>: fitxer <code>compose.yaml</code> amb serveis, xarxes i volums; <code>docker compose up -d</code> i <code>down</code>.</li>
</ul>`,

"k8s":{url:"https://kubernetes.io/es/docs/home/",prompt:'<span class="ps">$</span> kubectl get pods -A',
summary:`
<h3>Què és Kubernetes</h3>
<p>Plataforma de codi obert per <b>orquestrar contenidors</b>: automatitza el desplegament, l'escalat, la recuperació i la gestió d'aplicacions en un clúster. Va néixer a Google (inspirat en Borg) i ara la manté la <b>CNCF</b>. S'abreuja <b>K8s</b>. Funciona de manera <b>declarativa</b>: es descriu l'estat desitjat (normalment en YAML) i els controladors el fan complir.</p>
<h3>Arquitectura del clúster</h3>
<ul>
<li><b>Pla de control</b>: <b>kube-apiserver</b> (porta d'entrada, API REST), <b>etcd</b> (magatzem clau-valor amb l'estat del clúster), <b>kube-scheduler</b> (assigna pods a nodes) i <b>kube-controller-manager</b> (bucles de control). Opcionalment, cloud-controller-manager.</li>
<li><b>Nodes</b> de treball: <b>kubelet</b> (agent que garanteix que els contenidors dels pods s'executen), <b>kube-proxy</b> (regles de xarxa per als Services) i un <b>container runtime</b> compatible amb CRI (containerd, CRI-O).</li>
</ul>
<h3>Objectes principals</h3>
<div class="tbl"><table>
<tr><th>Objecte</th><th>Funció</th></tr>
<tr><td><b>Pod</b></td><td>Unitat mínima de desplegament: un o diversos contenidors que comparteixen xarxa (IP) i volums.</td></tr>
<tr><td><b>ReplicaSet</b></td><td>Manté un nombre de rèpliques d'un pod.</td></tr>
<tr><td><b>Deployment</b></td><td>Gestiona ReplicaSets: actualitzacions progressives (<i>rolling update</i>) i tornada enrere (<i>rollback</i>).</td></tr>
<tr><td><b>StatefulSet</b></td><td>Aplicacions amb estat (identitat i emmagatzematge estables), com bases de dades.</td></tr>
<tr><td><b>DaemonSet</b></td><td>Un pod a cada node (agents de logs o monitoratge).</td></tr>
<tr><td><b>Job</b> / <b>CronJob</b></td><td>Tasques que acaben / tasques programades.</td></tr>
<tr><td><b>Service</b></td><td>Punt d'accés estable a un conjunt de pods: <code>ClusterIP</code> (intern, per defecte), <code>NodePort</code>, <code>LoadBalancer</code>, <code>ExternalName</code>.</td></tr>
<tr><td><b>Ingress</b> / Gateway API</td><td>Encaminament HTTP/HTTPS extern per nom i ruta cap als Services.</td></tr>
<tr><td><b>ConfigMap</b> / <b>Secret</b></td><td>Configuració i dades sensibles (codificades en base64, no xifrades per defecte).</td></tr>
<tr><td><b>PersistentVolume</b> / <b>PVC</b> / StorageClass</td><td>Emmagatzematge persistent i la seva sol·licitud.</td></tr>
<tr><td><b>Namespace</b></td><td>Divisió lògica del clúster.</td></tr>
</table></div>
<h3>Funcionament i eines</h3>
<ul>
<li>Les <b>etiquetes</b> (<i>labels</i>) i els <b>selectors</b> relacionen objectes (p. ex. quins pods atén un Service).</li>
<li>Sondes: <b>liveness</b> (si falla, es reinicia el contenidor), <b>readiness</b> (si falla, no rep trànsit) i startup.</li>
<li>Recursos: <i>requests</i> i <i>limits</i> de CPU i memòria. Escalat automàtic amb l'<b>HPA</b> (Horizontal Pod Autoscaler).</li>
<li>Seguretat: <b>RBAC</b> (Role, ClusterRole, RoleBinding), ServiceAccounts, NetworkPolicies.</li>
<li><code>kubectl apply -f</code>, <code>get</code>, <code>describe</code>, <code>logs</code>, <code>exec</code>, <code>scale</code>, <code>rollout status|undo</code>, <code>delete</code>. Paquets amb <b>Helm</b>. Entorns locals: minikube, kind.</li>
</ul>`,

"jenkins":{url:"https://www.jenkins.io",prompt:'<span class="ps">$</span> jenkins build #42',
summary:`
<h3>Jenkins</h3>
<p>Servidor d'<b>automatització</b> de codi obert escrit en Java, molt utilitzat per a la <b>integració contínua</b> (CI) i el <b>lliurament o desplegament continu</b> (CD). Neix el 2011 com a bifurcació de Hudson. Té més de mil <b>connectors</b> (Git, Maven, Docker, Kubernetes, SonarQube, JUnit…).</p>
<h3>Conceptes CI/CD</h3>
<ul>
<li><b>Integració contínua</b>: integrar els canvis sovint en el repositori principal, amb compilació i proves automàtiques a cada canvi.</li>
<li><b>Lliurament continu</b>: el programari sempre està a punt per desplegar-se, amb aprovació manual per a producció. <b>Desplegament continu</b>: desplegament automàtic a producció si passa totes les fases.</li>
</ul>
<h3>Arquitectura</h3>
<ul>
<li><b>Controlador</b> (abans "master"): desa la configuració, programa les feines i ofereix la interfície web. Directori <code>JENKINS_HOME</code>.</li>
<li><b>Agents</b> (abans "slaves"): executen les feines; es connecten per SSH, JNLP/inbound o com a contenidors dinàmics a Docker o Kubernetes. Cada agent té <b>executors</b> i <b>etiquetes</b>.</li>
<li>Tipus de feines: <i>Freestyle</i>, <b>Pipeline</b>, <b>Multibranch Pipeline</b> (una feina per branca o pull request) i <i>Organization folders</i>.</li>
</ul>
<h3>Pipelines</h3>
<p>Definits com a codi en un <b>Jenkinsfile</b> desat al repositori. Dues sintaxis: <b>declarativa</b> (recomanada, estructura fixa) i <b>scripted</b> (Groovy lliure).</p>
<pre>pipeline {
  agent any
  tools { maven 'Maven3' }
  stages {
    stage('Compilar') { steps { sh 'mvn -B clean compile' } }
    stage('Proves')   { steps { sh 'mvn -B test' }
                        post { always { junit 'target/surefire-reports/*.xml' } } }
    stage('Empaquetar') { steps { sh 'mvn -B package -DskipTests' } }
    stage('Desplegar') {
      when { branch 'main' }
      steps { input 'Desplegar a producció?'; sh './desplega.sh' }
    }
  }
  post { failure { mail to: 'equip@ub.edu', subject: 'Build fallida', body: env.BUILD_URL } }
}</pre>
<ul>
<li>Elements: <code>agent</code>, <code>stages</code>, <code>stage</code>, <code>steps</code>, <code>environment</code>, <code>parameters</code>, <code>options</code>, <code>when</code>, <code>parallel</code>, <code>post</code> (<code>always</code>, <code>success</code>, <code>failure</code>).</li>
<li><b>Disparadors</b>: <i>webhooks</i> del repositori, <i>poll SCM</i>, programació tipus cron (<code>H/15 * * * *</code>), després d'una altra feina o manual.</li>
<li><b>Credencials</b> desades de forma segura i referenciades amb <code>credentials()</code> o <code>withCredentials</code>. <b>Shared libraries</b> per reutilitzar codi de pipelines.</li>

"sso":{url:"https://en.wikipedia.org/wiki/Single_sign-on",prompt:'<span class="ps">$</span> login --once',
summary:`
<h3>Concepte</h3>
<p>L'<b>inici de sessió únic</b> (SSO) és un esquema d'autenticació en què l'usuari s'identifica <b>una sola vegada</b> davant d'un servei central i després pot accedir a diverses aplicacions independents sense tornar a introduir credencials. El <b>tancament de sessió únic</b> (<i>single logout</i>, SLO) és l'invers: tancar la sessió una vegada la tanca a tots els serveis, tot i que és més difícil d'implementar.</p>
<h3>Actors</h3>
<ul>
<li><b>Proveïdor d'identitat</b> (IdP): autentica l'usuari i emet asseveracions o tokens. A la UB i a les universitats catalanes, l'autenticació federada passa per l'IdP institucional, i entre institucions per federacions com <b>SIR</b> (RedIRIS) o eduGAIN.</li>
<li><b>Proveïdor de serveis</b> (SP) o <b>part que confia</b> (RP): l'aplicació, que confia en l'IdP.</li>
<li>Relació de <b>confiança</b>, normalment basada en metadades i certificats.</li>
</ul>
<h3>Protocols i tecnologies</h3>
<ul>
<li><b>SAML 2.0</b>: XML, molt usat en entorns empresarials i acadèmics (Shibboleth).</li>
<li><b>OpenID Connect</b>: capa d'identitat sobre OAuth 2.0, amb JSON i JWT. Habitual en web i mòbil.</li>
<li><b>CAS</b>: protocol amb tiquets, nascut a Yale i molt implantat a les universitats.</li>
<li><b>Kerberos</b>: SSO dins d'una xarxa corporativa (dominis Windows) amb tiquets; SPNEGO l'estén al web.</li>
<li>Altres: WS-Federation, LDAP com a magatzem d'usuaris (no és SSO per si mateix), targetes intel·ligents i certificats.</li>
</ul>
<h3>Avantatges i riscos</h3>
<ul>
<li><b>Avantatges</b>: menys contrasenyes (menys "fatiga" i menys reutilització), millor experiència, gestió centralitzada d'altes i baixes, menys incidències de suport, punt únic on aplicar la <b>MFA</b> i l'auditoria.</li>
<li><b>Riscos</b>: <b>punt únic de fallada</b> (si cau l'IdP no s'hi pot accedir) i <b>punt únic de compromís</b> (unes credencials robades donen accés a tot). Es mitiguen amb alta disponibilitat, MFA, sessions amb caducitat i monitoratge.</li>
<li>Cal distingir <b>SSO</b> (una autenticació, molts serveis) de <b>sincronització de contrasenyes</b> o <b>mateixa contrasenya</b> (credencials iguals però autenticacions separades) i de la <b>identitat federada</b> (SSO entre organitzacions diferents).</li>
</ul>`,

"abac":{url:"https://en.wikipedia.org/wiki/Attribute-based_access_control",prompt:'<span class="ps">$</span> policy eval --abac',
summary:`
<h3>Concepte</h3>
<p>El <b>control d'accés basat en atributs</b> (ABAC) decideix si es concedeix un accés avaluant <b>polítiques</b> que combinen <b>atributs</b>. És més flexible i de gra més fi que RBAC. El NIST el descriu a la publicació <b>SP 800-162</b>.</p>
<h3>Tipus d'atributs</h3>
<ul>
<li><b>Del subjecte</b>: qui fa la petició (departament, càrrec, col·lectiu, nivell d'autorització).</li>
<li><b>Del recurs o objecte</b>: què es vol accedir (propietari, classificació, tipus de document, centre).</li>
<li><b>De l'acció</b>: llegir, modificar, esborrar, aprovar.</li>
<li><b>De l'entorn o context</b>: hora, ubicació, xarxa d'origen, tipus de dispositiu, nivell de risc.</li>
</ul>
<p>Exemple de política: "Un membre del PDI pot <i>modificar</i> les qualificacions d'una assignatura si n'és el professor responsable, el període d'avaluació està obert i es connecta des de la xarxa de la universitat".</p>
<h3>Arquitectura (XACML / NIST)</h3>
<div class="tbl"><table>
<tr><th>Component</th><th>Funció</th></tr>
<tr><td><b>PEP</b> (Policy Enforcement Point)</td><td>Intercepta la petició i aplica la decisió.</td></tr>
<tr><td><b>PDP</b> (Policy Decision Point)</td><td>Avalua les polítiques i decideix (permetre o denegar).</td></tr>
<tr><td><b>PIP</b> (Policy Information Point)</td><td>Obté els valors dels atributs (LDAP, bases de dades).</td></tr>
<tr><td><b>PAP</b> (Policy Administration Point)</td><td>Crea i gestiona les polítiques.</td></tr>
</table></div>
<p><b>XACML</b> (estàndard d'OASIS, en XML) és el llenguatge clàssic per expressar polítiques ABAC. Alternatives modernes: Open Policy Agent (Rego), AWS Cedar, ALFA.</p>
<h3>Comparació amb RBAC</h3>
<ul>
<li><b>Avantatges</b>: control molt detallat i contextual, menys "explosió de rols", s'adapta a situacions dinàmiques i a usuaris externs sense haver-los de preassignar rols.</li>
<li><b>Inconvenients</b>: més complex de dissenyar, provar i auditar ("qui pot accedir a què?" és difícil de respondre), i depèn de la qualitat dels atributs.</li>
<li>Sovint es combinen: rols com un atribut més del subjecte dins de polítiques ABAC.</li>
</ul>`,

"rbac":{url:"https://en.wikipedia.org/wiki/Role-based_access_control",prompt:'<span class="ps">$</span> grant role lector',
summary:`
<h3>Concepte</h3>
<p>El <b>control d'accés basat en rols</b> (RBAC) assigna els <b>permisos a rols</b> i els <b>rols a usuaris</b>. L'usuari obté els permisos a través dels rols que té. Els rols solen correspondre a funcions de l'organització (bibliotecari, gestor, administrador). Està estandarditzat pel <b>NIST</b> i per l'ANSI/INCITS 359-2004.</p>
<h3>Elements</h3>
<ul>
<li><b>Usuaris</b>, <b>rols</b>, <b>permisos</b> (operació sobre un objecte) i <b>sessions</b> (els rols activats per un usuari en un moment donat).</li>
<li>Regles: assignació de rols (només es poden exercir permisos de rols assignats), autorització de rols (només s'activen rols autoritzats) i autorització de permisos.</li>
</ul>
<h3>Models del NIST</h3>
<div class="tbl"><table>
<tr><th>Model</th><th>Afegeix</th></tr>
<tr><td>RBAC pla (core)</td><td>Usuaris, rols, permisos i sessions.</td></tr>
<tr><td>RBAC jeràrquic</td><td><b>Jerarquia de rols</b>: un rol superior hereta els permisos dels inferiors.</td></tr>
<tr><td>RBAC restringit</td><td><b>Separació de funcions</b> (SoD): <i>estàtica</i> (no es poden assignar a la mateixa persona dos rols incompatibles) i <i>dinàmica</i> (no es poden activar alhora en la mateixa sessió).</td></tr>
<tr><td>RBAC simètric</td><td>Revisió de permisos i rols (quins rols tenen un permís, i viceversa).</td></tr>
</table></div>
<h3>Comparació i aplicació</h3>
<ul>
<li>Respecte a <b>DAC</b> (discrecional: el propietari decideix, p. ex. permisos Unix) i <b>MAC</b> (obligatori: etiquetes de seguretat fixades pel sistema), RBAC és neutre i reflecteix l'estructura de l'organització.</li>
<li><b>Avantatges</b>: administració senzilla (canviar els rols d'una persona en lloc de molts permisos), auditoria clara, aplicació del <b>mínim privilegi</b> i de la separació de funcions.</li>
<li><b>Inconvenients</b>: <i>explosió de rols</i> quan calen excepcions o regles contextuals; no té en compte el context (hora, ubicació). Per això es combina amb ABAC.</li>
<li>Exemples: grups d'Active Directory, rols de bases de dades (<code>CREATE ROLE</code>, <code>GRANT</code>), RBAC de Kubernetes, rols de Drupal o WordPress.</li>
</ul>`,

"saml":{url:"https://en.wikipedia.org/wiki/SAML_2.0",prompt:'<span class="ps">&lt;saml:</span>Assertion&gt;',
summary:`
<h3>Què és SAML 2.0</h3>
<p><b>Security Assertion Markup Language</b> és un estàndard d'<b>OASIS</b> (versió 2.0 del 2005) basat en <b>XML</b> per intercanviar dades d'autenticació i autorització entre un <b>proveïdor d'identitat (IdP)</b> i un <b>proveïdor de serveis (SP)</b>. És la base de molts SSO web, especialment en l'àmbit acadèmic (Shibboleth, federacions SIR i eduGAIN) i empresarial. La wiki del comitè tècnic de seguretat d'OASIS en recull les especificacions i la documentació.</p>
<h3>Components de l'especificació</h3>
<ul>
<li><b>Asseveracions</b> (<i>assertions</i>): declaracions de l'IdP sobre un subjecte. Tipus: d'<b>autenticació</b> (com i quan s'ha autenticat), d'<b>atributs</b> (nom, correu, afiliació) i de <b>decisió d'autorització</b>. Inclouen emissor, subjecte (<code>NameID</code>), condicions de validesa (<code>NotBefore</code>, <code>NotOnOrAfter</code>, <code>AudienceRestriction</code>) i <b>signatura XML</b>.</li>
<li><b>Protocols</b>: missatges de petició i resposta com <code>AuthnRequest</code> i <code>Response</code>, <i>Single Logout</i>, <i>Artifact Resolution</i>.</li>
<li><b>Vinculacions</b> (<i>bindings</i>): com viatgen els missatges. <b>HTTP-Redirect</b> (paràmetres a la URL, per a missatges curts com l'AuthnRequest), <b>HTTP-POST</b> (formulari autoenviat, habitual per a la resposta), <b>HTTP-Artifact</b> (es passa una referència i el missatge s'obté per un canal posterior) i SOAP.</li>
<li><b>Perfils</b>: combinacions per a casos d'ús, sobretot el <b>Web Browser SSO Profile</b>.</li>
<li><b>Metadades</b>: document XML de cada entitat amb l'<code>entityID</code>, els endpoints i els certificats. Base de la confiança.</li>
</ul>
<h3>Flux iniciat pel SP</h3>
<ol>
<li>L'usuari accedeix a l'aplicació (SP) sense sessió.</li>
<li>El SP genera un <code>AuthnRequest</code> i redirigeix el navegador a l'IdP (HTTP-Redirect).</li>
<li>L'IdP autentica l'usuari (si no tenia sessió).</li>
<li>L'IdP retorna una <code>Response</code> signada amb l'asseveració a l'<b>Assertion Consumer Service</b> (ACS) del SP, per HTTP-POST a través del navegador.</li>
<li>El SP valida la signatura, l'audiència, les dates i el destinatari, i crea la sessió local.</li>
</ol>
<p>També hi ha el flux <b>iniciat per l'IdP</b> (sense petició prèvia), més exposat a atacs. Seguretat: signatura i, opcionalment, xifratge de les asseveracions, TLS, protecció contra repeticions i contra l'<i>XML Signature Wrapping</i>. SAML és sobretot per a navegadors; per a API i mòbils s'acostuma a fer servir OAuth 2.0 / OpenID Connect.</p>`,

"cas":{url:"https://www.okta.com/identity-101/central-authentication-service/",prompt:'<span class="ps">$</span> cas --ticket ST-1',
summary:`
<h3>Què és CAS</h3>
<p>El <b>Central Authentication Service</b> és un protocol de <b>SSO web</b> creat a la <b>Universitat de Yale</b> (2001) i mantingut ara per <b>Apereo</b>, que també desenvolupa el servidor CAS de codi obert (Java, Spring). Està molt estès a les universitats. L'usuari s'autentica només davant del servidor CAS, i les aplicacions no veuen mai la seva contrasenya.</p>
<h3>Tiquets</h3>
<ul>
<li><b>TGT</b> (<i>Ticket-Granting Ticket</i>): es crea quan l'usuari s'autentica i es guarda a la galeta <b>TGC</b> del domini del servidor CAS. Permet obtenir tiquets de servei sense tornar a demanar credencials (és el que dona el SSO).</li>
<li><b>ST</b> (<i>Service Ticket</i>): tiquet <b>d'un sol ús</b> i de vida molt curta per a un servei concret.</li>
<li><b>PGT</b> i <b>PT</b> (<i>Proxy-Granting</i> i <i>Proxy Ticket</i>): permeten que un servei accedeixi a un altre en nom de l'usuari.</li>
</ul>
<h3>Flux bàsic</h3>
<ol>
<li>L'usuari entra a l'aplicació, que el redirigeix a <code>/cas/login?service=URL_aplicacio</code>.</li>
<li>CAS l'autentica (o reconeix el TGC) i el redirigeix a l'aplicació amb <code>?ticket=ST-...</code>.</li>
<li>L'aplicació valida el tiquet directament amb el servidor CAS (canal de servidor a servidor) a <code>/serviceValidate</code> o <code>/p3/serviceValidate</code>.</li>
<li>CAS respon amb l'usuari autenticat i, en la versió 3, els <b>atributs</b>. L'aplicació crea la sessió.</li>
</ol>
<h3>Característiques</h3>
<ul>
<li>Versions del protocol: CAS 1 (text), CAS 2 (XML, proxies) i CAS 3 (atributs, respostes XML o JSON).</li>
<li>El servidor CAS també parla <b>SAML</b>, <b>OAuth 2.0</b> i <b>OpenID Connect</b>, admet MFA i pot autenticar contra LDAP, Active Directory, bases de dades, etc.</li>
<li>Registre de serveis autoritzats (<i>service registry</i>) per evitar redireccions cap a aplicacions no permeses. Logout centralitzat (SLO).</li>
<li>Clients per a Java, PHP (phpCAS), Apache (<code>mod_auth_cas</code>), .NET i altres.</li>
</ul>`,

["On es va crear CAS?",["MIT","Universitat de Yale","Stanford","CERN"],1,"Ara el manté la comunitat Apereo."],
["Quin tiquet és d'un sol ús i per a un servei concret?",["TGT","ST","PGT","TGC"],1,"El Service Ticket caduca en pocs segons i només es pot validar una vegada."],

["Com valida l'aplicació el tiquet de servei?",["Desxifrant-lo localment","Fent una petició directa al servidor CAS (serviceValidate)","Comparant-lo amb una llista","No cal validar-lo"],1,"És un canal de servidor a servidor, no passa pel navegador."],
["Quina versió del protocol CAS va afegir els atributs de l'usuari a la resposta?",["CAS 1","CAS 2","CAS 3","CAS 4"],2,"CAS 2 va afegir els proxies i les respostes XML."],
["Per a què serveixen els tiquets proxy?",["Per tancar sessió","Per accedir a un altre servei en nom de l'usuari","Per xifrar","Per registrar serveis"],1,"El servei obté un PGT i en genera PT per al servei de backend."],
["L'aplicació client veu la contrasenya de l'usuari?",["Sí","No, només rep i valida tiquets","Només la primera vegada","Depèn del navegador"],1,"És un dels avantatges de seguretat del model."]

practice:[

"oauth":{url:"https://oauth.net/2/",prompt:'<span class="ps">Authorization:</span> Bearer ey...',
summary:`
<h3>Què és OAuth 2.0</h3>
<p><b>OAuth 2.0</b> (RFC 6749, 2012) és un marc de <b>delegació d'autorització</b>: permet que una aplicació accedeixi a recursos d'un usuari en un altre servei <b>sense conèixer la seva contrasenya</b>, amb un permís limitat (àmbits) i revocable. <b>No és un protocol d'autenticació</b>: per identificar l'usuari es fa servir OpenID Connect a sobre. Auth0 i oauth.net expliquen el marc i n'enumeren les especificacions relacionades.</p>
<h3>Rols</h3>
<ul>
<li><b>Propietari del recurs</b> (<i>resource owner</i>): normalment l'usuari.</li>
<li><b>Client</b>: l'aplicació que vol accedir. Pot ser <b>confidencial</b> (pot guardar un secret, com un backend) o <b>públic</b> (SPA, aplicació mòbil).</li>
<li><b>Servidor d'autorització</b>: autentica l'usuari, demana el consentiment i emet tokens.</li>
<li><b>Servidor de recursos</b>: l'API que accepta els tokens.</li>
</ul>
<h3>Tokens i àmbits</h3>
<ul>
<li><b>Access token</b>: credencial de vida curta que s'envia a l'API amb la capçalera <code>Authorization: Bearer ...</code>. Pot ser opac o un <b>JWT</b>.</li>
<li><b>Refresh token</b>: permet obtenir nous access tokens sense intervenció de l'usuari.</li>
<li><b>Scopes</b> (àmbits): limiten què pot fer el token (p. ex. <code>read:calendar</code>).</li>
<li>Endpoints: <code>/authorize</code> (interacció amb l'usuari) i <code>/token</code> (emissió de tokens).</li>
</ul>
<h3>Fluxos (grant types)</h3>
<div class="tbl"><table>
<tr><th>Flux</th><th>Ús</th></tr>
<tr><td><b>Authorization Code + PKCE</b></td><td>El recomanat per a aplicacions web, SPA i mòbils. El codi es canvia per un token al backchannel; PKCE (RFC 7636) evita la intercepció del codi.</td></tr>
<tr><td><b>Client Credentials</b></td><td>Comunicació entre màquines, sense usuari.</td></tr>
<tr><td><b>Device Authorization</b></td><td>Dispositius sense navegador o amb poca capacitat d'entrada (TV).</td></tr>
<tr><td><b>Refresh Token</b></td><td>Renovar l'access token.</td></tr>
<tr><td><s>Implicit</s>, <s>Password</s> (ROPC)</td><td>Desaconsellats: OAuth 2.1 els elimina.</td></tr>
</table></div>
<p>Especificacions relacionades: Bearer Token (RFC 6750), Token Introspection (RFC 7662), Token Revocation (RFC 7009), JWT (RFC 7519), metadades del servidor (RFC 8414), Best Current Practice de seguretat i el borrador d'<b>OAuth 2.1</b>, que consolida les bones pràctiques (PKCE obligatori, sense implicit ni password, URI de redirecció exactes).</p>`,
test:[
["Quin és l'objectiu principal d'OAuth 2.0?",["Autenticar usuaris","Delegar autorització d'accés a recursos sense compartir la contrasenya","Xifrar dades","Signar documents"],1,"Per a autenticació es fa servir OpenID Connect sobre OAuth 2.0."],
["Quin flux és el recomanat per a una SPA o una aplicació mòbil?",["Implicit","Password","Authorization Code amb PKCE","Client Credentials"],2,"Implicit i Password estan desaconsellats i desapareixen a OAuth 2.1."],

["Com s'envia normalment l'access token a una API?",["Al cos JSON","A la capçalera Authorization: Bearer","En una galeta sempre","A la URL"],1,"Definit a l'RFC 6750."],
["Què limiten els scopes?",["La durada del token","Els permisos concedits al client","El nombre d'usuaris","La mida del token"],1,"L'usuari consent àmbits concrets."],
["Quina amenaça mitiga PKCE?",["La injecció SQL","La intercepció del codi d'autorització","El XSS","La força bruta de contrasenyes"],1,"El client demostra que és qui ha iniciat la petició amb un code_verifier."],
["Quin component emet els tokens?",["El servidor de recursos","El servidor d'autorització","El client","El navegador"],1,"El servidor de recursos només els valida."],
["Quin és l'RFC principal d'OAuth 2.0?",["RFC 2616","RFC 6749","RFC 7519","RFC 8259"],1,"7519 és JWT i 8259 és JSON."]
],
practice:[
["Seqüència Authorization Code + PKCE","Descriu el flux complet per a una SPA que vol llegir el calendari de l'usuari.",`<ol><li>La SPA genera un <code>code_verifier</code> aleatori i el seu <code>code_challenge</code> (SHA-256).</li><li>Redirigeix a <code>/authorize?response_type=code&amp;client_id=...&amp;redirect_uri=...&amp;scope=calendar.read&amp;state=...&amp;code_challenge=...&amp;code_challenge_method=S256</code>.</li><li>L'usuari s'autentica i consent l'àmbit.</li><li>El servidor redirigeix a <code>redirect_uri?code=...&amp;state=...</code>. La SPA comprova el <code>state</code> (contra CSRF).</li><li>La SPA fa POST a <code>/token</code> amb el codi i el <code>code_verifier</code>.</li><li>Rep l'access token (i potser un refresh token amb rotació) i crida l'API amb <code>Authorization: Bearer</code>.</li></ol>`],
["Protegir una API","Tens una API REST que rep JWT d'un servidor d'autorització. Quines comprovacions ha de fer en cada petició?",`<ul><li>Verificar la <b>signatura</b> del JWT amb la clau pública del servidor (JWKS) i acceptar només algorismes esperats (mai <code>none</code>).</li><li>Comprovar <code>iss</code> (emissor), <code>aud</code> (que el token és per a aquesta API) i <code>exp</code>/<code>nbf</code> (vigència).</li><li>Comprovar que els <b>scopes</b> o rols permeten l'operació demanada.</li><li>Retornar 401 si el token no és vàlid i 403 si no té permisos.</li><li>Tot sobre HTTPS; per a tokens opacs, fer servir la introspecció (RFC 7662).</li></ul>`]
]},

"oidc":{url:"https://openid.net/developers/how-connect-works/",prompt:'<span class="ps">$</span> curl /.well-known/openid-configuration',
summary:`
<h3>Què és OpenID Connect</h3>
<p><b>OpenID Connect</b> (OIDC, 2014) és una <b>capa d'identitat sobre OAuth 2.0</b> definida per l'<b>OpenID Foundation</b>. Afegeix l'<b>autenticació</b> que OAuth no té: permet que una aplicació (la <i>Relying Party</i>, RP) verifiqui la identitat de l'usuari a partir de l'autenticació feta per un <b>proveïdor OpenID</b> (OP) i n'obtingui informació bàsica de perfil. Fa servir JSON i API REST, cosa que el fa adequat per a web, SPA i aplicacions mòbils.</p>
<h3>Elements que afegeix a OAuth</h3>
<ul>
<li><b>ID Token</b>: un <b>JWT</b> signat per l'OP que conté les <i>claims</i> de l'autenticació: <code>iss</code> (emissor), <code>sub</code> (identificador únic de l'usuari), <code>aud</code> (el client), <code>exp</code>, <code>iat</code>, <code>nonce</code>, <code>auth_time</code> i, opcionalment, nom, correu, etc. És <b>per al client</b>, no per cridar API.</li>
<li><b>Àmbit <code>openid</code></b>: obligatori perquè la petició sigui OIDC. Àmbits estàndard addicionals: <code>profile</code>, <code>email</code>, <code>address</code>, <code>phone</code>, <code>offline_access</code>.</li>
<li><b>Endpoint UserInfo</b>: retorna més dades de l'usuari a canvi de l'access token.</li>
<li><b>Discovery</b>: document a <code>/.well-known/openid-configuration</code> amb els endpoints, les claus i les capacitats. <b>JWKS</b>: claus públiques per verificar les signatures.</li>
<li><b>Registre dinàmic</b> de clients, gestió de sessió i <i>logout</i> (front-channel, back-channel, RP-initiated).</li>
</ul>
<h3>Fluxos</h3>
<ul>
<li><b>Authorization Code</b> (amb PKCE): el recomanat. L'ID token s'obté de l'endpoint de token.</li>
<li><b>Implicit</b> (desaconsellat) i <b>Híbrid</b> (combina tokens del frontchannel i del backchannel).</li>
</ul>
<h3>Validació de l'ID token</h3>
<p>El client ha de comprovar la signatura (amb les claus del JWKS), que <code>iss</code> és l'OP esperat, que <code>aud</code> conté el seu <code>client_id</code>, que no ha caducat (<code>exp</code>) i que el <code>nonce</code> coincideix amb el que va enviar (protecció contra repeticions).</p>
<h3>Comparació</h3>
<div class="tbl"><table>
<tr><th></th><th>OAuth 2.0</th><th>OpenID Connect</th><th>SAML 2.0</th></tr>
<tr><td>Objectiu</td><td>Autorització delegada</td><td>Autenticació (+ autorització d'OAuth)</td><td>Autenticació i atributs</td></tr>
<tr><td>Format</td><td>JSON, tokens</td><td>JSON, JWT</td><td>XML</td></tr>
<tr><td>Ús típic</td><td>API</td><td>Web, SPA, mòbil</td><td>SSO web empresarial i acadèmic</td></tr>
</table></div>
<p>Proveïdors habituals: Microsoft Entra ID, Google, Keycloak, Okta / Auth0 i el servidor CAS.</p>`,

summary:`
<h3>Què és un sistema de gestió de biblioteques</h3>
<p>Un <b>sistema integrat de gestió bibliotecària</b> (SIGB o ILS, <i>Integrated Library System</i>) és el programari que automatitza les operacions d'una biblioteca a partir d'una <b>base de dades única</b> compartida per tots els mòduls. L'evolució actual són les <b>plataformes de serveis bibliotecaris</b> (LSP, <i>Library Services Platform</i>): solucions al núvol, multientitat, que gestionen alhora els recursos impresos, electrònics i digitals.</p>
<h3>Mòduls</h3>
<ul>
<li><b>Adquisicions</b>: comandes, proveïdors, pressupostos, factures.</li>
<li><b>Catalogació</b>: registres bibliogràfics (MARC21), d'autoritat (noms, matèries) i d'exemplars; importació per Z39.50.</li>
<li><b>Circulació</b>: préstecs, retorns, renovacions, reserves, sancions, usuaris i polítiques de préstec.</li>
<li><b>Publicacions periòdiques</b> (control de fascicles).</li>
<li><b>OPAC</b> (catàleg en línia d'accés públic) o, més modernament, una <b>eina de descobriment</b> que cerca en un índex central amb el fons propi i el contingut electrònic subscrit.</li>
<li><b>Préstec interbibliotecari</b> i estadístiques i informes.</li>
<li>Gestió de recursos electrònics: subscripcions, llicències (ERM), <b>resolvedors d'enllaços OpenURL</b> i base de coneixement.</li>
</ul>
<h3>Exemples i context català</h3>
<ul>
<li>Comercials: <b>Alma</b> (LSP) i <b>Primo</b> (descobriment) d'Ex Libris, Sierra i Millennium, Symphony, WorldShare de OCLC. Codi obert: <b>Koha</b> i <b>FOLIO</b>.</li>
<li>Les biblioteques universitàries catalanes cooperen a través del <b>CSUC</b> (Consorci de Serveis Universitaris de Catalunya), amb el catàleg col·lectiu (CCUC) i una plataforma de gestió compartida, i amb el préstec consorciat (PUC).</li>
</ul>
<h3>Estàndards i protocols</h3>
<div class="tbl"><table>
<tr><th>Estàndard</th><th>Funció</th></tr>
<tr><td><b>MARC21</b></td><td>Format de registre bibliogràfic, d'autoritats i de fons</td></tr>
<tr><td><b>Z39.50</b> / <b>SRU</b></td><td>Cerca i recuperació de registres entre catàlegs (SRU és la versió web)</td></tr>
<tr><td><b>OAI-PMH</b></td><td>Recol·lecció de metadades de repositoris</td></tr>
<tr><td><b>NCIP</b>, <b>SIP2</b></td><td>Interoperabilitat de circulació (préstec interbibliotecari, màquines d'autopréstec)</td></tr>
<tr><td><b>OpenURL</b></td><td>Enllaç de la cita al text complet</td></tr>
<tr><td><b>RDA</b>, BIBFRAME</td><td>Normes de catalogació i model de dades enllaçades que vol substituir MARC</td></tr>
<tr><td><b>ISBN</b>, <b>ISSN</b>, DOI</td><td>Identificadors de llibres, publicacions en sèrie i objectes digitals</td></tr>
<tr><td>RFID</td><td>Identificació i seguretat d'exemplars</td></tr>
</table></div>`,

"drupal":{url:"https://www.drupal.org/documentation",prompt:'<span class="ps">$</span> drush cr',
summary:`
<h3>Drupal</h3>
<p>Sistema de gestió de continguts (CMS) i <b>framework</b> de codi obert en <b>PHP</b>, amb llicència GPL. És conegut per la seva flexibilitat en modelar continguts, per la seguretat i per l'escalabilitat, i molt usat per universitats i administracions. Des de Drupal 8 es basa en components de <b>Symfony</b> i fa servir <b>Twig</b> per a les plantilles i <b>Composer</b> per a les dependències. Versions actuals: 10 i 11. <b>Drupal CMS</b> és una distribució preconfigurada orientada a usuaris no tècnics.</p>
<h3>Conceptes</h3>
<ul>
<li><b>Entitats</b>: nodes (contingut), usuaris, termes de taxonomia, blocs personalitzats, mitjans, comentaris.</li>
<li><b>Tipus de contingut</b> (p. ex. Notícia, Esdeveniment) amb <b>camps</b> configurables (text, imatge, data, referència a entitat).</li>
<li><b>Taxonomia</b>: vocabularis i termes per classificar continguts.</li>
<li><b>Views</b>: constructor de llistats i consultes sense codi (pàgines, blocs, REST, RSS).</li>
<li><b>Blocs</b> i <b>regions</b> del tema; <b>Layout Builder</b> per a dissenys de pàgina.</li>
<li><b>Usuaris, rols i permisos</b> (RBAC). Rols per defecte: anònim, autenticat i administrador.</li>
<li><b>Mòduls</b> (funcionalitat: del nucli, contribuïts o personalitzats) i <b>temes</b> (aparença; Olivero és el de portada i Claro el d'administració).</li>
<li><b>Multilingüe</b> nadiu (interfície, contingut i configuració), útil per a webs en català, castellà i anglès.</li>
</ul>
<h3>Desenvolupament i administració</h3>
<ul>
<li><b>Configuration Management</b>: la configuració s'exporta a YAML per moure-la entre entorns (desenvolupament, preproducció, producció).</li>
<li><b>Drush</b>: eina de línia d'ordres (<code>drush cr</code> per buidar memòries cau, <code>drush updb</code>, <code>drush cex</code> / <code>cim</code>, <code>drush en</code>).</li>
<li>Estructura: <code>web/core</code>, <code>web/modules/contrib</code> i <code>custom</code>, <code>web/themes</code>, <code>web/sites/default/settings.php</code>.</li>
<li>Mòduls personalitzats: fitxer <code>.info.yml</code>, rutes (<code>.routing.yml</code>), controladors, serveis, <i>hooks</i> i plugins.</li>
<li>API: <b>JSON:API</b> i REST al nucli, per a usos <i>headless</i> o desacoblats.</li>
<li>Seguretat: avisos de l'equip de seguretat (<i>security advisories</i>), actualitzacions amb Composer, permisos mínims. Memòria cau interna, Redis/Memcached, Varnish.</li>
</ul>`,

"wp":{url:"https://wordpress.org/documentation/",prompt:'<span class="ps">$</span> wp plugin list',
summary:`
<h3>WordPress</h3>
<p>El CMS més utilitzat del món, de codi obert (GPL), escrit en <b>PHP</b> i amb base de dades <b>MySQL o MariaDB</b>. Va néixer com a plataforma de blogs el 2003. Cal distingir <b>WordPress.org</b> (programari per instal·lar en un servidor propi) de WordPress.com (servei allotjat d'Automattic).</p>
<h3>Conceptes</h3>
<ul>
<li>Tipus de contingut: <b>entrades</b> (<i>posts</i>, cronològiques, amb categories i etiquetes) i <b>pàgines</b> (estàtiques i jeràrquiques). Es poden crear <b>tipus personalitzats</b> (<i>custom post types</i>) i taxonomies personalitzades.</li>
<li><b>Editor de blocs (Gutenberg)</b>: el contingut es construeix amb blocs. <b>Full Site Editing</b> i temes de blocs (<code>theme.json</code>) permeten editar tot el lloc.</li>
<li><b>Temes</b> (aparença; es recomanen <i>temes fills</i> per personalitzar sense perdre-ho en actualitzar) i <b>extensions</b> (<i>plugins</i>, funcionalitat).</li>
<li><b>Rols</b> per defecte: Administrador, Editor, Autor, Col·laborador i Subscriptor (més Superadministrador en multilloc).</li>
<li>Mitjans, menús, ginys, comentaris, enllaços permanents (<i>permalinks</i>).</li>
<li><b>Multilloc</b> (<i>multisite</i>): diversos llocs amb una sola instal·lació.</li>
</ul>
<h3>Arquitectura tècnica</h3>
<ul>
<li>Fitxer de configuració <code>wp-config.php</code> (dades de la BD, claus i <i>salts</i>, prefix de taules, <code>WP_DEBUG</code>). Carpetes <code>wp-admin</code>, <code>wp-includes</code> i <code>wp-content</code> (temes, extensions i pujades).</li>
<li>Taules principals: <code>wp_posts</code>, <code>wp_postmeta</code>, <code>wp_users</code>, <code>wp_options</code>, <code>wp_terms</code>.</li>
<li><b>Hooks</b>: <b>accions</b> (<code>add_action</code>, executen codi en un moment) i <b>filtres</b> (<code>add_filter</code>, modifiquen dades). Són la base de les extensions.</li>
<li><b>The Loop</b> per mostrar entrades, <code>WP_Query</code>, jerarquia de plantilles, <i>shortcodes</i>.</li>
<li><b>API REST</b> a <code>/wp-json/</code>. <b>WP-CLI</b> per administrar des de la línia d'ordres. Tasques programades amb WP-Cron.</li>
</ul>
<h3>Seguretat i manteniment</h3>
<p>Mantenir actualitzats nucli, temes i extensions (la major part de vulnerabilitats són d'extensions), fer servir només extensions de confiança, contrasenyes fortes i 2FA, privilegis mínims, desactivar l'editor de fitxers (<code>DISALLOW_FILE_EDIT</code>), còpies de seguretat periòdiques, HTTPS i un tallafoc d'aplicacions.</p>`,

"dspace":{url:"https://wiki.lyrasis.org/display/DSDOC7x",prompt:'<span class="ps">$</span> dspace index-discovery',
summary:`
<h3>DSpace</h3>
<p>Programari de codi obert per crear <b>repositoris institucionals</b> d'accés obert: emmagatzema, preserva i difon la producció científica i acadèmica (articles, tesis, treballs de fi de grau, dades). El va crear el MIT amb HP (2002) i ara el manté <b>LYRASIS</b>, que en publica la documentació. El <b>Dipòsit Digital de la UB</b> està fet amb DSpace.</p>
<h3>Arquitectura de DSpace 7</h3>
<ul>
<li><b>Frontend</b>: aplicació <b>Angular</b> amb renderització al servidor (Angular Universal / SSR) per a l'indexació en cercadors.</li>
<li><b>Backend</b>: <b>API REST</b> en <b>Java</b> amb Spring Boot (HAL i JSON), que substitueix les antigues interfícies JSPUI i XMLUI.</li>
<li>Base de dades <b>PostgreSQL</b>, motor de cerca i navegació <b>Apache Solr</b> (<i>Discovery</i>) i emmagatzematge de fitxers (<i>assetstore</i>, local o S3).</li>
<li>Requisits habituals: JDK, Maven, Ant, Tomcat (o el servidor integrat), Node.js per al frontend.</li>
</ul>
<h3>Model de dades</h3>
<ul>
<li><b>Comunitats</b> (i subcomunitats) &gt; <b>col·leccions</b> &gt; <b>ítems</b> &gt; <b>bundles</b> &gt; <b>bitstreams</b> (fitxers).</li>
<li>Metadades amb <b>Dublin Core qualificat</b> per defecte (esquema <code>dc</code>) i esquemes addicionals configurables.</li>
<li><b>Entitats configurables</b> (novetat de DSpace 7): ítems que representen persones, projectes, revistes o unitats organitzatives, amb relacions entre si.</li>
<li>Cada ítem rep un identificador persistent <b>Handle</b> (també es pot fer servir DOI).</li>
</ul>
<h3>Funcionalitats</h3>
<ul>
<li><b>Dipòsit</b> (autoarxiu) amb formularis configurables i <b>flux de treball</b> de revisió (aprovar, rebutjar, editar metadades). Llicència de dipòsit.</li>
<li>Control d'accés per grups, polítiques per ítem i bitstream, i <b>embargaments</b>.</li>
<li>Interoperabilitat: <b>OAI-PMH</b> (recol·lecció de metadades per recol·lectors com RECERCAT, Recolecta o OpenAIRE), SWORD (dipòsit remot), compatibilitat amb OpenAIRE, Signposting.</li>
<li>Estadístiques d'ús, autenticació amb LDAP, Shibboleth/SAML, ORCID, i exportació en lot (Simple Archive Format, CSV).</li>
<li>Preservació: suma de verificació (<i>checksum checker</i>), formats de fitxer, exportació AIP (METS).</li>
<li>Administració per línia d'ordres amb la utilitat <code>dspace</code> (<code>index-discovery</code>, <code>filter-media</code>, <code>oai import</code>).</li>
</ul>`,

"ojs":{url:"https://pkp.sfu.ca/software/ojs/",prompt:'<span class="ps">$</span> php tools/upgrade.php check',
summary:`
<h3>Open Journal Systems</h3>
<p><b>OJS</b> és el programari de codi obert més utilitzat per gestionar i publicar <b>revistes científiques</b> en línia. El desenvolupa el <b>Public Knowledge Project</b> (PKP), amb seu a la Simon Fraser University. Està escrit en <b>PHP</b> i funciona amb MySQL/MariaDB o PostgreSQL. El PKP també fa <b>OMP</b> (monografies) i <b>OPS</b> (preprints). La UB publica les seves revistes al portal <b>RCUB</b> (Revistes Científiques de la UB), revistes.ub.edu, fet amb OJS.</p>
<h3>Flux editorial</h3>
<ol>
<li><b>Enviament</b>: l'autor registra l'article i les metadades.</li>
<li><b>Revisió</b>: l'editor assigna revisors; revisió per parells (cec, doble cec o oberta), en una o més rondes.</li>
<li><b>Decisió</b>: acceptar, demanar canvis o rebutjar.</li>
<li><b>Edició</b> (correcció d'estil).</li>
<li><b>Producció</b>: maquetació de les galerades (PDF, HTML, XML).</li>
<li><b>Publicació</b> en un número o de manera continuada.</li>
</ol>
<h3>Rols</h3>
<p>Administrador del lloc, gestor de la revista, editor, editor de secció, revisor, corrector, maquetador, autor i lector. Una instal·lació pot allotjar <b>diverses revistes</b>, cadascuna amb la seva configuració.</p>
<h3>Funcionalitats i interoperabilitat</h3>
<ul>
<li>Exposició de metadades per <b>OAI-PMH</b> (Dublin Core, MARC) per a indexadors i recol·lectors.</li>
<li>Assignació de <b>DOI</b> i dipòsit a <b>Crossref</b> o DataCite; integració amb <b>ORCID</b>.</li>
<li>Exportació a PubMed, DOAJ i altres; <b>Google Scholar</b> indexa a partir de les metadades de les pàgines.</li>
<li>Preservació amb la <b>PKP Preservation Network</b> (basada en LOCKSS).</li>
<li>Subscripcions o accés obert, embargaments, estadístiques compatibles amb COUNTER, multilingüe.</li>
<li>Sistema d'<b>extensions</b> (<i>plugins</i>) i temes. La versió 3.x té una interfície renovada i una API REST.</li>
</ul>`,

"metadades":{url:"https://www.loc.gov/marc/bibliographic/",prompt:'<span class="ps">245</span> 10 $a Títol',
summary:`
<h3>Per què metadades</h3>
<p>Les <b>metadades</b> són dades estructurades que descriuen recursos per permetre'n la cerca, la identificació, la gestió, l'accés i la preservació. Tipus: <b>descriptives</b> (títol, autor), <b>estructurals</b> (com s'organitzen les parts d'un objecte digital), <b>administratives</b> (drets, tècniques) i de <b>preservació</b>.</p>
<h3>Els cinc estàndards</h3>
<div class="tbl"><table>
<tr><th>Estàndard</th><th>Responsable</th><th>Ús</th></tr>
<tr><td><b>MARC21</b></td><td>Library of Congress</td><td>Catalogació bibliogràfica als SIGB. Formats bibliogràfic, d'autoritats, de fons, de classificació i d'informació comunitària.</td></tr>
<tr><td><b>Dublin Core</b></td><td>DCMI</td><td>Descripció senzilla i general de recursos, sobretot digitals. Base d'OAI-PMH.</td></tr>
<tr><td><b>MODS</b></td><td>Library of Congress</td><td>Descripció bibliogràfica en XML, més rica que DC i més senzilla que MARC.</td></tr>
<tr><td><b>METS</b></td><td>Library of Congress</td><td>Contenidor XML que empaqueta un objecte digital complet.</td></tr>
<tr><td><b>PREMIS</b></td><td>Library of Congress</td><td>Metadades de preservació digital.</td></tr>
</table></div>
<h3>MARC21</h3>
<ul>
<li>Estructura: <b>capçalera</b> (<i>leader</i>, 24 posicions), <b>directori</b> i <b>camps</b> identificats per una <b>etiqueta de tres dígits</b>. Camps de control (00X, sense indicadors ni subcamps) i camps de dades amb <b>dos indicadors</b> i <b>subcamps</b> (<code>$a</code>, <code>$b</code>…).</li>
<li>Camps clau: <code>001</code> número de control, <code>008</code> dades de longitud fixa, <code>020</code> ISBN, <code>022</code> ISSN, <code>100</code> autor personal principal, <code>245</code> títol i menció de responsabilitat, <code>250</code> edició, <code>264</code> (o 260) publicació, <code>300</code> descripció física, <code>490</code> col·lecció, <code>5XX</code> notes, <code>650</code> matèria temàtica, <code>700</code> autors secundaris, <code>856</code> accés electrònic.</li>
<li>Serialitzacions: ISO 2709 i <b>MARCXML</b>. Es complementa amb les regles de catalogació <b>RDA</b>. El model <b>BIBFRAME</b> vol substituir-lo amb dades enllaçades.</li>
</ul>
<h3>Dublin Core</h3>
<p>15 elements bàsics (norma <b>ISO 15836</b>), tots <b>opcionals i repetibles</b>: <code>title</code>, <code>creator</code>, <code>subject</code>, <code>description</code>, <code>publisher</code>, <code>contributor</code>, <code>date</code>, <code>type</code>, <code>format</code>, <code>identifier</code>, <code>source</code>, <code>language</code>, <code>relation</code>, <code>coverage</code> i <code>rights</code>. El <b>DC qualificat</b> (DCMI Terms) afegeix refinaments (p. ex. <code>dcterms:issued</code>, <code>dcterms:abstract</code>) i esquemes de codificació.</p>
<h3>METS, MODS i PREMIS</h3>
<ul>
<li><b>METS</b>: seccions de capçalera (<code>metsHdr</code>), metadades descriptives (<code>dmdSec</code>, que pot contenir MODS o DC), administratives (<code>amdSec</code>, amb <code>techMD</code>, <code>rightsMD</code>, <code>sourceMD</code>, <code>digiprovMD</code>), fitxers (<code>fileSec</code>), <b>mapa estructural</b> (<code>structMap</code>, l'única obligatòria) i enllaços. S'usa com a paquet d'informació en el model OAIS.</li>
<li><b>MODS</b>: elements amb noms comprensibles (<code>titleInfo</code>, <code>name</code>, <code>originInfo</code>, <code>subject</code>, <code>identifier</code>…), derivats de MARC.</li>
<li><b>PREMIS</b> (Preservation Metadata: Implementation Strategies): diccionari de dades amb les entitats <b>Objecte</b> (fitxer, representació, flux de bits), <b>Esdeveniment</b> (accions com migracions, validacions o comprovacions de fixesa), <b>Agent</b> (persona, organització o programari) i <b>Drets</b>. Registra la fixesa (<i>checksums</i>), el format i la història de cada objecte.</li>
</ul>`,
test:[
["Quin camp MARC21 conté el títol?",["100","245","650","856"],1,"100 és l'autor principal, 650 la matèria i 856 l'accés electrònic."],
["Quants elements té el Dublin Core bàsic?",["10","12","15","20"],2,"Són opcionals i repetibles; norma ISO 15836."],

["Quina característica té MODS respecte a MARC21?",["Fa servir etiquetes numèriques","És XML amb noms d'elements comprensibles i és més senzill","És de preservació","No es fa servir mai"],1,"És un punt intermedi entre MARC i Dublin Core."],

"preservacio":{url:"https://www.bnc.cat/Professionals/Preservacio-digital",prompt:'<span class="ps">$</span> sha256sum objecte.tif',
summary:`
<h3>Què és la preservació digital</h3>
<p>Conjunt de polítiques, estratègies i accions per garantir que els objectes digitals continuïn sent <b>accessibles, íntegres, autèntics i comprensibles</b> a llarg termini, malgrat l'obsolescència del maquinari, del programari i dels formats, i la degradació dels suports. La <b>Biblioteca de Catalunya</b> (BC) n'és un referent al país: preserva el patrimoni digital català i ofereix orientació professional.</p>
<h3>Iniciatives de la Biblioteca de Catalunya</h3>
<ul>
<li><b>PADICAT</b> (Patrimoni Digital de Catalunya): arxiu web que recull i preserva periòdicament webs de l'àmbit català des del 2005.</li>
<li>Repositoris cooperatius amb el CSUC: <b>MDC</b> (Memòria Digital de Catalunya, fons digitalitzats), <b>TDX</b> (tesis doctorals), <b>RACO</b> (revistes), RECERCAT.</li>
<li>Recomanacions sobre formats, digitalització i dipòsit legal de publicacions electròniques.</li>
</ul>
<h3>Model OAIS</h3>
<p>El model de referència <b>OAIS</b> (Open Archival Information System, norma <b>ISO 14721</b>) defineix un arxiu que preserva informació per a una <b>comunitat designada</b>.</p>
<ul>
<li>Paquets d'informació: <b>SIP</b> (d'enviament, el que arriba del productor), <b>AIP</b> (d'arxiu, el que es preserva) i <b>DIP</b> (de difusió, el que es lliura a l'usuari).</li>
<li>Entitats funcionals: <b>ingesta</b>, <b>emmagatzematge d'arxiu</b>, <b>gestió de dades</b>, <b>administració</b>, <b>planificació de la preservació</b> i <b>accés</b>.</li>
</ul>
<h3>Estratègies</h3>
<ul>
<li><b>Preservació del flux de bits</b>: diverses còpies (regla 3-2-1: tres còpies, en dos suports diferents, una fora del lloc), comprovació periòdica de la <b>fixesa</b> amb sumes de verificació (MD5, SHA-256) i renovació de suports.</li>
<li><b>Migració</b>: convertir a formats nous o més estables (normalització en la ingesta).</li>
<li><b>Emulació</b>: reproduir l'entorn original per executar el programari antic.</li>
<li>Ús de <b>formats recomanats</b>: oberts, documentats i àmpliament adoptats, com <b>PDF/A</b> (ISO 19005), TIFF sense compressió o JPEG 2000, XML, CSV, WAV, FFV1/Matroska.</li>
<li><b>Metadades de preservació</b> (PREMIS) i empaquetat (METS, BagIt).</li>
<li>Identificació i validació de formats amb eines com <b>DROID</b> (registre <b>PRONOM</b>), JHOVE o FITS.</li>
</ul>
<h3>Certificació i eines</h3>
<p>Repositoris de confiança: <b>CoreTrustSeal</b>, ISO 16363 (auditoria i certificació, basada en TRAC), nestor. Programari: Archivematica, LOCKSS, Preservica, Rosetta. Models de maduresa: NDSA Levels of Digital Preservation.</p>`,

summary:`
<h3>Marc legal</h3>
<p>L'administració electrònica de la UB s'emmarca en les lleis estatals bàsiques de procediment:</p>
<ul>
<li><b>Llei 39/2015</b>, del procediment administratiu comú de les administracions públiques: dret i obligació de relacionar-se electrònicament, identificació i signatura, registre, notificacions, terminis, expedient electrònic.</li>
<li><b>Llei 40/2015</b>, de règim jurídic del sector públic: seu electrònica, actuació administrativa automatitzada, sistemes de signatura de l'administració (segell electrònic, codi segur de verificació), interoperabilitat.</li>
<li><b>RD 203/2021</b>, Reglament d'actuació i funcionament del sector públic per mitjans electrònics.</li>
<li><b>Esquema Nacional de Seguretat</b> (ENS, RD 311/2022) i <b>Esquema Nacional d'Interoperabilitat</b> (ENI, RD 4/2010), i el <b>Reglament eIDAS</b> europeu per a la identificació i els serveis de confiança.</li>
<li>Protecció de dades: RGPD i LOPDGDD (LO 3/2018).</li>
</ul>
<h3>Qui ha de relacionar-se electrònicament</h3>
<p>Les persones físiques <b>poden triar</b> el canal. Hi estan <b>obligades</b>, entre d'altres, les persones jurídiques, les entitats sense personalitat jurídica, els professionals col·legiats en l'exercici de la professió, els seus representants i el <b>personal de les administracions</b> per als tràmits que facin per raó de la seva condició d'empleats públics. Les universitats poden establir l'obligació per a determinats col·lectius (p. ex. estudiantat en processos com la matrícula).</p>
<h3>Serveis de la UB</h3>
<ul>
<li><b>Seu electrònica</b> (seu.ub.edu): punt d'accés oficial, amb garanties d'autenticitat, integritat i disponibilitat. Hi ha el catàleg de tràmits, la normativa, el calendari de dies inhàbils i la data i hora oficials.</li>
<li><b>Registre electrònic</b> i <b>instància genèrica</b> per a qualsevol sol·licitud sense tràmit específic. El registre funciona tots els dies de l'any les 24 hores; la presentació en dia inhàbil s'entén feta a primera hora del primer dia hàbil següent.</li>
<li><b>Notificacions electròniques</b>: posades a disposició a la seu o a través de serveis com e-NOTUM. Es consideren practicades en accedir-hi i <b>rebutjades si passen 10 dies naturals</b> sense accedir-hi.</li>
<li><b>Tauler d'anuncis electrònic</b> i publicacions oficials.</li>
<li><b>Validació de documents</b> amb el <b>codi segur de verificació (CSV)</b>, per comprovar l'autenticitat d'una còpia en paper.</li>
<li><b>Perfil del contractant</b> (contractació pública) i <b>factura electrònica</b> per als proveïdors.</li>
<li><b>Portafirmes</b>, expedient i arxiu electrònics per a la gestió interna.</li>
</ul>

"aoc":{url:"https://www.aoc.cat/serveis/",prompt:'<span class="ps">$</span> aoc --serveis',
summary:`
<h3>El Consorci AOC</h3>
<p>El <b>Consorci Administració Oberta de Catalunya</b> (AOC) és l'entitat que impulsa la transformació digital de les administracions públiques catalanes. El formen la Generalitat i el món local, i ofereix <b>serveis comuns</b> d'administració electrònica a ajuntaments, consells comarcals, diputacions, universitats i altres ens, perquè no hagin de desenvolupar-los cadascun pel seu compte. Les universitats públiques catalanes, inclosa la UB, en fan servir diversos.</p>
<h3>Catàleg de serveis per àmbits</h3>
<div class="tbl"><table>
<tr><th>Àmbit</th><th>Serveis</th></tr>
<tr><td><b>Identitat i signatura</b></td><td><b>VÀLid</b> (identificació a la ciutadania amb diversos mètodes: idCAT Mòbil, certificat, Cl@ve), <b>idCAT Mòbil</b> (identificació amb un codi al mòbil), <b>idCAT Certificat</b> (certificat digital per a la ciutadania), <b>T-CAT</b> (certificats per al personal públic i segells d'òrgan), PSIS (validació de certificats i signatures), <b>Signador</b>, <b>Representa</b> (registre de representacions)</td></tr>
<tr><td><b>Relació amb la ciutadania i les empreses</b></td><td><b>Seu-e</b> (seu electrònica per a ens locals), <b>e-TRAM</b> (tràmits genèrics en línia), <b>e-NOTUM</b> (notificacions electròniques), <b>e-TAULER</b> (tauler d'edictes), <b>Sobre Digital</b> (presentació d'ofertes en licitacions), <b>e-FACT</b> (bústia de factura electrònica)</td></tr>
<tr><td><b>Interoperabilitat entre administracions</b></td><td><b>Via Oberta</b> (consulta de dades i documents d'altres administracions, perquè la ciutadania no hagi d'aportar-los), <b>EACAT</b> (extranet de les administracions catalanes per a trameses entre ens), <b>MUX</b> (registre unificat i intercanvi registral)</td></tr>
<tr><td><b>Gestió interna i arxiu</b></td><td><b>iArxiu</b> (arxiu i preservació de documents i expedients electrònics), eines de gestió d'expedients</td></tr>
<tr><td><b>Altres</b></td><td>Serveis de comunicació amb la ciutadania (avisos, missatgeria), dades obertes, transparència</td></tr>
</table></div>
<h3>Principis que materialitza</h3>
<ul>
<li>El dret de la ciutadania a <b>no aportar documents</b> que ja tenen les administracions (Via Oberta).</li>
<li>La <b>interoperabilitat</b> i la reutilització de solucions entre administracions.</li>
<li>L'aplicació de la Llei 39/2015 i la Llei 40/2015: identificació, signatura, registre, notificacions i arxiu electrònics.</li>
</ul>
<h3>Suport</h3>
<p>L'espai de <b>suport</b> d'aoc.cat ofereix, per a cada servei, fitxes de documentació, guies d'integració tècnica, preguntes freqüents, l'<b>estat dels serveis</b> (incidències i aturades programades), formació i un canal per obrir consultes o incidències. Els desenvolupadors troben la documentació de les integracions (normalment API i serveis web) per connectar les aplicacions pròpies amb els serveis de l'AOC.</p>`,

["Quin servei integra els mètodes d'identificació de la ciutadania (idCAT Mòbil, certificat, Cl@ve)?",["VÀLid","EACAT","MUX","Sobre Digital"],0,"Les aplicacions s'hi integren per no gestionar cada mètode per separat."],
["Quin servei emet certificats per al personal de les administracions?",["idCAT Certificat","T-CAT","Representa","PSIS"],1,"idCAT Certificat és per a la ciutadania."],

summary:`
<h3>El IV Pla d'Igualtat (2025-2029)</h3>
<p>La UB va aprovar el <b>IV Pla d'Igualtat</b> al Consell de Govern del <b>10 de desembre</b>, com a document estratègic per al període <b>2025-2029</b> (vigència de cinc anys). Es desplega amb un <b>pla d'acció</b> amb objectius, accions, responsables i indicadors. Forma part d'una arquitectura institucional que el complementa amb el <b>Pla d'igualtat de gènere de les persones treballadores</b> i el <b>Pla d'inclusió</b>. L'impulsa el <b>Vicerectorat d'Igualtat i Gènere</b> a través de la <b>Unitat d'Igualtat</b>.</p>
<h3>Els quatre eixos</h3>
<div class="tbl"><table>
<tr><th>Eix</th><th>Contingut</th></tr>
<tr><td><b>1. Impuls de la igualtat a la comunitat universitària</b></td><td>Consolidar una cultura institucional d'igualtat, respecte i corresponsabilitat; fer de la igualtat una pràctica quotidiana; sensibilització, representació inclusiva, dades desagregades fiables i enfortiment de les estructures d'igualtat.</td></tr>
<tr><td><b>2. Perspectiva de gènere en la docència</b></td><td>Integrar-la com a <b>criteri de qualitat docent</b>: més oferta formativa en gènere i diversitat, competència transversal a totes les titulacions, formació del professorat, reconeixement de bones pràctiques i perspectiva de gènere als treballs de final d'estudis.</td></tr>
<tr><td><b>3. Perspectiva de gènere en la recerca i la transferència</b></td><td>Recerca excel·lent i sense biaixos: lideratge de les dones, formació del personal investigador, revisió de codis ètics i pràctiques d'avaluació, gènere al doctorat i reconeixement dels projectes que l'integren.</td></tr>
<tr><td><b>4. Organització lliure de sexisme i violència de gènere</b></td><td>Prevenció, detecció i reparació de les violències masclistes i LGTBIQ+fòbiques; protocols, acompanyament i formació.</td></tr>
</table></div>
<h3>Marc normatiu i antecedents</h3>
<ul>
<li>La UB té plans d'igualtat des del 2008; aquest és el quart.</li>
<li>Normativa de referència: <b>LO 3/2007</b>, per a la igualtat efectiva de dones i homes; <b>Llei 17/2015</b>, d'igualtat efectiva de dones i homes (Catalunya); <b>Llei 5/2008</b>, del dret de les dones a erradicar la violència masclista; <b>Llei 11/2014</b> (drets LGBTI) i <b>Llei 4/2023</b> (igualtat de les persones trans i LGTBI); <b>RD 901/2020</b> (plans d'igualtat en l'àmbit laboral); i la <b>LOSU</b>, que obliga les universitats a tenir plans d'igualtat, unitats d'igualtat i protocols contra l'assetjament.</li>
<li>Instruments relacionats: protocol per a la prevenció, detecció, actuació i resolució de situacions d'assetjament sexual, per raó de sexe, d'orientació sexual i d'identitat i expressió de gènere; ús del nom sentit; llenguatge inclusiu; mesures de conciliació.</li>
</ul>
<div class="key">Per a un perfil tècnic, connecta-ho amb la feina: dades desagregades per sexe als sistemes d'informació, formularis amb opcions inclusives i nom sentit, accessibilitat, i evitar biaixos en algorismes i en processos automatitzats.</div>`,

"losu":{url:"https://www.boe.es/eli/es/lo/2023/03/22/2/con",prompt:'<span class="ps">BOE</span> LO 2/2023',
summary:`
<h3>Dades bàsiques</h3>
<p>La <b>Llei orgànica 2/2023, de 22 de març, del sistema universitari</b> (<b>LOSU</b>) es va publicar al BOE el 23 de març de 2023 i substitueix la <b>LOU</b> (LO 6/2001). Regula el sistema universitari, l'autonomia universitària, l'organització, el govern, el personal i l'estudiantat.</p>
<h3>Funcions i autonomia</h3>
<ul>
<li>Funcions de la universitat: <b>docència</b>, <b>recerca</b>, <b>transferència</b> i intercanvi del coneixement, formació al llarg de la vida, difusió de la cultura i la ciència, i contribució al desenvolupament sostenible i a la cohesió social.</li>
<li><b>Autonomia universitària</b> (art. 27.10 de la Constitució): elaboració dels estatuts, elecció dels òrgans de govern, creació d'estructures, titulacions, selecció del personal, admissió de l'estudiantat, gestió pressupostària i patrimonial.</li>
<li>Principis transversals: igualtat i no-discriminació, inclusió, accessibilitat, sostenibilitat, llibertat acadèmica, qualitat, transparència i rendició de comptes, internacionalització.</li>
<li>Universitats públiques i privades; requisits per crear-ne i reconèixer-les. Compromís de finançament públic de l'<b>1 % del PIB</b>.</li>
</ul>
<h3>Estructura i govern</h3>
<ul>
<li>Estructures: <b>facultats</b> i <b>escoles</b>, <b>departaments</b>, <b>instituts universitaris de recerca</b>, <b>escoles de doctorat</b> i altres centres.</li>
<li>Òrgans col·legiats: <b>Claustre</b> (màxim òrgan de representació), <b>Consell de Govern</b> (govern ordinari, planificació estratègica) i <b>Consell Social</b> (relació amb la societat, supervisió econòmica, aprovació del pressupost).</li>
<li>Òrgans unipersonals: <b>rector/a</b>, vicerectors/es, secretari/ària general, <b>gerent</b>, degans/es i directors/es.</li>
<li>El rector o rectora: mandat únic de <b>sis anys, no renovable</b>. L'elegeix la comunitat per <b>sufragi universal ponderat</b> o el Claustre, segons els estatuts. Ha de ser funcionari/ària catedràtic/a amb mèrits de recerca, docència i gestió acreditats.</li>
<li>Representació equilibrada de dones i homes als òrgans.</li>
<li><b>Defensoria universitària</b> i <b>Comissió de Convivència</b> (en relació amb la Llei 3/2022, de convivència universitària).</li>
</ul>
<h3>Personal</h3>
<ul>
<li>Personal docent i investigador (<b>PDI</b>) i personal tècnic, de gestió i d'administració i serveis (<b>PTGAS</b>, nova denominació del PAS).</li>
<li>PDI funcionari: <b>catedràtics/ques</b> i <b>professorat titular</b> d'universitat, amb accés per acreditació estatal (ANECA).</li>
<li>PDI laboral: <b>ajudant doctor/a</b> (entrada a la carrera, fins a sis anys), <b>professorat permanent laboral</b>, <b>professorat associat</b> (professionals de reconeguda competència externa), <b>substitut/a</b>, visitant, emèrit/a i distingit/da.</li>
<li>Límit a la temporalitat del PDI (el temporal no pot superar el <b>8 %</b> de la plantilla) i estabilització del professorat associat.</li>
<li>Dret a la desconnexió digital, conciliació i avaluació de l'activitat docent, investigadora, de transferència i de gestió.</li>
</ul>
<h3>Estudiantat i igualtat</h3>
<ul>
<li>Estatut de drets i deures; participació (Consell d'Estudiants); beques i ajuts; accés i admissió; formació al llarg de la vida (microcredencials).</li>
<li>Les universitats han de tenir <b>unitats d'igualtat</b>, <b>plans d'igualtat</b>, <b>protocols contra l'assetjament</b> sexual i per raó de sexe i mesures contra les discriminacions per orientació sexual o identitat de gènere, així com <b>unitats de diversitat</b> i d'atenció a l'estudiantat amb discapacitat.</li>
<li>Perspectiva de gènere en la docència i la recerca i eliminació de biaixos en l'avaluació.</li>
</ul>`,
test:[
["Quina llei ha quedat substituïda per la LOSU?",["La LRU","La LOU (LO 6/2001)","La LOMLOE","La Llei 39/2015"],1,"La LOSU substitueix la LOU de 2001."],
["Quina és la durada del mandat del rector o rectora segons la LOSU?",["Quatre anys renovables","Sis anys, no renovable","Cinc anys renovables una vegada","Vuit anys"],1,"Mandat únic de sis anys."],

<h3>Pilars de la POO</h3>
<div class="tbl"><table>
