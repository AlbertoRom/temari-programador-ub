<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio ATIC Aplicacions - Programador/a</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">UB - OF123/2026/1</p>
      <h1>Estudio común para Programador/a ÀTIC Aplicacions</h1>
    </div>
    <div class="summary">
      <span><strong id="doneCount">0</strong> completados</span>
      <span><strong>7</strong> plazas</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <div>
        <h2>Estudia una vez, cubre las siete</h2>
        <p>Temario agrupado por recurrencia, con bloques comunes, específicos por plaza y tarjetas de repaso rápido.</p>
      </div>
      <div class="meter" aria-label="Progreso total">
        <svg viewBox="0 0 120 120" role="img">
          <circle class="track" cx="60" cy="60" r="50"></circle>
          <circle class="bar" id="progressRing" cx="60" cy="60" r="50"></circle>
        </svg>
        <strong id="progressText">0%</strong>
      </div>
    </section>

    <section class="controls" aria-label="Controles">
      <label class="search">
        <span>Buscar</span>
        <input id="searchInput" type="search" placeholder="Java, REST, bibliotecas, PL/SQL...">
      </label>
      <div class="segmented" role="tablist" aria-label="Vista">
        <button class="active" data-view="roadmap">Ruta</button>
        <button data-view="matrix">Matriz</button>
        <button data-view="cards">Tarjetas</button>
        <button data-view="jobs">Plazas</button>
      </div>
    </section>

    <section class="jobs-strip" id="jobFilters" aria-label="Filtro por plaza"></section>

    <section id="roadmapView" class="view active"></section>
    <section id="matrixView" class="view"></section>
    <section id="cardsView" class="view"></section>
    <section id="jobsView" class="view"></section>
    <section id="detailView" class="view"></section>
  </main>

  <template id="topicTemplate">
    <article class="topic">
      <div class="topic-head">
        <label class="checkline">
          <input type="checkbox">
          <span></span>
        </label>
        <span class="badge"></span>
      </div>
      <p></p>
      <div class="chips"></div>
      <button class="open-topic" type="button">Abrir tema</button>
    </article>
  </template>

  <script src="app.js"></script>
</body>
</html>
