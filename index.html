<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bibliografia UB · Estudi i test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F5; --panel:#FFFFFF; --panel2:#F6F8FB; --ink:#1B2232; --muted:#586277; --line:#D3D9E3;
  --accent:#1F5FCC; --accent-ink:#FFFFFF; --ok:#1E8A55; --ok-bg:#E3F4EA; --bad:#C23B49; --bad-bg:#FBE7E9;
  --code-bg:#E7EBF2;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151A24; --panel:#1D2431; --panel2:#232B3A; --ink:#E4E8EF; --muted:#97A1B4; --line:#2F394B;
    --accent:#F2B54A; --accent-ink:#1A1A1A; --ok:#5CC48A; --ok-bg:#1C3328; --bad:#EE7782; --bad-bg:#3A2026;
    --code-bg:#0F141C;
  }
}
:root[data-theme="dark"]{
  --bg:#151A24; --panel:#1D2431; --panel2:#232B3A; --ink:#E4E8EF; --muted:#97A1B4; --line:#2F394B;
  --accent:#F2B54A; --accent-ink:#1A1A1A; --ok:#5CC48A; --ok-bg:#1C3328; --bad:#EE7782; --bad-bg:#3A2026;
  --code-bg:#0F141C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.6;height:100%}
code,pre,.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
.app{display:grid;grid-template-columns:290px 1fr;min-height:100%}
aside{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px 40px;position:sticky;top:0;height:100vh;overflow-y:auto}
aside h1{font-size:1.05rem;margin:0 6px 4px;line-height:1.3}
aside .sub{color:var(--muted);font-size:.85rem;margin:0 6px 18px}
.block{margin-bottom:14px}
.block-title{font-size:.82rem;font-weight:600;color:var(--muted);margin:0 6px 4px}
.res-btn{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;color:var(--ink);font:inherit;font-size:.92rem;padding:7px 8px;border-radius:6px;cursor:pointer}
.res-btn:hover{background:var(--panel2)}
.res-btn.active{background:var(--accent);color:var(--accent-ink)}
.res-btn[disabled]{color:var(--muted);cursor:default;opacity:.65}
.res-btn[disabled]:hover{background:none}
.pill{font-size:.72rem;font-family:"IBM Plex Mono",monospace;padding:1px 6px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;opacity:.85}
main{padding:28px 32px 80px;max-width:860px;width:100%}
.topbar{display:none}
.prompt{font-family:"IBM Plex Mono",monospace;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:22px;overflow-x:auto}
.prompt .line{font-size:clamp(1rem,2.6vw,1.45rem);font-weight:600;white-space:nowrap}
.prompt .ps{color:var(--accent)}
.prompt .cursor{display:inline-block;width:.6em;height:1.1em;background:var(--accent);vertical-align:-0.15em;margin-left:4px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion: reduce){.prompt .cursor{animation:none}}
.prompt .meta{color:var(--muted);font-size:.85rem;margin-top:6px;white-space:normal}
.prompt a{color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px}
.tab{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:inherit;font-weight:600;padding:10px 14px;cursor:pointer}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.tab .count{font-weight:400;font-size:.8rem;margin-left:4px}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.summary h3{font-size:1.15rem;margin:30px 0 8px}
.summary h3:first-child{margin-top:0}
.summary p,.summary li{max-width:72ch}
.summary ul{padding-left:1.2em}
.summary li{margin:3px 0}
.summary code{background:var(--code-bg);padding:1px 5px;border-radius:4px;font-size:.88em}
.summary pre,.ex pre{background:var(--code-bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px;overflow-x:auto;font-size:.86rem;line-height:1.5}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:.9rem;min-width:420px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
th{background:var(--panel2)}
.key{border-left:3px solid var(--accent);background:var(--panel);padding:10px 14px;border-radius:0 6px 6px 0;margin:14px 0}
.read-row{display:flex;align-items:center;gap:10px;margin-top:30px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.score{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:18px}
.score b{font-size:1.2rem}
.score .grow{flex:1}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:8px 14px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.q{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:14px}
.q .qn{color:var(--muted);font-size:.82rem}
.q .qt{font-weight:600;margin:4px 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font:inherit;padding:9px 12px;border-radius:6px;margin:6px 0;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--panel)}
.merged{margin-top:44px!important;padding-top:18px;border-top:2px solid var(--accent);font-size:1.3rem!important}
.plaza-sel{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);margin:0 6px 14px}
.plaza-sel select{font:inherit;font-size:.88rem;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card h4{margin:0 0 6px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:4px 0 8px}
.bar span{display:block;height:100%;background:var(--accent)}
.sim-btn{border:1px solid var(--accent);margin:0 0 16px;font-weight:600}
.cfg{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:18px}
.cfg label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:600}
.cfg select{font:inherit;padding:7px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;font-weight:400}
.chips label{flex-direction:row;align-items:center;font-weight:400}
.timer{position:sticky;top:0;z-index:5;font-family:"IBM Plex Mono",monospace}
textarea{width:100%;min-height:120px;font:inherit;font-size:.95rem;padding:10px;border-radius:6px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}
.model{margin-top:10px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--panel2);border-radius:0 6px 6px 0;font-size:.93rem}
.hist td,.hist th{font-size:.85rem}
@media (max-width:860px){.timer{top:calc(52px + env(safe-area-inset-top,0px))}}
.opt .l{font-family:"IBM Plex Mono",monospace;font-weight:600;margin-right:8px}
.expl{margin-top:10px;font-size:.92rem;padding:10px 12px;border-radius:6px;background:var(--panel2)}
.expl.ok{border-left:3px solid var(--ok)}
.expl.ko{border-left:3px solid var(--bad)}
.ex{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin-bottom:16px}
.ex h4{margin:0 0 8px;font-size:1.02rem}
.ex .sol{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.ex .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.ex label,.read-row label{display:flex;gap:8px;align-items:center;cursor:pointer;font-size:.92rem}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.empty{color:var(--muted)}
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0;height:100%;z-index:20;transform:translateX(-100%);transition:transform .2s ease;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  aside.open{transform:none}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);padding:10px 16px;border-bottom:1px solid var(--line)}
  .topbar span{font-weight:600;font-size:.95rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:18px 16px 60px}
  .close-side{display:block!important}
}
.close-side{display:none;margin:0 6px 14px}
</style>
</head>
<body>
<div class="app">
  <aside id="side">
    <button class="btn ghost close-side" onclick="toggleSide(false)">Tanca el temari</button>
    <h1>Material bibliogràfic · Programador/a UB</h1>
    <p class="sub">Resums, test i pràctiques per recurs</p>
    <nav id="nav"></nav>
  </aside>
  <div>
    <div class="topbar"><button class="btn ghost" onclick="toggleSide(true)">Temari</button><span id="topTitle"></span></div>
    <main id="main"></main>
  </div>
</div>

<script>var CONTENT={};</script>
<script>
Object.assign(CONTENT,{"unix":{"url":"https://www.tutorialspoint.com/unix/index.htm","prompt":"<span class=\"ps\">$</span> man unix","summary":"\n<h3>Conceptes bàsics</h3>\n<p>Un sistema operatiu fa d'intermediari entre l'usuari i el maquinari: gestiona fitxers, memòria, processos, entrada/sortida i perifèrics. <b>Unix</b> neix el 1969 als Bell Labs d'AT&amp;T (Ken Thompson i Dennis Ritchie). <b>Linux</b> és un nucli tipus Unix creat per Linus Torvalds el 1991 a la Universitat de Hèlsinki, de codi obert. Una <b>distribució</b> (Ubuntu, Debian, Fedora, RHEL, CentOS, openSUSE, Arch…) empaqueta el nucli amb eines, gestor de paquets i programari.</p>\n<ul>\n<li><b>Nucli (kernel)</b>: gestiona el maquinari i els recursos.</li>\n<li><b>Shell</b>: intèrpret d'ordres (sh, bash, zsh, ksh, csh). Prompt habitual: <code>$</code> per a usuari i <code>#</code> per a root.</li>\n<li><b>Utilitats</b>: programes de l'espai d'usuari (ls, cp, grep…).</li>\n<li>Sistema <b>multiusuari</b> i <b>multitasca</b>. L'usuari <b>root</b> té privilegis totals; <code>sudo</code> executa una ordre com a root i <code>su</code> canvia d'usuari.</li>\n<li><b>Gestors de paquets</b>: <code>apt</code>/<code>dpkg</code> (Debian/Ubuntu), <code>yum</code>/<code>dnf</code>/<code>rpm</code> (Red Hat).</li>\n</ul>\n\n<h3>Sistema de fitxers</h3>\n<p>Estructura en arbre que penja de l'arrel <code>/</code>. \"Tot és un fitxer\": dispositius, sockets i canonades també es representen com a fitxers.</p>\n<div class=\"tbl\"><table>\n<tr><th>Directori</th><th>Contingut</th></tr>\n<tr><td><code>/bin</code>, <code>/sbin</code></td><td>Executables bàsics / d'administració</td></tr>\n<tr><td><code>/etc</code></td><td>Fitxers de configuració del sistema</td></tr>\n<tr><td><code>/home</code></td><td>Directoris personals dels usuaris (<code>/root</code> per a root)</td></tr>\n<tr><td><code>/var</code></td><td>Dades variables: logs (<code>/var/log</code>), cues, bústies</td></tr>\n<tr><td><code>/tmp</code></td><td>Fitxers temporals</td></tr>\n<tr><td><code>/usr</code></td><td>Programes i biblioteques d'usuari</td></tr>\n<tr><td><code>/dev</code></td><td>Fitxers de dispositiu</td></tr>\n<tr><td><code>/proc</code></td><td>Sistema de fitxers virtual amb informació de processos i del nucli</td></tr>\n<tr><td><code>/boot</code>, <code>/lib</code>, <code>/opt</code>, <code>/mnt</code></td><td>Arrencada, biblioteques, programari opcional, punts de muntatge</td></tr>\n</table></div>\n<p>Primer caràcter de <code>ls -l</code>: <code>-</code> fitxer ordinari, <code>d</code> directori, <code>l</code> enllaç simbòlic, <code>c</code> dispositiu de caràcters, <code>b</code> dispositiu de blocs, <code>p</code> canonada amb nom, <code>s</code> socket. Les rutes poden ser <b>absolutes</b> (comencen per <code>/</code>) o <b>relatives</b> (respecte al directori actual; <code>.</code> actual, <code>..</code> pare, <code>~</code> directori personal).</p>\n<p>Ordres clau: <code>ls -la</code>, <code>pwd</code>, <code>cd</code>, <code>mkdir -p</code>, <code>rmdir</code> (només directoris buits), <code>rm -r</code>, <code>cp -r</code>, <code>mv</code> (moure o reanomenar), <code>touch</code>, <code>cat</code>, <code>more</code>/<code>less</code>, <code>find</code>, <code>df</code> (espai de disc), <code>du</code> (ocupació de directoris), <code>mount</code>/<code>umount</code>. Els fitxers ocults comencen per punt.</p>\n\n<h3>Enllaços</h3>\n<ul>\n<li><b>Enllaç dur</b> (<code>ln orig nou</code>): un altre nom per al mateix <b>inode</b>. No pot creuar sistemes de fitxers ni apuntar a directoris. Si s'esborra l'original, les dades continuen accessibles.</li>\n<li><b>Enllaç simbòlic</b> (<code>ln -s orig nou</code>): fitxer que conté una ruta. Pot creuar sistemes de fitxers i apuntar a directoris; si l'original desapareix, queda trencat.</li>\n</ul>\n\n<h3>Permisos</h3>\n<p>Tres classes (propietari <b>u</b>, grup <b>g</b>, altres <b>o</b>) i tres permisos: lectura <b>r=4</b>, escriptura <b>w=2</b>, execució <b>x=1</b>. Exemple: <code>rwxr-x---</code> = <code>750</code>. En un directori, <b>x</b> vol dir que s'hi pot entrar (cd) i <b>r</b> que se'n pot llistar el contingut.</p>\n<ul>\n<li><code>chmod 640 f</code> o <code>chmod u+x,g-w f</code>: canvia permisos (notació octal o simbòlica).</li>\n<li><code>chown usuari:grup f</code> i <code>chgrp grup f</code>: canvien propietari i grup.</li>\n<li><code>umask</code>: permisos que es <b>treuen</b> per defecte. Amb umask 022, els fitxers nous queden 644 i els directoris 755.</li>\n<li>Permisos especials: <b>SUID</b> (4000, s'executa amb els permisos del propietari, p. ex. <code>passwd</code>), <b>SGID</b> (2000, grup del fitxer o herència de grup en directoris) i <b>sticky bit</b> (1000, a <code>/tmp</code> només el propietari pot esborrar els seus fitxers).</li>\n</ul>\n\n<h3>Entorn</h3>\n<p>Variables d'entorn: <code>PATH</code> (on es busquen executables), <code>HOME</code>, <code>USER</code>, <code>SHELL</code>, <code>PS1</code> (format del prompt), <code>PWD</code>. Es defineixen amb <code>VAR=valor</code> i es fan visibles als processos fills amb <code>export</code>. Es consulten amb <code>env</code>, <code>printenv</code> o <code>echo $VAR</code>. Fitxers d'inici: <code>/etc/profile</code>, <code>~/.profile</code> o <code>~/.bash_profile</code> (shell de login) i <code>~/.bashrc</code> (shell interactiu). <code>alias ll='ls -la'</code> crea dreceres.</p>\n\n<h3>Redireccions, canonades i filtres</h3>\n<p>Fluxos estàndard: <b>stdin = 0</b>, <b>stdout = 1</b>, <b>stderr = 2</b>.</p>\n<ul>\n<li><code>&gt;</code> sobreescriu, <code>&gt;&gt;</code> afegeix, <code>&lt;</code> entrada des de fitxer, <code>2&gt;</code> redirigeix errors, <code>2&gt;&amp;1</code> envia stderr on va stdout, <code>&amp;&gt; f</code> totes dues coses (bash).</li>\n<li><code>/dev/null</code> descarta la sortida. <i>Here document</i>: <code>cat &lt;&lt; FI ... FI</code>.</li>\n<li><code>|</code> (pipe) connecta la sortida d'una ordre amb l'entrada de la següent. <code>tee</code> escriu a fitxer i a pantalla alhora.</li>\n<li>Filtres: <code>grep</code> (<code>-i</code> sense distingir majúscules, <code>-v</code> invertit, <code>-c</code> comptar, <code>-r</code> recursiu, <code>-n</code> número de línia), <code>sort</code> (<code>-n</code> numèric, <code>-r</code> invers), <code>uniq</code> (requereix entrada ordenada; <code>-c</code> compta), <code>wc -l</code>, <code>head</code>, <code>tail -f</code> (seguir un log), <code>cut -d: -f1</code>, <code>tr</code>, <code>awk</code>, <code>sed 's/a/b/g'</code>.</li>\n</ul>\n\n<h3>Expressions regulars</h3>\n<p><code>^</code> inici de línia, <code>$</code> final, <code>.</code> qualsevol caràcter, <code>*</code> zero o més, <code>[abc]</code> conjunt, <code>[^abc]</code> negació, <code>\\</code> escapament. Amb <code>grep -E</code> (esteses): <code>+</code>, <code>?</code>, <code>{n,m}</code>, <code>|</code>, <code>()</code>.</p>\n\n<h3>Processos i senyals</h3>\n<p>Cada procés té un <b>PID</b> i un <b>PPID</b> (pare). Un procés en primer pla bloqueja la terminal; amb <code>&amp;</code> s'executa en segon pla. Els <b>dimonis</b> són processos de servei sense terminal. Un <b>zombi</b> ha acabat però el pare encara no n'ha recollit l'estat; un <b>orfe</b> ha perdut el pare i l'adopta init/systemd (PID 1).</p>\n<ul>\n<li><code>ps -ef</code> / <code>ps aux</code>, <code>top</code>/<code>htop</code>, <code>pgrep</code>, <code>pstree</code>.</li>\n<li><code>jobs</code>, <code>fg %1</code>, <code>bg</code>, Ctrl+Z (suspèn), Ctrl+C (SIGINT).</li>\n<li><code>kill -senyal PID</code>, <code>killall nom</code>. Senyals: <b>SIGHUP 1</b>, <b>SIGINT 2</b>, <b>SIGKILL 9</b> (no es pot capturar), <b>SIGTERM 15</b> (per defecte, permet tancar ordenadament), SIGSTOP/SIGTSTP.</li>\n<li><code>nice -n 10 ordre</code> / <code>renice</code>: prioritat de -20 (màxima) a 19 (mínima). <code>nohup</code> manté el procés quan es tanca la sessió.</li>\n<li><code>trap 'ordres' SIGNAL</code> captura senyals dins un script.</li>\n<li>Planificació: <code>cron</code>/<code>crontab -e</code> (minut hora dia_mes mes dia_setmana) i <code>at</code>.</li>\n</ul>\n\n<h3>Shell scripting (bash)</h3>\n<pre>#!/bin/bash\nNOM=\"UB\"              # sense espais al voltant del =\necho \"Hola $NOM\"\nDATA=$(date +%F)      # substitució d'ordres (també amb accents greus)\nif [ -f \"$1\" ]; then echo \"$1 existeix\"; fi\nfor f in *.log; do gzip \"$f\"; done\nsuma() { echo $(( $1 + $2 )); }\nsuma 3 4</pre>\n<ul>\n<li>Variables especials: <code>$0</code> nom del script, <code>$1..$9</code> arguments, <code>$#</code> nombre d'arguments, <code>$@</code>/<code>$*</code> tots, <code>$?</code> codi de sortida de l'última ordre (0 = èxit), <code>$$</code> PID del shell, <code>$!</code> PID de l'últim procés en segon pla.</li>\n<li>Test: numèrics <code>-eq -ne -lt -le -gt -ge</code>; cadenes <code>= != -z -n</code>; fitxers <code>-f -d -e -r -w -x -s</code>; lògics <code>-a -o !</code> (o <code>&amp;&amp; ||</code> amb <code>[[ ]]</code>).</li>\n<li>Estructures: <code>if/elif/else/fi</code>, <code>case ... esac</code>, <code>for</code>, <code>while</code>, <code>until</code>, <code>break</code>, <code>continue</code>.</li>\n<li>Arrays: <code>A=(x y z)</code>, element amb <code>A[1]</code> entre claus, tots amb <code>@</code>.</li>\n<li>Cometes: <b>simples</b> ho deixen tot literal; <b>dobles</b> expandeixen variables i <code>$( )</code>; la <b>barra invertida</b> escapa un caràcter.</li>\n<li>Aritmètica: <code>$(( ))</code>, <code>expr</code>, <code>let</code>. Lectura de teclat: <code>read var</code>.</li>\n</ul>\n\n<h3>Administració</h3>\n<ul>\n<li>Usuaris: <code>useradd</code>, <code>usermod -aG grup usuari</code>, <code>userdel</code>, <code>passwd</code>, <code>groupadd</code>, <code>id</code>, <code>who</code>, <code>whoami</code>.</li>\n<li><code>/etc/passwd</code> (comptes, 7 camps separats per <code>:</code>), <code>/etc/shadow</code> (hash de contrasenyes, només root), <code>/etc/group</code>.</li>\n<li>Rendiment: <code>top</code>, <code>vmstat</code>, <code>free</code>, <code>iostat</code>, <code>sar</code>, <code>uptime</code> (càrrega mitjana), <code>df -h</code>, <code>du -sh</code>.</li>\n<li>Logs: <code>syslog</code>/<code>rsyslog</code> (<code>/etc/rsyslog.conf</code>), <code>/var/log/messages</code> o <code>syslog</code>, <code>journalctl</code> amb systemd, <code>logger</code> per escriure-hi des d'un script.</li>\n<li>Serveis amb systemd: <code>systemctl start|stop|status|enable nom</code>.</li>\n<li>Xarxa: <code>ip a</code>, <code>ping</code>, <code>ss</code>/<code>netstat</code>, <code>ssh</code>, <code>scp</code>, <code>curl</code>.</li>\n<li>Ajuda: <code>man</code>, <code>man -k</code>, <code>--help</code>, <code>info</code>.</li>\n</ul>\n\n<h3>Editor vi</h3>\n<p>Tres modes: <b>ordres</b> (en entrar), <b>inserció</b> (<code>i</code>, <code>a</code>, <code>o</code>; se'n surt amb Esc) i <b>última línia</b> (<code>:</code>). <code>:w</code> desa, <code>:q</code> surt, <code>:wq</code> o <code>ZZ</code> desa i surt, <code>:q!</code> surt sense desar. <code>dd</code> esborra línia, <code>yy</code> copia, <code>p</code> enganxa, <code>u</code> desfà, <code>x</code> esborra caràcter, <code>/text</code> cerca, <code>:%s/a/b/g</code> substitueix.</p>\n<div class=\"key\">Per a l'examen: domina permisos octals, redireccions (sobretot <code>2&gt;&amp;1</code>), variables especials del shell, senyals 1/2/9/15 i la diferència entre enllaç dur i simbòlic.</div>","test":[{"q":"Qui va desenvolupar Unix i on?","o":["Linus Torvalds a la Universitat de Hèlsinki","Ken Thompson i Dennis Ritchie als Bell Labs d'AT&T","Richard Stallman al MIT","Bill Joy a Berkeley"],"a":1,"e":"Unix va néixer el 1969 als Bell Labs. Torvalds va crear el nucli Linux el 1991."},{"q":"Quin valor octal correspon a rwxr-x--x?","o":["751","755","741","715"],"a":0,"e":"rwx=4+2+1=7, r-x=4+1=5, --x=1. Resultat: 751."},{"q":"Amb umask 027, quins permisos tindrà un directori nou?","o":["750","640","755","770"],"a":0,"e":"Els directoris parteixen de 777. 777 - 027 = 750."},{"q":"Què fa l'ordre: ordre > sortida.txt 2>&1","o":["Envia només els errors al fitxer","Envia stdout i stderr al fitxer","Afegeix stdout al final del fitxer","Llegeix l'entrada des del fitxer"],"a":1,"e":"Primer stdout va al fitxer i després 2>&1 duplica stderr cap al mateix destí."},{"q":"Quina variable conté el codi de sortida de l'última ordre?","o":["$#","$$","$?","$!"],"a":2,"e":"$? val 0 si l'ordre ha anat bé. $# és el nombre d'arguments, $$ el PID del shell i $! el PID de l'últim procés en segon pla."},{"q":"Quin senyal no es pot capturar ni ignorar?","o":["SIGTERM (15)","SIGINT (2)","SIGHUP (1)","SIGKILL (9)"],"a":3,"e":"SIGKILL i SIGSTOP no es poden capturar. SIGTERM és el senyal per defecte de kill i sí que permet un tancament ordenat."},{"q":"Quina afirmació sobre els enllaços durs és correcta?","o":["Poden apuntar a directoris","Poden creuar sistemes de fitxers","Comparteixen el mateix inode que l'original","Es trenquen si s'esborra l'original"],"a":2,"e":"Un enllaç dur és un altre nom per al mateix inode. Les dades sobreviuen mentre quedi algun enllaç."},{"q":"En quin fitxer es guarden els hash de les contrasenyes?","o":["/etc/passwd","/etc/shadow","/etc/group","/etc/login.defs"],"a":1,"e":"/etc/shadow només és llegible per root. /etc/passwd conté els comptes però no les contrasenyes."},{"q":"Quin efecte té el sticky bit sobre /tmp?","o":["Els fitxers s'executen com a root","Només el propietari d'un fitxer el pot esborrar o reanomenar","Els fitxers hereten el grup del directori","El directori no es pot llistar"],"a":1,"e":"L'sticky bit (1000) evita que un usuari esborri fitxers d'altres en un directori compartit."},{"q":"Per què serveix 'uniq' normalment després de 'sort'?","o":["uniq només elimina duplicats consecutius","sort elimina les línies buides","uniq ordena la sortida","No cal; és indiferent"],"a":0,"e":"uniq només detecta línies repetides adjacents, per això primer s'ordena."},{"q":"Quin mode de vi s'activa en prémer ':'?","o":["Mode inserció","Mode visual","Mode última línia (ex)","Mode reemplaçament"],"a":2,"e":"Els dos punts obren la línia d'ordres (:w, :q, :wq, :q!)."},{"q":"Com es fa visible una variable als processos fills?","o":["set VAR","export VAR","alias VAR","source VAR"],"a":1,"e":"export marca la variable perquè s'hereti a l'entorn dels processos fills."},{"q":"Quin rang de valors admet nice?","o":["0 a 99","-20 a 19","1 a 10","-10 a 10"],"a":1,"e":"-20 és la prioritat més alta i 19 la més baixa. Només root pot assignar valors negatius."},{"q":"Què indica una 'd' al primer caràcter de ls -l?","o":["Dispositiu","Directori","Fitxer esborrat","Dimoni"],"a":1,"e":"- fitxer, d directori, l enllaç simbòlic, c/b dispositius de caràcters/blocs, p canonada, s socket."},{"q":"Quina línia de crontab executa un script cada dia a les 2:30?","o":["2 30 * * * /script.sh","30 2 * * * /script.sh","* * 2 30 * /script.sh","30 2 1 * * /script.sh"],"a":1,"e":"L'ordre dels camps és minut, hora, dia del mes, mes i dia de la setmana."},{"q":"Quina diferència hi ha entre cometes simples i dobles en bash?","o":["Cap","Les simples expandeixen variables; les dobles no","Les dobles expandeixen variables; les simples ho deixen literal","Les simples només s'usen amb echo"],"a":2,"e":"Amb cometes simples, '$HOME' s'imprimeix literalment. Amb dobles, s'expandeix."}],"practice":[{"t":"Còpia de seguretat amb rotació","d":"Escriu un script que rebi un directori com a argument, en creï un .tar.gz a /backup amb la data al nom (AAAA-MM-DD) i esborri les còpies de més de 7 dies. Si no rep argument o el directori no existeix, ha de mostrar un error per stderr i sortir amb codi 1.","s":"<pre>#!/bin/bash\nif [ $# -ne 1 ] || [ ! -d \"$1\" ]; then\n  echo \"Ús: $0 directori\" >&2\n  exit 1\nfi\nDESTI=/backup\nNOM=$(basename \"$1\")-$(date +%F).tar.gz\ntar -czf \"$DESTI/$NOM\" \"$1\" || exit 1\nfind \"$DESTI\" -name \"*.tar.gz\" -mtime +7 -delete\necho \"Còpia creada: $DESTI/$NOM\"</pre><p>Per programar-lo cada nit a les 3:00: <code>0 3 * * * /usr/local/bin/backup.sh /var/www</code>.</p>"},{"t":"Anàlisi d'un log d'accés","d":"Tens un fitxer access.log amb format Apache (la IP és el primer camp i el codi HTTP el novè). Obtén: (a) les 5 IP amb més peticions; (b) quantes peticions han retornat 404; (c) les línies amb error 5xx guardades a errors.txt.","s":"<pre># (a)\ncut -d' ' -f1 access.log | sort | uniq -c | sort -rn | head -5\n# (b)\nawk '$9 == 404' access.log | wc -l\n# (c)\nawk '$9 ~ /^5/' access.log > errors.txt</pre><p>Fixa't que <code>uniq -c</code> necessita l'entrada ordenada i que el segon <code>sort -rn</code> ordena pel recompte.</p>"},{"t":"Directori compartit d'equip","d":"Crea /srv/projecte perquè els membres del grup 'dev' hi puguin crear i editar fitxers, els fitxers nous pertanyin automàticament al grup 'dev', ningú pugui esborrar fitxers d'un altre i la resta d'usuaris no hi tingui accés. Afegeix l'usuari 'anna' al grup.","s":"<pre>groupadd dev\nusermod -aG dev anna\nmkdir -p /srv/projecte\nchown root:dev /srv/projecte\nchmod 3770 /srv/projecte   # 2000 SGID + 1000 sticky + 770</pre><p>SGID fa que els fitxers hereten el grup, el sticky bit impedeix esborrar fitxers d'altres i 770 deixa fora la resta d'usuaris.</p>"}]},"windows":{"url":"https://learn.microsoft.com/en-us/windows/","prompt":"<span class=\"ps\">PS C:\\&gt;</span> Get-Help Windows","summary":"\n<h3>Què cobreix la documentació</h3>\n<p>El portal de Microsoft Learn agrupa la documentació tècnica de Windows en diverses àrees: desenvolupament d'aplicacions, eines de desenvolupament, controladors de maquinari, Windows client per a professionals de TI (Windows 10 i 11), <b>Windows Server</b>, Windows per a IoT, el programa Windows Insider i <b>Windows 365</b> (Windows al núvol com a servei). Per a l'oposició, el més rellevant és l'administració de client i servidor i l'entorn de desenvolupament.</p>\n\n<h3>Arquitectura</h3>\n<ul>\n<li>Nucli de la família <b>Windows NT</b>, amb <b>mode nucli</b> (kernel, controladors, HAL, que abstreu el maquinari) i <b>mode usuari</b> (aplicacions i subsistemes).</li>\n<li><b>Registre</b>: base de dades jeràrquica de configuració. Claus arrel: <code>HKEY_LOCAL_MACHINE</code> (HKLM, configuració de l'equip), <code>HKEY_CURRENT_USER</code> (HKCU), <code>HKEY_USERS</code>, <code>HKEY_CLASSES_ROOT</code> (associacions de fitxers i COM), <code>HKEY_CURRENT_CONFIG</code>. S'edita amb <code>regedit</code> o <code>reg</code>.</li>\n<li><b>Serveis</b>: processos en segon pla (equivalents als dimonis), gestionats amb <code>services.msc</code>, <code>sc</code> o <code>Get-Service</code>. Tipus d'inici: automàtic, automàtic retardat, manual o deshabilitat.</li>\n</ul>\n\n<h3>Sistemes de fitxers i permisos</h3>\n<div class=\"tbl\"><table>\n<tr><th>Sistema</th><th>Característiques</th></tr>\n<tr><td><b>NTFS</b></td><td>Estàndard. ACL, journaling, quotes, compressió, xifratge EFS, enllaços.</td></tr>\n<tr><td><b>ReFS</b></td><td>Resilient File System, orientat a servidors i grans volums, amb integritat de dades.</td></tr>\n<tr><td><b>FAT32</b></td><td>Compatibilitat àmplia; fitxers de 4 GB com a màxim i sense permisos.</td></tr>\n<tr><td><b>exFAT</b></td><td>Per a memòries extraïbles, sense el límit de 4 GB.</td></tr>\n</table></div>\n<p>Permisos <b>NTFS</b>: control total, modificar, lectura i execució, mostrar contingut de la carpeta, lectura i escriptura. Es poden heretar i una <b>denegació explícita</b> preval sobre una concessió. En accedir per xarxa a una carpeta compartida (<b>SMB</b>) es combinen els permisos de compartició i els NTFS, i s'aplica <b>el més restrictiu</b> dels dos.</p>\n\n<h3>Usuaris, dominis i polítiques</h3>\n<ul>\n<li>Comptes <b>locals</b> (base SAM de l'equip), comptes <b>de domini</b> i comptes Microsoft / Entra ID.</li>\n<li><b>Active Directory Domain Services (AD DS)</b>: directori centralitzat. Elements: domini, arbre, bosc, <b>unitats organitzatives (OU)</b>, grups i <b>controladors de domini</b>. Autenticació amb <b>Kerberos</b> (NTLM com a protocol antic) i consultes per <b>LDAP</b>.</li>\n<li><b>Directives de grup (GPO)</b>: configuració centralitzada aplicada a llocs, dominis i OU. Ordre d'aplicació: local, lloc, domini, OU (LSDOU); l'última que s'aplica guanya. Ordres: <code>gpupdate /force</code> i <code>gpresult /r</code>.</li>\n<li><b>UAC</b> (Control de comptes d'usuari): fins i tot els administradors treballen amb privilegis estàndard fins que s'eleva l'execució.</li>\n</ul>\n\n<h3>Windows Server</h3>\n<ul>\n<li>S'organitza en <b>rols</b> (AD DS, DNS, DHCP, servidor de fitxers, <b>IIS</b>, Hyper-V, Remote Desktop Services, WSUS) i <b>característiques</b> (.NET Framework, clúster de conmutació per error, BitLocker…).</li>\n<li>Instal·lació <b>Server Core</b> (sense interfície gràfica, menys superfície d'atac i menys actualitzacions) o amb experiència d'escriptori.</li>\n<li>Administració amb Server Manager, <b>Windows Admin Center</b> (web), consoles MMC i PowerShell remot.</li>\n<li><b>IIS</b>: llocs, <b>bindings</b> (protocol, IP, port i nom de host), <b>grups d'aplicacions</b> (application pools) que aïllen els processos <code>w3wp.exe</code>, i configuració a <code>web.config</code>.</li>\n<li><b>Hyper-V</b>: virtualització nativa; el client també inclou contenidors i WSL.</li>\n</ul>\n\n<h3>Línia d'ordres: CMD i PowerShell</h3>\n<p><b>PowerShell</b> treballa amb <b>objectes</b>, no amb text, i els cmdlets segueixen el patró <b>Verb-Nom</b>. Es fa servir per automatitzar i administrar de manera remota (<code>Enter-PSSession</code>, <code>Invoke-Command</code>). Per seguretat, l'execució de scripts depèn de la <b>política d'execució</b> (<code>Get-ExecutionPolicy</code>, <code>Set-ExecutionPolicy RemoteSigned</code>).</p>\n<div class=\"tbl\"><table>\n<tr><th>Tasca</th><th>CMD</th><th>PowerShell</th></tr>\n<tr><td>Llistar fitxers</td><td><code>dir</code></td><td><code>Get-ChildItem</code></td></tr>\n<tr><td>Processos</td><td><code>tasklist</code> / <code>taskkill</code></td><td><code>Get-Process</code> / <code>Stop-Process</code></td></tr>\n<tr><td>Serveis</td><td><code>sc query</code>, <code>net start</code></td><td><code>Get-Service</code>, <code>Restart-Service</code></td></tr>\n<tr><td>Xarxa</td><td><code>ipconfig</code>, <code>ping</code>, <code>netstat</code></td><td><code>Get-NetIPAddress</code>, <code>Test-NetConnection</code></td></tr>\n<tr><td>Ajuda</td><td><code>ordre /?</code></td><td><code>Get-Help</code>, <code>Get-Command</code></td></tr>\n</table></div>\n<p>Altres eines: <code>robocopy</code> (còpia robusta), <code>chkdsk</code>, <code>sfc /scannow</code>, <code>icacls</code> (permisos NTFS per línia d'ordres), <code>winget</code> (gestor de paquets), <b>Windows Terminal</b>.</p>\n\n<h3>Supervisió i diagnòstic</h3>\n<ul>\n<li><b>Visor d'esdeveniments</b> (<code>eventvwr</code>): registres Aplicació, Sistema i Seguretat, entre d'altres. Des de PowerShell, <code>Get-WinEvent</code>.</li>\n<li><b>Programador de tasques</b> (equivalent a cron), amb desencadenadors per hora, inici de sessió o esdeveniment.</li>\n<li>Administrador de tasques, Monitor de rendiment (<code>perfmon</code>) i Monitor de recursos.</li>\n</ul>\n\n<h3>Seguretat i gestió de dispositius</h3>\n<ul>\n<li><b>Microsoft Defender</b> (antivirus), <b>Firewall de Windows Defender</b>, <b>BitLocker</b> (xifratge de disc complet, amb suport de TPM), Windows Hello i Credential Guard.</li>\n<li>Actualitzacions: Windows Update, <b>WSUS</b> (servidor intern d'actualitzacions) i Windows Update for Business.</li>\n<li>Gestió moderna: <b>Microsoft Intune</b> (MDM) i <b>Windows Autopilot</b> per al desplegament d'equips nous.</li>\n</ul>\n\n<h3>Entorn de desenvolupament</h3>\n<ul>\n<li>Frameworks per a aplicacions: <b>Windows App SDK / WinUI 3</b>, WPF, Windows Forms, .NET i Win32 (C++).</li>\n<li><b>WSL</b> (Windows Subsystem for Linux): executa distribucions Linux dins Windows; WSL 2 fa servir un nucli Linux real en una màquina virtual lleugera.</li>\n<li>Eines: Visual Studio, VS Code, Windows Terminal, winget, Dev Drive (volum basat en ReFS optimitzat per a codi).</li>\n</ul>\n<div class=\"key\">Per a l'examen: NTFS i compartició (s'aplica el més restrictiu), AD DS i GPO (ordre LSDOU), Server Core, PowerShell orientat a objectes i Verb-Nom, i els grups d'aplicacions d'IIS.</div>","test":[{"q":"En accedir per xarxa a una carpeta compartida amb permisos de compartició 'Lectura' i NTFS 'Modificar', quin permís efectiu té l'usuari?","o":["Modificar","Lectura","Control total","Cap"],"a":1,"e":"Es combinen tots dos nivells i s'aplica el més restrictiu: Lectura."},{"q":"Quina característica defineix PowerShell respecte a CMD?","o":["Només funciona a Windows Server","Passa objectes pel pipeline en lloc de text","No admet scripts","No es pot fer servir en remot"],"a":1,"e":"Els cmdlets retornen objectes .NET amb propietats, cosa que facilita filtrar-los i manipular-los."},{"q":"Quin és l'ordre d'aplicació de les GPO?","o":["Domini, OU, lloc, local","Local, lloc, domini, OU","OU, domini, lloc, local","Lloc, local, OU, domini"],"a":1,"e":"LSDOU: Local, Site (lloc), Domain (domini) i OU. L'última aplicada té prioritat."},{"q":"Quin protocol d'autenticació fa servir Active Directory per defecte?","o":["RADIUS","Kerberos","SAML","Basic"],"a":1,"e":"Kerberos és el protocol per defecte en un domini; NTLM es manté per compatibilitat."},{"q":"Quina clau del registre conté la configuració de l'usuari que ha iniciat sessió?","o":["HKLM","HKCR","HKCU","HKCC"],"a":2,"e":"HKEY_CURRENT_USER. HKLM correspon a la màquina i HKCR a les associacions de fitxers i COM."},{"q":"Quin avantatge principal té una instal·lació Server Core?","o":["Inclou més rols","Menys superfície d'atac i menys actualitzacions","Permet executar aplicacions d'escriptori","No necessita llicència"],"a":1,"e":"Sense interfície gràfica hi ha menys components exposats. S'administra en remot o amb PowerShell."},{"q":"A IIS, per a què serveix un grup d'aplicacions (application pool)?","o":["Per agrupar certificats SSL","Per aïllar aplicacions en processos de treball separats","Per definir regles de reescriptura","Per gestionar comptes de domini"],"a":1,"e":"Cada grup té els seus processos w3wp.exe, la seva identitat i la seva configuració de reciclatge, de manera que una fallada no afecta les altres aplicacions."},{"q":"Quin sistema de fitxers té un límit de 4 GB per fitxer?","o":["NTFS","exFAT","FAT32","ReFS"],"a":2,"e":"FAT32 limita la mida dels fitxers a 4 GB i no admet ACL."},{"q":"Quina eina de Windows equival a cron?","o":["Visor d'esdeveniments","Programador de tasques","Monitor de rendiment","Server Manager"],"a":1,"e":"El Programador de tasques executa accions segons desencadenadors (hora, inici, esdeveniment)."},{"q":"Què és WSUS?","o":["Un antivirus","Un servidor intern per distribuir actualitzacions de Windows","Un subsistema Linux","Un servei de directori"],"a":1,"e":"Windows Server Update Services permet aprovar i distribuir actualitzacions dins l'organització."},{"q":"Quin cmdlet mostra els serveis de l'equip?","o":["Get-Process","Get-Service","Show-Services","sc list"],"a":1,"e":"Get-Service, seguint el patró Verb-Nom. Get-Process llista processos."},{"q":"Què passa si un usuari té un permís NTFS 'Permetre' heretat i un 'Denegar' explícit sobre el mateix recurs?","o":["Preval el permís","Preval la denegació","S'aplica el més recent","Depèn del grup"],"a":1,"e":"Una denegació explícita preval sobre els permisos concedits."},{"q":"Quina tecnologia xifra el volum complet del disc?","o":["EFS","BitLocker","Defender","Credential Guard"],"a":1,"e":"BitLocker xifra volums sencers (habitualment amb TPM). EFS xifra fitxers individuals a NTFS."},{"q":"Què permet WSL 2?","o":["Executar aplicacions Android","Executar distribucions Linux amb un nucli Linux real","Emular MS-DOS","Virtualitzar macOS"],"a":1,"e":"WSL 2 fa servir un nucli Linux en una màquina virtual lleugera integrada a Windows."},{"q":"Quina ordre força l'aplicació immediata de les directives de grup?","o":["gpresult /r","gpupdate /force","secpol.msc","net policy"],"a":1,"e":"gpupdate /force les torna a aplicar. gpresult /r mostra quines s'apliquen."}],"practice":[{"t":"Informe de serveis aturats","d":"Escriu un script de PowerShell que llisti els serveis amb inici automàtic que estan aturats, intenti iniciar-los i desi en un CSV el nom, l'estat final i la data.","s":"<pre>$resultat = Get-Service | Where-Object {\n    $_.StartType -eq 'Automatic' -and $_.Status -eq 'Stopped'\n} | ForEach-Object {\n    try { Start-Service -Name $_.Name -ErrorAction Stop } catch { }\n    $s = Get-Service -Name $_.Name\n    [PSCustomObject]@{\n        Nom   = $s.Name\n        Estat = $s.Status\n        Data  = Get-Date -Format 'yyyy-MM-dd HH:mm'\n    }\n}\n$resultat | Export-Csv C:\\informes\\serveis.csv -NoTypeInformation -Encoding UTF8</pre><p>Fixa't que es treballa amb propietats d'objectes (StartType, Status) i no amb text.</p>"},{"t":"Cas de permisos a un servidor de fitxers","d":"La carpeta \\\\SRV01\\Informes està compartida amb 'Tothom: Control total'. A NTFS, el grup Comptabilitat té 'Modificar' i el grup Becaris té 'Lectura'. L'usuari Pau és dels dos grups i, a més, té 'Denegar escriptura' explícit. Quin accés té el Pau per xarxa? I si accedeix localment al servidor?","s":"<p>Els permisos NTFS acumulats serien Modificar + Lectura = <b>Modificar</b>, però la <b>denegació explícita d'escriptura</b> preval, de manera que el Pau es queda amb lectura i execució.</p><p>Per xarxa es combina amb el permís de compartició (Control total) i s'aplica el més restrictiu: <b>lectura</b>. En local no hi intervé la compartició i el resultat és el mateix: <b>lectura</b>.</p><p>Bona pràctica: deixar la compartició oberta a usuaris autenticats i controlar l'accés amb NTFS.</p>"},{"t":"Publicar una aplicació a IIS","d":"Has de publicar una API .NET a IIS a https://api.intranet.ub.edu, aïllada de la resta de llocs i reiniciada cada nit a les 3:00. Indica els passos principals.","s":"<ol><li>Instal·lar el rol IIS i el <b>.NET Hosting Bundle</b>.</li><li>Crear un <b>grup d'aplicacions</b> propi (per a .NET Core, \"Sense codi administrat\") amb identitat ApplicationPoolIdentity.</li><li>Crear el lloc apuntant a la carpeta publicada i assignar-li aquest grup.</li><li><b>Binding</b> https, port 443, nom de host api.intranet.ub.edu i el certificat corresponent.</li><li>Donar permisos NTFS de lectura a <code>IIS AppPool\\NomDelGrup</code>.</li><li>Al grup d'aplicacions, configurar el <b>reciclatge</b> a una hora concreta: 03:00.</li></ol>"}]}});

summary:`
<h3>Fonaments del llenguatge</h3>
<p>Java és un llenguatge orientat a objectes, fortament tipat i compilat a <b>bytecode</b> (<code>.class</code>) que executa la <b>JVM</b>: "escriu una vegada, executa a tot arreu". El <b>JDK</b> inclou el compilador <code>javac</code> i les eines; el <b>JRE</b> (avui integrat al JDK) és l'entorn d'execució. El punt d'entrada és <code>public static void main(String[] args)</code>.</p>
<ul>
<li><b>Tipus primitius</b> (8): <code>byte</code>, <code>short</code>, <code>int</code>, <code>long</code>, <code>float</code>, <code>double</code>, <code>char</code>, <code>boolean</code>. La resta són referències (objectes). Cada primitiu té una classe embolcall (<code>Integer</code>, <code>Double</code>…) i hi ha <i>autoboxing</i>.</li>
<li><code>String</code> és immutable. Per comparar contingut cal <code>equals()</code>, no <code>==</code> (que compara referències). Per concatenar molt, <code>StringBuilder</code>.</li>
<li>Estructures: <code>if/else</code>, <code>switch</code>, <code>for</code>, <code>for-each</code>, <code>while</code>, <code>do-while</code>, <code>break</code>, <code>continue</code>.</li>
<li>Entrada per teclat amb <code>Scanner</code>; vectors amb <code>int[] v = new int[5]</code> (mida fixa, índex des de 0, <code>v.length</code>); matrius com a vectors de vectors.</li>
</ul>
<h3>Programació orientada a objectes</h3>
<ul>
<li><b>Classe</b> (plantilla) i <b>objecte</b> (instància creada amb <code>new</code>). <b>Constructor</b>: mateix nom que la classe, sense tipus de retorn; es pot sobrecarregar.</li>
<li><b>Encapsulament</b> amb modificadors: <code>private</code> (classe), sense modificador (paquet), <code>protected</code> (paquet i subclasses), <code>public</code> (tothom). Getters i setters.</li>
<li><b>Herència</b> amb <code>extends</code>: només herència simple de classes. <code>super</code> accedeix a la classe pare. Totes les classes deriven d'<code>Object</code>.</li>
<li><b>Polimorfisme</b>: <i>sobreescriptura</i> (<code>@Override</code>, mateixa signatura en la subclasse, en temps d'execució) i <i>sobrecàrrega</i> (mateix nom, paràmetres diferents, en compilació).</li>
<li><b>Classes abstractes</b> (<code>abstract</code>, no s'instancien, poden tenir codi) i <b>interfícies</b> (<code>implements</code>; una classe pot implementar-ne moltes; des de Java 8 admeten mètodes <code>default</code> i <code>static</code>).</li>
<li><code>static</code>: pertany a la classe, no a l'objecte. <code>final</code>: variable constant, mètode no sobreescrivible, classe no heretable.</li>
</ul>
<h3>Excepcions, col·leccions i més</h3>
<ul>
<li><code>try / catch / finally</code>, <code>throw</code>, <code>throws</code>. Excepcions <b>comprovades</b> (checked, deriven d'<code>Exception</code>, s'han de tractar o declarar, p. ex. <code>IOException</code>) i <b>no comprovades</b> (<code>RuntimeException</code>: <code>NullPointerException</code>, <code>ArrayIndexOutOfBoundsException</code>). <i>try-with-resources</i> tanca recursos <code>AutoCloseable</code> automàticament.</li>
<li>Col·leccions: <code>List</code> (<code>ArrayList</code>, <code>LinkedList</code>; ordre i duplicats), <code>Set</code> (<code>HashSet</code>, <code>TreeSet</code>; sense duplicats), <code>Map</code> (<code>HashMap</code>, <code>TreeMap</code>; clau-valor). Genèrics: <code>List&lt;String&gt;</code>.</li>
<li>Fitxers: <code>FileReader</code>/<code>BufferedReader</code>, <code>FileWriter</code>, i l'API <code>java.nio.file.Files</code>.</li>
<li>Fils: <code>Thread</code> o <code>Runnable</code>, <code>synchronized</code>.</li>
<li>Interfícies gràfiques clàssiques amb <b>Swing</b> (<code>JFrame</code>, <code>JButton</code>, <code>ActionListener</code>).</li>
</ul>`,

["Jerarquia de figures","Defineix una classe abstracta Figura amb un mètode abstracte area(). Crea Cercle i Rectangle que l'estenguin. En el main, desa diverses figures en una List i mostra l'àrea total.",`<pre>abstract class Figura { abstract double area(); }
class Cercle extends Figura {
  private final double r;
  Cercle(double r){ this.r = r; }
  @Override double area(){ return Math.PI * r * r; }
}
class Rectangle extends Figura {
  private final double b, h;
  Rectangle(double b, double h){ this.b = b; this.h = h; }
  @Override double area(){ return b * h; }
}
public class Main {
  public static void main(String[] args){
    List&lt;Figura&gt; fs = List.of(new Cercle(1), new Rectangle(2, 3));
    double total = 0;
    for (Figura f : fs) total += f.area();   // polimorfisme
    System.out.printf("Total: %.2f%n", total);
  }
}</pre>`],
["Comptar paraules d'un fitxer","Llegeix un fitxer de text i mostra quantes vegades apareix cada paraula, ordenades alfabèticament. Gestiona l'error si el fitxer no existeix.",`<pre>Map&lt;String,Integer&gt; comptes = new TreeMap&lt;&gt;();   // TreeMap ja ordena
try (BufferedReader br = new BufferedReader(new FileReader("text.txt"))) {
  String linia;
  while ((linia = br.readLine()) != null) {
    for (String p : linia.toLowerCase().split("\\\\W+")) {
      if (!p.isEmpty()) comptes.merge(p, 1, Integer::sum);
    }
  }
} catch (IOException e) {
  System.err.println("No s'ha pogut llegir: " + e.getMessage());
}
comptes.forEach((k, v) -> System.out.println(k + ": " + v));</pre><p>El <i>try-with-resources</i> tanca el lector automàticament.</p>`]
]},

"java-ee":{url:"https://www.oracle.com/es/java/technologies/java-ee-glance.html",prompt:'<span class="ps">$</span> asadmin deploy app.war',
summary:`
<h3>Què és Java EE / Jakarta EE</h3>
<p><b>Java EE</b> (Enterprise Edition) és un conjunt d'especificacions per a aplicacions empresarials: web, transaccionals, distribuïdes i segures. S'executen en un <b>servidor d'aplicacions</b> que proporciona els serveis (transaccions, seguretat, concurrència, injecció de dependències). El 2017 Oracle el va cedir a la <b>Fundació Eclipse</b> i es va reanomenar <b>Jakarta EE</b>; des de Jakarta EE 9 els paquets passen de <code>javax.*</code> a <code>jakarta.*</code>.</p>
<p>Servidors compatibles: <b>GlassFish</b> (implementació de referència), <b>WebLogic</b> (Oracle), WildFly/JBoss EAP (Red Hat), Payara, Open Liberty/WebSphere (IBM). <b>Tomcat</b> és només un contenidor web (Servlet/JSP), no un servidor EE complet.</p>
<h3>Arquitectura multicapa i contenidors</h3>
<ul>
<li>Capes: <b>client</b> (navegador o aplicació), <b>web</b> (Servlets, JSP, JSF), <b>negoci</b> (EJB, CDI) i <b>dades / EIS</b> (bases de dades, sistemes legats).</li>
<li><b>Contenidor web</b> (servlets, JSP, JSF) i <b>contenidor EJB</b> (beans de negoci). Gestionen el cicle de vida dels components.</li>
<li>Empaquetat: <b>JAR</b> (mòduls i EJB), <b>WAR</b> (aplicació web, amb <code>WEB-INF/web.xml</code> opcional) i <b>EAR</b> (aplicació empresarial que agrupa JAR i WAR).</li>
</ul>
<h3>Especificacions principals</h3>
<div class="tbl"><table>
<tr><th>API</th><th>Funció</th></tr>
<tr><td>Servlet</td><td>Classes Java que atenen peticions HTTP (<code>doGet</code>, <code>doPost</code>). Cicle de vida: <code>init</code>, <code>service</code>, <code>destroy</code>.</td></tr>
<tr><td>JSP / JSF</td><td>Pàgines dinàmiques. JSF és un framework de components amb Facelets i <i>managed beans</i>.</td></tr>
<tr><td>EJB</td><td>Beans de negoci: <i>stateless</i>, <i>stateful</i>, <i>singleton</i> i <i>message-driven</i> (MDB, consumeixen missatges JMS).</td></tr>
<tr><td>CDI</td><td>Injecció de dependències i contextos (<code>@Inject</code>, àmbits <code>@RequestScoped</code>, <code>@SessionScoped</code>, <code>@ApplicationScoped</code>).</td></tr>
<tr><td>JPA</td><td>Persistència objecte-relacional: <code>@Entity</code>, <code>@Id</code>, <code>EntityManager</code>, JPQL. Implementacions: Hibernate, EclipseLink.</td></tr>
<tr><td>JAX-RS</td><td>Serveis REST: <code>@Path</code>, <code>@GET</code>, <code>@POST</code>, <code>@Produces</code>. Implementacions: Jersey, RESTEasy.</td></tr>
<tr><td>JAX-WS</td><td>Serveis web SOAP basats en WSDL.</td></tr>
<tr><td>JMS</td><td>Missatgeria asíncrona: cues (punt a punt) i temes (publicació/subscripció).</td></tr>
<tr><td>JTA</td><td>Transaccions distribuïdes (<code>@Transactional</code>).</td></tr>
<tr><td>Bean Validation</td><td>Validació declarativa (<code>@NotNull</code>, <code>@Size</code>).</td></tr>
<tr><td>JSON-P / JSON-B, WebSocket, Security</td><td>Processament i vinculació JSON, comunicació bidireccional i seguretat declarativa.</td></tr>
<tr><td>JNDI, JDBC</td><td>Cerca de recursos per nom (p. ex. <i>datasources</i>) i accés a bases de dades.</td></tr>
</table></div>
<p>Hi ha <b>perfils</b>: el <i>Web Profile</i> (subconjunt per a aplicacions web) i el <i>Core Profile</i> (microserveis). MicroProfile complementa EE per a microserveis.</p>`,

summary:`
<h3>Plataforma i versions</h3>
<p>La documentació de <b>Java SE</b> inclou l'especificació del llenguatge (JLS), l'especificació de la màquina virtual (JVMS), la referència de l'API (Javadoc), les guies de les eines del JDK i les notes de versió. Des de Java 9 hi ha una versió nova cada <b>sis mesos</b>; les <b>LTS</b> (suport a llarg termini) són 8, 11, 17, 21 i 25. <b>OpenJDK</b> és la implementació de codi obert de referència.</p>
<h3>Eines del JDK</h3>
<ul>
<li><code>javac</code> (compilador), <code>java</code> (llançador; des de Java 11 pot executar directament un fitxer font), <code>jar</code> (empaquetat), <code>javadoc</code> (documentació a partir de comentaris <code>/** */</code>).</li>
<li><code>jshell</code> (REPL, Java 9), <code>jlink</code> (runtime personalitzat amb només els mòduls necessaris), <code>jpackage</code> (instal·ladors natius).</li>
<li>Diagnòstic: <code>jcmd</code>, <code>jstack</code> (fils), <code>jmap</code> (memòria), <code>jstat</code>, <b>JDK Flight Recorder</b> i <b>Mission Control</b>.</li>
</ul>
<h3>JVM i memòria</h3>
<ul>
<li>El <b>carregador de classes</b> carrega el bytecode; el compilador <b>JIT</b> tradueix el codi més utilitzat a codi natiu.</li>
<li><b>Heap</b> (objectes, gestionat pel <i>garbage collector</i>) i <b>pila</b> (stack, una per fil, amb variables locals i crides). Errors típics: <code>OutOfMemoryError</code> i <code>StackOverflowError</code>.</li>
<li>Col·lectors: <b>G1</b> (per defecte), ZGC i Shenandoah (pauses molt curtes), Parallel, Serial. Opcions <code>-Xms</code>/<code>-Xmx</code> (heap mínim i màxim) i <code>-Xss</code> (pila).</li>
</ul>
<h3>API principal</h3>
<ul>
<li><code>java.lang</code> (importat per defecte), <code>java.util</code> (col·leccions, <code>Optional</code>), <code>java.io</code> / <code>java.nio</code>, <code>java.time</code> (dates, Java 8: <code>LocalDate</code>, <code>Instant</code>), <code>java.net.http</code> (<code>HttpClient</code>, Java 11), <code>java.util.concurrent</code>, <code>java.sql</code> (JDBC).</li>
<li><b>Sistema de mòduls</b> (JPMS, Java 9): fitxer <code>module-info.java</code> amb <code>requires</code> i <code>exports</code>.</li>
</ul>
<h3>Evolució del llenguatge</h3>
<div class="tbl"><table>
<tr><th>Versió</th><th>Novetats destacades</th></tr>
<tr><td>8</td><td>Lambdes, interfícies funcionals, <b>Streams</b>, <code>Optional</code>, mètodes <code>default</code>, <code>java.time</code></td></tr>
<tr><td>9-11</td><td>Mòduls, <code>jshell</code>, <code>var</code> (10), <code>HttpClient</code> (11)</td></tr>
<tr><td>14-17</td><td><code>switch</code> com a expressió, <b>records</b> (16), <i>text blocks</i> (15), <i>pattern matching</i> per a <code>instanceof</code>, classes <b>sealed</b> (17)</td></tr>
<tr><td>21</td><td><b>Fils virtuals</b> (Project Loom), <i>pattern matching</i> a <code>switch</code>, <i>record patterns</i>, col·leccions seqüencials</td></tr>
</table></div>

"js":{url:"https://devdocs.io/javascript/",prompt:'<span class="ps">&gt;</span> typeof devdocs',
summary:`
<h3>Característiques</h3>
<p>JavaScript (estandarditzat com a <b>ECMAScript</b>) és un llenguatge interpretat / compilat JIT, de <b>tipatge dinàmic</b>, multiparadigma i basat en <b>prototips</b>. S'executa al navegador i al servidor (<b>Node.js</b>). Des d'<b>ES2015 (ES6)</b> hi ha una versió anual. DevDocs agrupa la referència de MDN: objectes globals, sentències, operadors, funcions, classes i gramàtica.</p>
<h3>Tipus i variables</h3>
<ul>
<li>Primitius: <code>string</code>, <code>number</code>, <code>bigint</code>, <code>boolean</code>, <code>undefined</code>, <code>null</code>, <code>symbol</code>. La resta són objectes (arrays i funcions inclosos). <code>typeof null</code> retorna <code>"object"</code> (error històric).</li>
<li><code>var</code> (àmbit de funció, <i>hoisting</i>), <code>let</code> i <code>const</code> (àmbit de bloc; <code>const</code> no permet reassignar, però l'objecte sí que es pot modificar).</li>
<li><code>==</code> converteix tipus abans de comparar; <code>===</code> compara valor i tipus (recomanat). Valors <i>falsy</i>: <code>false, 0, "", null, undefined, NaN</code>.</li>
</ul>
<h3>Funcions i objectes</h3>
<ul>
<li>Declaració, expressió i <b>funció fletxa</b> (<code>(a, b) =&gt; a + b</code>), que no té <code>this</code> propi.</li>
<li><b>Closures</b>: una funció recorda les variables de l'àmbit on es va crear.</li>
<li><code>this</code> depèn de com es crida la funció; es fixa amb <code>bind</code>, <code>call</code> o <code>apply</code>.</li>
<li>Classes (ES6) com a sintaxi sobre prototips: <code>class</code>, <code>extends</code>, <code>super</code>, camps privats amb <code>#</code>.</li>
<li>Desestructuració (<code>const {a, b} = obj</code>), operador <i>spread/rest</i> (<code>...</code>), <i>template literals</i> amb accents greus, encadenament opcional <code>?.</code> i <code>??</code> (només per a null/undefined).</li>
<li>Arrays: <code>map</code>, <code>filter</code>, <code>reduce</code>, <code>find</code>, <code>some</code>, <code>every</code>, <code>forEach</code>, <code>includes</code>. Altres estructures: <code>Map</code>, <code>Set</code>, <code>WeakMap</code>.</li>
<li>JSON: <code>JSON.stringify</code> i <code>JSON.parse</code>.</li>
</ul>
<h3>Asincronia</h3>
<p>JavaScript té un sol fil d'execució amb un <b>event loop</b>. Les tasques asíncrones es gestionen amb <i>callbacks</i>, <b>Promises</b> (<code>then</code>, <code>catch</code>, <code>finally</code>, <code>Promise.all</code>, <code>Promise.race</code>) i <b>async/await</b>. Les microtasques (promeses) s'executen abans que les macrotasques (<code>setTimeout</code>).</p>
<pre>async function carregaUsuari(id) {
  try {
    const resp = await fetch("/api/usuaris/" + id);
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    return await resp.json();
  } catch (e) {
    console.error(e);
  }
}</pre>
<h3>Mòduls i entorn</h3>
<p>Mòduls ES (<code>import</code> / <code>export</code>) i, a Node, CommonJS (<code>require</code>). Mode estricte amb <code>"use strict"</code> (automàtic als mòduls i classes). Errors: <code>try/catch</code>, <code>throw</code>, tipus <code>Error</code>, <code>TypeError</code>, <code>ReferenceError</code>.</p>`,

summary:`
<h3>Què és Angular</h3>
<p>Framework de Google per a aplicacions web d'una sola pàgina (SPA), escrit en <b>TypeScript</b>. No s'ha de confondre amb AngularJS (1.x), que és un altre producte ja sense suport. La documentació oficial és a angular.dev. Hi ha versió major cada sis mesos.</p>
<h3>Angular CLI</h3>
<p><code>ng new</code> (crear projecte), <code>ng serve</code> (servidor de desenvolupament), <code>ng generate component|service|pipe|guard</code> (o <code>ng g c</code>), <code>ng build</code> (compilació de producció a <code>dist/</code>), <code>ng test</code>, <code>ng update</code>. La configuració és a <code>angular.json</code>.</p>
<h3>Blocs principals</h3>
<ul>
<li><b>Components</b>: classe amb <code>@Component</code> (selector, plantilla, estils). Des de les versions recents són <b>standalone</b> per defecte i importen directament el que necessiten, sense <code>NgModule</code>.</li>
<li><b>Plantilles i vinculació de dades</b>: interpolació <code>{{ valor }}</code>, <i>property binding</i> <code>[src]="url"</code>, <i>event binding</i> <code>(click)="desa()"</code> i <i>two-way binding</i> <code>[(ngModel)]="nom"</code>.</li>
<li><b>Control de flux</b> a la plantilla: <code>@if</code>, <code>@for (x of llista; track x.id)</code>, <code>@switch</code> i <code>@defer</code> (càrrega diferida). Abans es feien amb les directives <code>*ngIf</code> i <code>*ngFor</code>.</li>
<li>Comunicació entre components: <code>input()</code> / <code>@Input</code> (pare a fill) i <code>output()</code> / <code>@Output</code> amb <code>EventEmitter</code> (fill a pare).</li>
<li><b>Serveis i injecció de dependències</b>: <code>@Injectable({providedIn: 'root'})</code> crea un singleton. S'injecta amb el constructor o amb <code>inject()</code>.</li>
<li><b>Directives</b> (de component, estructurals i d'atribut) i <b>pipes</b> (<code>{{ data | date:'dd/MM/yyyy' }}</code>, <code>uppercase</code>, <code>currency</code>, <code>async</code>).</li>
<li><b>Cicle de vida</b>: <code>ngOnInit</code>, <code>ngOnChanges</code>, <code>ngAfterViewInit</code>, <code>ngOnDestroy</code>.</li>
</ul>
<h3>Reactivitat</h3>
<ul>
<li><b>Signals</b>: <code>signal()</code>, <code>computed()</code>, <code>effect()</code>. Permeten una detecció de canvis precisa i aplicacions <i>zoneless</i>.</li>
<li><b>RxJS</b>: <code>Observable</code>, <code>subscribe</code>, operadors <code>map</code>, <code>filter</code>, <code>switchMap</code>, <code>debounceTime</code>. El pipe <code>async</code> se subscriu i es dessubscriu automàticament.</li>
</ul>
<h3>Encaminament, formularis i HTTP</h3>
<ul>
<li><b>Router</b>: definició de rutes, <code>&lt;router-outlet&gt;</code>, <code>routerLink</code>, paràmetres, <i>lazy loading</i> amb <code>loadComponent</code> i <b>guards</b> (<code>canActivate</code>) per protegir rutes.</li>
<li><b>Formularis</b>: basats en plantilla (<code>ngModel</code>) o <b>reactius</b> (<code>FormGroup</code>, <code>FormControl</code>, <code>Validators</code>), més adequats per a lògica complexa.</li>
<li><b>HttpClient</b> (<code>provideHttpClient()</code>) retorna observables. Els <b>interceptors</b> afegeixen capçaleres (p. ex. el token) o gestionen errors globalment.</li>
<li>Altres: SSR i <i>hydration</i>, Angular Material, proves amb Jasmine/Karma o Jest i proves e2e.</li>
</ul>`,

  template: \`

  const auth = inject(AuthService);
  return auth.isLogged() ? true : inject(Router).parseUrl('/login');
};

export const tokenInterceptor: HttpInterceptorFn = (req, next) =&gt; {
  const token = inject(AuthService).token();
  return next(token
    ? req.clone({ setHeaders: { Authorization: 'Bearer ' + token } })
    : req);
};

<p>Conjunt d'eines de codi obert per <b>automatitzar navegadors</b>, sobretot per a proves funcionals i <i>end-to-end</i> d'aplicacions web. Té tres components:</p>

<li><b>Selenium IDE</b>: extensió de navegador per gravar i reproduir proves sense programar.</li>
<li><b>Selenium Grid</b>: executa proves en paral·lel en diverses màquines, navegadors i sistemes. Arquitectura amb <i>hub</i> i <i>nodes</i> (Router, Distributor, Session Map i Node a Grid 4).</li>
</ul>
<h3>WebDriver en pràctica</h3>
<ul>
<li>Localitzadors (<code>By</code>): <code>id</code>, <code>name</code>, <code>className</code>, <code>tagName</code>, <code>linkText</code>, <code>partialLinkText</code>, <code>cssSelector</code>, <code>xpath</code>. Selenium 4 afegeix els <i>relative locators</i> (<code>above</code>, <code>below</code>, <code>near</code>…).</li>

summary:`
<h3>Característiques</h3>
<p>PHP és un llenguatge de script de costat servidor, interpretat i de tipatge dinàmic, molt usat en web (WordPress i Drupal hi estan fets). php.net conté el manual, la referència de funcions, les guies d'instal·lació i les notes de migració. Versions actuals: la branca 8.x (JIT des de 8.0).</p>
<ul>
<li>El codi va entre <code>&lt;?php ... ?&gt;</code>. Les variables comencen per <code>$</code> i les sentències acaben en <code>;</code>.</li>
<li>Execució: mòdul d'Apache (<code>mod_php</code>), <b>PHP-FPM</b> (FastCGI, habitual amb Nginx o Apache) o línia d'ordres (<code>php fitxer.php</code>). Configuració a <code>php.ini</code>.</li>
<li>Tipus: <code>int</code>, <code>float</code>, <code>string</code>, <code>bool</code>, <code>array</code>, <code>object</code>, <code>null</code>, <code>callable</code>. Declaracions de tipus en paràmetres i retorns i <code>declare(strict_types=1)</code>.</li>
<li>Cadenes: amb cometes dobles s'interpolen variables; amb simples no. Concatenació amb <code>.</code>.</li>
<li>Comparació: <code>==</code> (amb conversió de tipus) i <code>===</code> (estricta). <code>??</code> per a valors per defecte.</li>
</ul>
<h3>Arrays i funcions</h3>
<p>L'array és un mapa ordenat que serveix com a llista o com a associatiu: <code>$a = ['nom' =&gt; 'Anna', 'edat' =&gt; 30];</code>. Funcions habituals: <code>count</code>, <code>in_array</code>, <code>array_map</code>, <code>array_filter</code>, <code>sort</code>/<code>ksort</code>, <code>implode</code>/<code>explode</code>, <code>json_encode</code>/<code>json_decode</code>. Recorregut amb <code>foreach ($a as $clau =&gt; $valor)</code>.</p>
<h3>Orientació a objectes</h3>
<ul>
<li><code>class</code>, <code>new</code>, <code>-&gt;</code> per accedir a membres, <code>::</code> per a membres estàtics, <code>$this</code>, <code>__construct</code>.</li>
<li>Herència simple (<code>extends</code>), interfícies (<code>implements</code>), classes abstractes i <b>traits</b> (reutilització horitzontal de codi).</li>
<li><b>Espais de noms</b> (<code>namespace</code>, <code>use</code>) i càrrega automàtica segons <b>PSR-4</b> amb <b>Composer</b>, el gestor de dependències (<code>composer.json</code>, <code>composer install</code>).</li>
<li>PHP 8: arguments amb nom, <code>match</code>, operador <code>?-&gt;</code>, promoció de propietats al constructor, <b>enums</b> (8.1), propietats <code>readonly</code>, atributs.</li>
</ul>
<h3>Web, dades i seguretat</h3>
<ul>
<li>Superglobals: <code>$_GET</code>, <code>$_POST</code>, <code>$_SERVER</code>, <code>$_SESSION</code> (amb <code>session_start()</code>), <code>$_COOKIE</code>, <code>$_FILES</code>.</li>
<li>Bases de dades amb <b>PDO</b> i <b>sentències preparades</b>, que eviten la injecció SQL.</li>
<li>Seguretat: escapar la sortida amb <code>htmlspecialchars</code> (XSS), <code>password_hash</code> / <code>password_verify</code> per a contrasenyes, tokens CSRF als formularis, validar l'entrada amb <code>filter_var</code>.</li>
<li>Errors i excepcions: <code>try/catch/finally</code>, <code>Exception</code>, <code>Error</code>, <code>Throwable</code>.</li>
</ul>`,

"git":{url:"https://git-scm.com/doc",prompt:'<span class="ps">$</span> git log --oneline',
summary:`
<h3>Conceptes</h3>
<p>Git és un sistema de control de versions <b>distribuït</b> creat per Linus Torvalds el 2005. Cada còpia és un repositori complet amb tota la història. Guarda instantànies (<i>snapshots</i>) identificades per un hash (SHA-1, amb suport per a SHA-256). La documentació oficial inclou el manual de referència i el llibre <i>Pro Git</i>.</p>
<p>Tres àrees: <b>directori de treball</b>, <b>àrea de preparació</b> (<i>staging</i> o índex) i <b>repositori</b> (<code>.git</code>). Estats d'un fitxer: no seguit, modificat, preparat, confirmat.</p>
<h3>Ordres essencials</h3>
<div class="tbl"><table>
<tr><th>Ordre</th><th>Funció</th></tr>
<tr><td><code>git init</code> / <code>git clone url</code></td><td>Crear o copiar un repositori</td></tr>
<tr><td><code>git config --global user.name</code></td><td>Configuració (nivells system, global i local)</td></tr>
<tr><td><code>git status</code>, <code>git diff</code> (<code>--staged</code>)</td><td>Veure l'estat i les diferències</td></tr>
<tr><td><code>git add</code>, <code>git commit -m</code></td><td>Preparar i confirmar canvis</td></tr>
<tr><td><code>git log --oneline --graph</code></td><td>Historial</td></tr>
<tr><td><code>git branch</code>, <code>git switch</code> / <code>git checkout</code></td><td>Branques</td></tr>
<tr><td><code>git merge</code>, <code>git rebase</code></td><td>Integrar branques</td></tr>
<tr><td><code>git fetch</code>, <code>git pull</code>, <code>git push</code></td><td>Sincronitzar amb el remot (<code>pull</code> = <code>fetch</code> + <code>merge</code>)</td></tr>
<tr><td><code>git remote -v</code></td><td>Remots (per defecte <code>origin</code>)</td></tr>
<tr><td><code>git stash</code></td><td>Desar canvis temporalment</td></tr>
<tr><td><code>git tag -a v1.0</code></td><td>Etiquetes (lleugeres o anotades)</td></tr>
</table></div>
<h3>Desfer canvis</h3>
<ul>
<li><code>git restore fitxer</code>: descarta canvis del directori de treball. <code>git restore --staged</code>: treu de la preparació.</li>
<li><code>git commit --amend</code>: modifica l'últim commit (si encara no s'ha publicat).</li>
<li><code>git revert &lt;hash&gt;</code>: crea un commit nou que desfà un altre. És <b>segur en branques compartides</b>.</li>
<li><code>git reset</code>: mou la branca. <code>--soft</code> manté els canvis preparats, <code>--mixed</code> (per defecte) els deixa al directori de treball i <code>--hard</code> els esborra.</li>
<li><code>git reflog</code>: historial de referències per recuperar commits "perduts".</li>
</ul>
<h3>Branques i fluxos de treball</h3>
<ul>
<li><b>Merge</b>: <i>fast-forward</i> si no hi ha divergència; si n'hi ha, crea un commit de fusió. <b>Rebase</b>: reaplica els commits sobre una altra base i deixa una història lineal; no s'ha de fer sobre commits ja compartits.</li>
<li>Conflictes: marques <code>&lt;&lt;&lt;&lt;&lt;&lt;&lt;</code>, <code>=======</code>, <code>&gt;&gt;&gt;&gt;&gt;&gt;&gt;</code>; es resolen, s'afegeixen i es confirma.</li>
<li>Fluxos: <b>Git Flow</b> (main, develop, feature, release, hotfix), <b>GitHub Flow</b> (main + branques de funcionalitat + pull requests) i <i>trunk-based development</i>.</li>
<li><code>.gitignore</code> per excloure fitxers; <code>git cherry-pick</code> aplica un commit concret; <code>git bisect</code> cerca el commit que ha introduït un error; <i>hooks</i> a <code>.git/hooks</code>.</li>
</ul>`,

"jmeter":{url:"https://jmeter.apache.org",prompt:'<span class="ps">$</span> jmeter -n -t pla.jmx',
summary:`
<h3>Apache JMeter</h3>
<p>Eina de codi obert en Java per a <b>proves de càrrega i rendiment</b>, i també funcionals. Simula molts usuaris concurrents contra un servidor. Admet HTTP/HTTPS, SOAP/REST, FTP, JDBC, LDAP, JMS, correu i TCP. No és un navegador: no executa JavaScript ni renderitza pàgines.</p>
<h3>Elements d'un pla de prova (.jmx)</h3>
<ul>
<li><b>Test Plan</b>: arrel del pla.</li>
<li><b>Thread Group</b>: grup d'usuaris virtuals. Defineix el nombre de fils (usuaris), el <b>ramp-up</b> (segons per arrencar-los tots) i les iteracions o la durada.</li>
<li><b>Samplers</b>: peticions (HTTP Request, JDBC Request…).</li>
<li><b>Logic Controllers</b>: Loop, If, While, Transaction Controller, Once Only…</li>
<li><b>Config Elements</b>: HTTP Request Defaults, Cookie Manager, Header Manager, <b>CSV Data Set Config</b> (dades parametritzades).</li>
<li><b>Timers</b>: pauses entre peticions per simular el temps de pensar de l'usuari (Constant, Gaussian, Uniform).</li>
<li><b>Pre/Post-processors</b>: <b>extractors</b> (Regular Expression, JSON, XPath) per capturar valors dinàmics com tokens de sessió (correlació).</li>
<li><b>Assertions</b>: validen respostes (Response, Duration, Size, JSON).</li>
<li><b>Listeners</b>: resultats (View Results Tree, Summary Report, Aggregate Report). Consumeixen molts recursos i no s'han de fer servir a les proves reals.</li>
</ul>
<p>Ordre d'execució dins l'abast: Config, Pre-processors, Timers, Sampler, Post-processors, Assertions i Listeners.</p>
<h3>Execució i mètriques</h3>
<ul>
<li>La GUI serveix per dissenyar i depurar. Les proves de càrrega es fan en <b>mode no gràfic</b>: <code>jmeter -n -t pla.jmx -l resultats.jtl -e -o informe/</code>, que genera un informe HTML.</li>
<li>Proves distribuïdes amb un controlador i diversos servidors remots (<code>jmeter-server</code>).</li>
<li>Mètriques: temps de resposta mitjà, mediana, <b>percentils</b> (90, 95, 99), <b>throughput</b> (peticions per segon), percentatge d'errors i latència.</li>
<li>Tipus de prova: càrrega (volum esperat), estrès (fins que falla), resistència o <i>soak</i> (molta durada), pics (<i>spike</i>).</li>
<li>Gravació amb l'<b>HTTP(S) Test Script Recorder</b> fent servir el JMeter com a proxy.</li>
</ul>`,

["Quin element defineix el nombre d'usuaris virtuals?",["Sampler","Thread Group","Listener","Timer"],1,"També hi ha el ramp-up i les iteracions."],
["Què és el ramp-up?",["El temps total de la prova","El temps per arrencar tots els fils","La pausa entre peticions","El temps màxim de resposta"],1,"100 fils amb 50 s de ramp-up arrenca uns 2 usuaris per segon."],
["Com s'han d'executar les proves de càrrega reals?",["Amb la GUI","En mode no gràfic (-n)","Des del navegador","Amb el listener View Results Tree"],1,"La GUI i els listeners pesats distorsionen els resultats."],

["Què mesura el throughput?",["La mida de les respostes","Les peticions processades per unitat de temps","El temps de connexió","El percentatge d'errors"],1,"Normalment s'expressa en peticions per segon."],
["JMeter executa el JavaScript de les pàgines?",["Sí, com un navegador","No","Només en mode GUI","Només amb Selenium"],1,"Treballa a nivell de protocol."],

"soapui":{url:"https://www.soapui.org",prompt:'<span class="ps">$</span> testrunner.sh projecte.xml',
summary:`
<h3>SoapUI</h3>
<p>Eina de proves d'<b>API</b> per a serveis <b>SOAP</b> i <b>REST</b> (també GraphQL, JMS i JDBC). Hi ha la versió de codi obert (<b>SoapUI Open Source</b>) i la comercial de SmartBear (<b>ReadyAPI</b>), amb funcions avançades com les assercions sense codi, la generació de dades i els informes.</p>
<h3>Estructura d'un projecte</h3>
<ul>
<li>El projecte es crea a partir d'un <b>WSDL</b> (SOAP) o d'una definició <b>OpenAPI/Swagger</b> o WADL (REST), i en genera les peticions d'exemple.</li>
<li>Jerarquia: <b>Projecte</b> &gt; <b>TestSuite</b> &gt; <b>TestCase</b> &gt; <b>TestStep</b>.</li>
<li>Tipus de passos: petició SOAP o REST, <b>Property Transfer</b> (passar valors d'una resposta a la petició següent), <b>Groovy Script</b>, Properties, Delay, condicions i petició JDBC.</li>
<li><b>Propietats</b> a diversos nivells (projecte, suite, cas) i expansió amb <code>\${#Project#nom}</code>.</li>
</ul>
<h3>Funcionalitats</h3>
<ul>
<li><b>Assercions</b>: Contains, Not Contains, <b>XPath Match</b>, <b>JsonPath Match</b>, SOAP Response, Not SOAP Fault, Schema Compliance (valida contra el WSDL o l'esquema), codis d'estat HTTP i temps de resposta (SLA).</li>
<li><b>Mock services</b>: simulen un servei a partir del WSDL o de la definició, útils quan el servei real no està disponible.</li>
<li><b>Proves de càrrega</b> bàsiques a partir dels casos funcionals i <b>proves de seguretat</b> (injecció SQL, XPath, mida de missatges malformats).</li>
<li>Seguretat de serveis: <b>WS-Security</b> (signatura, xifratge, UsernameToken, timestamp), autenticació bàsica i OAuth.</li>
<li>Execució per línia d'ordres amb <code>testrunner</code> per integrar-lo a Jenkins, i amb Maven.</li>
</ul>`,

["Quin llenguatge de script fa servir SoapUI?",["Python","Groovy","Bash","Lua"],1,"Els passos Groovy Script i les assercions Script."],

"postman":{url:"https://www.postman.com/learn",prompt:'<span class="ps">$</span> newman run col·leccio.json',
summary:`
<h3>Postman</h3>
<p>Plataforma per dissenyar, provar, documentar i col·laborar en <b>API</b>. El seu centre d'aprenentatge (Postman Learning Center) explica com enviar peticions, organitzar-les, automatitzar proves i treballar en equip.</p>
<h3>Conceptes</h3>
<ul>
<li><b>Peticions</b>: mètode (GET, POST, PUT, PATCH, DELETE), URL, paràmetres de consulta i de ruta, capçaleres, cos (raw JSON, form-data, x-www-form-urlencoded, binari, GraphQL).</li>
<li><b>Autorització</b>: Basic, Bearer token, API Key, <b>OAuth 2.0</b> (obtenció de tokens), AWS Signature, etc. Es pot heretar de la col·lecció.</li>
<li><b>Col·leccions</b>: agrupen peticions en carpetes i es poden exportar en JSON i compartir.</li>
<li><b>Variables</b> per àmbits, de més ampli a més concret: global, col·lecció, <b>entorn</b>, dades (data) i local. Sintaxi <code>{{baseUrl}}</code>. Els entorns permeten canviar entre desenvolupament, preproducció i producció.</li>
<li><b>Scripts</b> en JavaScript: <i>pre-request</i> (abans de la petició) i <b>tests</b> o <i>post-response</i> (després), amb l'objecte <code>pm</code>.</li>
</ul>
<pre>pm.test("Retorna 200", () =&gt; pm.response.to.have.status(200));
pm.test("Té id", () =&gt; {
  const json = pm.response.json();
  pm.expect(json.id).to.be.a("number");
  pm.collectionVariables.set("idLlibre", json.id);
});</pre>
<h3>Automatització i col·laboració</h3>
<ul>
<li><b>Collection Runner</b>: executa una col·lecció completa, amb iteracions i fitxers de dades CSV o JSON.</li>
<li><b>Newman</b> i <b>Postman CLI</b>: execució per línia d'ordres per integrar-la a CI/CD (Jenkins, GitHub Actions).</li>
<li><b>Mock servers</b> a partir d'exemples desats, <b>monitors</b> (execucions programades) i <b>documentació</b> generada a partir de la col·lecció.</li>
<li>Importació i exportació d'<b>OpenAPI</b>, cURL i altres formats. Espais de treball (<i>workspaces</i>) personals, d'equip i públics.</li>
</ul>`,

["Quina sintaxi fa servir Postman per a les variables?",["${var}","{{var}}","%var%","$var"],1,"Les dobles claus s'expandeixen a URL, capçaleres i cos."],
["Quin àmbit de variable té més prioritat en cas de conflicte?",["Global","Col·lecció","Entorn","Local"],3,"L'àmbit més concret preval: local > dades > entorn > col·lecció > global."],

summary:`
<h3>Apache Maven</h3>
<p>Eina de <b>construcció i gestió de projectes</b> Java basada en el <b>POM</b> (Project Object Model, <code>pom.xml</code>). Segueix el principi de <b>convenció sobre configuració</b> i gestiona les dependències de manera declarativa.</p>
<h3>Estructura estàndard</h3>
<pre>src/main/java        codi font
src/main/resources   recursos
src/test/java        proves
target/              sortida de la compilació</pre>
<h3>El POM</h3>
<ul>
<li><b>Coordenades</b>: <code>groupId</code>, <code>artifactId</code> i <code>version</code> (GAV). <code>packaging</code>: jar, war, pom…</li>
<li>Versions <b>SNAPSHOT</b> (en desenvolupament, poden canviar) i <i>release</i> (fixes).</li>
<li><code>&lt;dependencies&gt;</code> amb <b>àmbits</b> (<i>scope</i>): <code>compile</code> (per defecte), <code>provided</code> (la proporciona el servidor, p. ex. l'API de Servlet), <code>runtime</code>, <code>test</code>, <code>system</code> i <code>import</code>.</li>
<li><b>Dependències transitives</b>, resolució de conflictes per "la més propera guanya", <code>&lt;exclusions&gt;</code> i <code>&lt;dependencyManagement&gt;</code> per centralitzar versions (o BOM).</li>
<li><b>Herència</b> (POM pare) i <b>projectes multimòdul</b> (<code>&lt;modules&gt;</code>). Tots hereten del <i>Super POM</i>.</li>
<li><b>Propietats</b> amb sintaxi de dòlar i claus, i <b>perfils</b> per a configuracions per entorn (<code>-P prod</code>).</li>
</ul>
<h3>Cicle de vida</h3>
<p>Tres cicles: <b>clean</b>, <b>default</b> (o build) i <b>site</b>. Fases principals del cicle default, en ordre: <code>validate</code>, <code>compile</code>, <code>test</code>, <code>package</code>, <code>verify</code>, <code>install</code>, <code>deploy</code>. Executar una fase executa totes les anteriors.</p>
<ul>
<li><code>install</code> copia l'artefacte al <b>repositori local</b> (<code>~/.m2/repository</code>); <code>deploy</code> el puja al <b>repositori remot</b> (Nexus, Artifactory).</li>
<li>Repositori central: <b>Maven Central</b>. Configuració de l'usuari a <code>~/.m2/settings.xml</code> (mirrors, credencials, proxy).</li>
<li>Les tasques reals les fan els <b>connectors</b> (<i>plugins</i>) i els seus <b>objectius</b> (<i>goals</i>): compiler, surefire (proves unitàries), failsafe (integració), jar, war, dependency (<code>mvn dependency:tree</code>).</li>
<li>Opcions útils: <code>-DskipTests</code>, <code>-o</code> (fora de línia), <code>-U</code> (forçar actualització de snapshots). <b>Maven Wrapper</b> (<code>mvnw</code>) fixa la versió de Maven del projecte.</li>
<li>Arquetips (<code>mvn archetype:generate</code>) per crear projectes a partir de plantilles.</li>
</ul>`,

summary:`
<h3>Apache HTTP Server</h3>
<p>Servidor web de codi obert de l'<b>Apache Software Foundation</b>, conegut com a <b>httpd</b>. La branca estable actual és la <b>2.4</b>. És modular i multiplataforma.</p>
<h3>Configuració</h3>
<ul>
<li>Fitxer principal: <code>httpd.conf</code> (Red Hat) o <code>apache2.conf</code> (Debian/Ubuntu, amb <code>sites-available</code>/<code>sites-enabled</code> i les ordres <code>a2ensite</code> i <code>a2enmod</code>).</li>
<li>Directives bàsiques: <code>Listen</code> (port, 80 i 443), <code>ServerName</code>, <code>DocumentRoot</code>, <code>DirectoryIndex</code>, <code>ErrorLog</code>, <code>CustomLog</code>, <code>LogLevel</code>.</li>
<li>Seccions: <code>&lt;Directory&gt;</code>, <code>&lt;Location&gt;</code>, <code>&lt;Files&gt;</code>, <code>&lt;VirtualHost&gt;</code>, <code>&lt;IfModule&gt;</code>.</li>
<li>Control d'accés a la 2.4: <code>Require all granted</code>, <code>Require all denied</code>, <code>Require ip</code>, <code>Require valid-user</code> (a la 2.2 eren <code>Order</code>, <code>Allow</code> i <code>Deny</code>).</li>
<li>Fitxers <b>.htaccess</b>: configuració per directori, que només funciona si <code>AllowOverride</code> ho permet. Penalitza el rendiment.</li>
<li>Ordres: <code>apachectl configtest</code> (o <code>-t</code>) per validar la configuració, <code>apachectl graceful</code> per recarregar sense tallar connexions, <code>systemctl restart httpd</code>.</li>
</ul>
<h3>Hosts virtuals</h3>
<p>Permeten servir diversos llocs des d'un mateix servidor: <b>per nom</b> (el més habitual, segons la capçalera <code>Host</code>; amb TLS es fa servir SNI) o <b>per IP</b>.</p>
<pre>&lt;VirtualHost *:443&gt;
  ServerName biblioteca.ub.edu
  DocumentRoot /var/www/biblioteca
  SSLEngine on
  SSLCertificateFile    /etc/ssl/certs/bib.crt
  SSLCertificateKeyFile /etc/ssl/private/bib.key
  ProxyPass        /api http://localhost:8080/api
  ProxyPassReverse /api http://localhost:8080/api
&lt;/VirtualHost&gt;</pre>
<h3>Mòduls i MPM</h3>
<ul>
<li><b>MPM</b> (mòduls de multiprocessament): <b>prefork</b> (un procés per connexió, necessari amb <code>mod_php</code>), <b>worker</b> (processos amb fils) i <b>event</b> (per defecte, gestiona millor les connexions keep-alive).</li>
<li>Mòduls clau: <code>mod_ssl</code> (HTTPS), <code>mod_rewrite</code> (reescriptura d'URL amb <code>RewriteRule</code> i <code>RewriteCond</code>), <code>mod_proxy</code> i <code>mod_proxy_http</code> / <code>mod_proxy_ajp</code> (proxy invers cap a Tomcat o altres), <code>mod_proxy_balancer</code>, <code>mod_headers</code>, <code>mod_deflate</code>, <code>mod_auth_basic</code>, <code>mod_ldap</code>, <code>mod_proxy_fcgi</code> (PHP-FPM), <code>mod_status</code>.</li>
<li>Logs: <code>access_log</code> en format <i>Common</i> o <i>Combined</i> i <code>error_log</code>.</li>
</ul>`,
