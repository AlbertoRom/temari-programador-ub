"xml":{url:"https://es.wikipedia.org/wiki/Extensible_Markup_Language",prompt:'<span class="ps">&lt;?xml</span> version="1.0"?&gt;',
summary:`
<h3>XML</h3>
<p>L'<b>eXtensible Markup Language</b> és un llenguatge de marques del <b>W3C</b> (1998) per estructurar, emmagatzemar i intercanviar dades. És la base de SOAP, WSDL, SAML, METS, MODS, MARCXML, RSS, SVG i de molts fitxers de configuració.</p>
<h3>Ben format i vàlid</h3>
<ul>
<li><b>Ben format</b>: compleix les regles sintàctiques. Un sol <b>element arrel</b>, totes les etiquetes tancades, ben niades, distinció entre majúscules i minúscules, valors d'atribut entre cometes, caràcters especials com a entitats (<code>&amp;lt;</code>, <code>&amp;gt;</code>, <code>&amp;amp;</code>, <code>&amp;quot;</code>, <code>&amp;apos;</code>).</li>
<li><b>Vàlid</b>: ben format i, a més, compleix un esquema: <b>DTD</b> (antic, sintaxi no XML, sense tipus de dades) o <b>XML Schema (XSD)</b> (en XML, amb tipus de dades, cardinalitats i espais de noms). També RELAX NG.</li>
<li>Pròleg opcional <code>&lt;?xml version="1.0" encoding="UTF-8"?&gt;</code>. Comentaris <code>&lt;!-- --&gt;</code>. Seccions <b>CDATA</b> per a text que no s'ha d'interpretar.</li>
<li><b>Espais de noms</b> (<code>xmlns:dc="http://purl.org/dc/elements/1.1/"</code>) per evitar conflictes de noms entre vocabularis.</li>
</ul>
<h3>Tecnologies relacionades</h3>
<ul>
<li><b>XPath</b>: llenguatge per seleccionar nodes (<code>/biblioteca/llibre[@any&gt;2000]/titol</code>, <code>//autor</code>).</li>
<li><b>XSLT</b>: transformació d'XML en un altre XML, HTML o text, amb plantilles. <b>XQuery</b>: consultes sobre XML.</li>
<li>Processament: <b>DOM</b> (carrega tot l'arbre en memòria; permet navegar i modificar), <b>SAX</b> (basat en esdeveniments, seqüencial, poca memòria, només lectura) i <b>StAX</b> (seqüencial controlat pel programa). A Java, <b>JAXB</b> vincula XML i objectes.</li>
<li>Comparat amb JSON: XML és més verbós però admet atributs, espais de noms, comentaris i validació forta amb esquemes.</li>
</ul>`,

"xroad":{url:"https://es.wikipedia.org/wiki/X-Road",prompt:'<span class="ps">$</span> xroad --security-server',
summary:`
<h3>Què és X-Road</h3>
<p><b>X-Road</b> és una <b>capa d'intercanvi de dades</b> de codi obert que permet que organitzacions diferents (administracions, empreses) intercanviïn dades de manera <b>segura, estandarditzada i distribuïda</b> per internet. La va crear <b>Estònia</b> el 2001 (allà s'anomena X-tee) i avui la desenvolupa el <b>NIIS</b> (Nordic Institute for Interoperability Solutions), creat per Estònia i Finlàndia. Es fa servir en molts països i és un exemple clàssic d'interoperabilitat en administració electrònica.</p>
<h3>Arquitectura</h3>
<ul>
<li>Cada organització membre instal·la un <b>Security Server</b> (servidor de seguretat): fa de passarel·la, signa i xifra els missatges, els registra i verifica els de les altres organitzacions. Les aplicacions només parlen amb el seu Security Server.</li>
<li>El <b>Central Server</b> (servidor central) gestiona el registre de membres i les polítiques de seguretat i distribueix la configuració global (amb un <i>configuration proxy</i>).</li>
<li><b>Proveïdors de serveis de confiança</b>: autoritat de certificació (certificats d'autenticació i de signatura) i <b>segellat de temps</b>.</li>
<li>Identificació: <b>membres</b> (organitzacions), <b>subsistemes</b> (sistemes d'informació d'un membre) i serveis.</li>
<li>No hi ha cap punt central pel qual passin les dades: l'intercanvi és <b>directe entre Security Servers</b> (arquitectura distribuïda).</li>
</ul>
<h3>Característiques</h3>
<ul>
<li>Admet serveis <b>SOAP</b> i <b>REST</b>.</li>
<li>Comunicació xifrada (TLS mutu), missatges <b>signats</b> i amb <b>segell de temps</b>, i <b>registre</b> de tots els missatges: garanteix integritat, autenticitat i <b>no repudi</b>.</li>
<li>Control d'accés: el proveïdor decideix quins subsistemes poden consumir cada servei.</li>
<li>Federació entre ecosistemes X-Road de països diferents (p. ex. Estònia i Finlàndia).</li>
<li>Materialitza el principi de "una sola vegada" (la ciutadania no ha d'aportar dades que l'administració ja té), com fa la plataforma Via Oberta de l'AOC a Catalunya.</li>
</ul>`,

"elastic":{url:"https://www.elastic.co/guide/",prompt:'<span class="ps">GET</span> /publicacions/_search',
summary:`
<h3>Elasticsearch</h3>
<p>Motor de <b>cerca i analítica</b> distribuït, basat en <b>Apache Lucene</b>, de l'empresa Elastic. Desa <b>documents JSON</b> i ofereix una <b>API REST</b>. És quasi en temps real (els documents es poden cercar al cap d'aproximadament un segon, després del <i>refresh</i>). Forma part de l'<b>Elastic Stack</b> (abans ELK): Elasticsearch, <b>Logstash</b> (ingesta), <b>Kibana</b> (visualització) i Beats. OpenSearch és una bifurcació d'AWS.</p>
<h3>Conceptes</h3>
<ul>
<li><b>Índex</b>: col·lecció de documents (similar a una taula). <b>Document</b>: objecte JSON amb un <code>_id</code>. <b>Mapping</b>: definició dels camps i tipus (<code>text</code> per a cerca de text complet, <code>keyword</code> per a valors exactes, filtres i agregacions, <code>date</code>, <code>integer</code>…).</li>
<li><b>Índex invertit</b>: per a cada terme, la llista de documents on apareix. És el que fa ràpida la cerca de text.</li>
<li><b>Analitzadors</b>: tokenitzador i filtres (minúscules, paraules buides, arrels) aplicats en indexar i en cercar. N'hi ha per idioma (p. ex. <code>catalan</code>, <code>spanish</code>).</li>
<li>Distribució: <b>clúster</b> de <b>nodes</b>; cada índex es divideix en <b>shards</b> primaris i <b>rèpliques</b> (alta disponibilitat i més capacitat de lectura).</li>
<li>La <b>puntuació de rellevància</b> (<code>_score</code>) es calcula per defecte amb BM25.</li>
</ul>
<h3>API i Query DSL</h3>
<ul>
<li>Indexar: <code>PUT /index/_doc/1</code> o <code>POST /index/_doc</code>. Llegir: <code>GET /index/_doc/1</code>. Cercar: <code>GET /index/_search</code>. Operacions massives amb <code>_bulk</code>.</li>
<li>Consultes: <code>match</code> (text complet, analitzat), <code>term</code> (valor exacte), <code>range</code>, <code>multi_match</code>, i <b><code>bool</code></b> per combinar: <code>must</code> (ha de complir i puntua), <code>should</code> (opcional, suma puntuació), <code>filter</code> (ha de complir, no puntua i es desa a la memòria cau) i <code>must_not</code>.</li>
<li><b>Agregacions</b>: <code>terms</code> (recompte per valor), <code>date_histogram</code>, <code>avg</code>, <code>sum</code>… per a estadístiques i facetes.</li>
<li>Altres: ressaltat (<code>highlight</code>), paginació (<code>from</code>/<code>size</code>, <code>search_after</code>), suggeriments, àlies d'índex per reindexar sense aturar el servei.</li>
</ul>`,

"jasper":{url:"https://community.jaspersoft.com",prompt:'<span class="ps">$F{</span>titol}',
summary:`
<h3>JasperReports</h3>
<p>Biblioteca Java de codi obert per generar <b>informes</b> (PDF, Excel, Word, HTML, CSV) a partir de dades. Els informes es dissenyen amb <b>Jaspersoft Studio</b> (basat en Eclipse) com a plantilles <b>JRXML</b> (XML), que es compilen a fitxers <code>.jasper</code>. <b>JasperReports Server</b> permet publicar-los i programar-los.</p>
<h3>Estructura d'un informe</h3>
<ul>
<li><b>Bandes</b>: <code>Title</code> (una vegada a l'inici), <code>Page Header</code>, <code>Column Header</code>, <b><code>Detail</code></b> (una vegada per cada registre), <code>Column Footer</code>, <code>Page Footer</code>, <code>Summary</code> (una vegada al final), <code>No Data</code>, i capçaleres i peus de <b>grup</b>.</li>
<li>Expressions: <b>camps</b> <code>$F{nom}</code> (dades de cada registre), <b>paràmetres</b> <code>$P{nom}</code> (valors que es passen en executar, p. ex. un curs) i <b>variables</b> <code>$V{nom}</code> (càlculs: sumes, recomptes, <code>PAGE_NUMBER</code>).</li>
<li>Elements: camps de text, text estàtic, imatges, taules, gràfics, codis de barres, <b>subinformes</b>.</li>
<li>Fonts de dades: consulta SQL dins la plantilla (connexió JDBC), <code>JRBeanCollectionDataSource</code> (llista d'objectes Java), XML, CSV.</li>
</ul>
<h3>Ús des de Java</h3>
<pre>JasperReport informe = JasperCompileManager.compileReport("actes.jrxml");
Map&lt;String, Object&gt; params = Map.of("CURS", "2025-26");
JasperPrint impr = JasperFillManager.fillReport(informe, params, connexio);
JasperExportManager.exportReportToPdfFile(impr, "actes.pdf");</pre>
<p>Passos: compilar (o carregar el <code>.jasper</code> ja compilat), <b>omplir</b> (fill) amb paràmetres i dades, i <b>exportar</b>.</p>`,

<h3>GitHub Copilot</h3>
<p>Assistent de programació amb intel·ligència artificial de GitHub (Microsoft). S'integra als IDE: VS Code, Visual Studio, IDE de JetBrains, Eclipse, Xcode i altres, i també a GitHub.com i a la línia d'ordres.</p>
<h3>Funcionalitats</h3>
<ul>
<li><b>Suggeriments de codi</b> en línia mentre s'escriu (s'accepten amb Tab), inclosos els suggeriments de la següent edició.</li>
<li><b>Copilot Chat</b>: preguntes en llenguatge natural sobre el codi, explicació, generació de proves, correcció d'errors. Ordres com <code>/explain</code>, <code>/fix</code>, <code>/tests</code> i referències al context (fitxers, selecció, espai de treball).</li>
<li><b>Mode agent</b> i agent de codificació: fa canvis en diversos fitxers, executa ordres i pot obrir pull requests.</li>
<li><b>Revisió de codi</b> en pull requests i generació de descripcions.</li>
<li>Instruccions personalitzades del repositori (<code>.github/copilot-instructions.md</code>) i elecció entre diversos models d'IA.</li>
</ul>
<h3>Plans, privacitat i ús responsable</h3>
<ul>
<li>Plans: Free, Pro i Pro+ (individuals), Business i Enterprise (organitzacions, amb gestió de polítiques i llicències).</li>
<li>Als plans d'empresa, l'organització pot definir polítiques, <b>excloure contingut</b> (fitxers o repositoris que Copilot no ha de fer servir) i activar el filtre de suggeriments que coincideixen amb <b>codi públic</b>.</li>
<li>Responsabilitat: el codi suggerit pot contenir errors, vulnerabilitats o problemes de llicència. Sempre cal <b>revisar-lo, provar-lo</b> i no incloure-hi secrets ni dades personals.</li>
</ul>`,

<h3>Ordenació dels ensenyaments</h3>
<ul>
<li>Norma de referència: <b>RD 822/2021</b>, d'organització dels ensenyaments universitaris i del procediment d'assegurament de la qualitat. Organitza els estudis en tres cicles: <b>grau</b>, <b>màster</b> i <b>doctorat</b>.</li>
<li><b>Crèdit ECTS</b> (Sistema Europeu de Transferència de Crèdits): entre <b>25 i 30 hores</b> de treball de l'estudiant. Un curs acadèmic a temps complet són <b>60 ECTS</b>.</li>
<li><b>Grau</b>: amb caràcter general <b>240 ECTS</b> (quatre cursos); alguns en tenen més (p. ex. Medicina, 360). Inclou formació bàsica, obligatòria, optativa, pràctiques externes i <b>Treball de Fi de Grau</b> (TFG). Hi ha mencions i dobles titulacions.</li>
<li><b>Màster universitari</b>: entre <b>60 i 120 ECTS</b>, amb <b>Treball de Fi de Màster</b> (TFM). Alguns habiliten per a professions regulades.</li>
<li><b>Doctorat</b>: regulat pel <b>RD 99/2011</b>. Es fa a les <b>escoles de doctorat</b>; durada de fins a tres anys a temps complet (cinc a temps parcial, amb pròrrogues possibles); acaba amb la defensa d'una <b>tesi doctoral</b>; es pot obtenir la menció internacional i el doctorat industrial.</li>

summary:`
<h3>Matrícula</h3>
<ul>
<li>És l'acte pel qual l'estudiant formalitza la inscripció a les assignatures (o a la tutela de tesi, al doctorat) d'un curs i adquireix la condició d'estudiant de la universitat. Es fa cada curs dins els terminis del calendari acadèmic.</li>
<li><b>Automatrícula</b>: l'estudiant es matricula per internet des de l'aplicació de la universitat, en una franja horària assignada (cita), triant assignatures i grups segons el pla d'estudis, les places i les incompatibilitats. Al final obté el resguard i el document de pagament.</li>
<li>Règim de <b>dedicació</b>: temps complet o temps parcial, amb un mínim i un màxim de crèdits per curs.</li>
<li><b>Normativa de permanència</b>: requisits per continuar els estudis (crèdits mínims a superar el primer curs, nombre màxim de convocatòries o matrícules per assignatura). La regula cada universitat, amb informe del Consell Social.</li>
<li>Modificacions i anul·lacions de matrícula dins de terminis; anul·lació d'ofici per impagament.</li>
<li>Reconeixement i transferència de crèdits: el <b>reconeixement</b> fa que crèdits d'altres estudis (universitaris, de FP de grau superior o d'experiència professional) computin al nou títol; la <b>transferència</b> fa constar a l'expedient els crèdits d'estudis no acabats que no es reconeixen.</li>
</ul>
<h3>Gestió econòmica de la matrícula</h3>
<ul>
<li>A les universitats públiques catalanes, els <b>preus públics</b> per crèdit els fixa cada curs un <b>decret de la Generalitat</b>. El preu depèn de l'ensenyament (grau o màster) i de si és la primera matrícula o una repetició (segona, tercera… amb preus més alts).</li>
<li>A més dels crèdits hi ha <b>taxes</b> (gestió de l'expedient, suport a l'aprenentatge, assegurança escolar per als menors de 28 anys) i serveis voluntaris.</li>
<li><b>Exempcions i bonificacions</b>: família nombrosa o monoparental (general o especial), discapacitat igual o superior al 33 %, víctimes de violència de gènere i de terrorisme, matrícula d'honor a batxillerat o a assignatures, entre d'altres.</li>
<li><b>Beques</b>: beca general del Ministeri d'Educació (de caràcter general) i, a Catalunya, les <b>beques Equitat</b> de l'AGAUR (reducció del preu segons la renda). Si l'estudiant és sol·licitant de beca, pot matricular-se sense pagar els crèdits fins a la resolució.</li>
<li>Formes de pagament: pagament únic o fraccionat (terminis), domiciliació bancària, targeta o document de pagament. L'impagament pot comportar l'anul·lació de la matrícula i el bloqueig de l'expedient.</li>
</ul>`,

"expedient":{url:"https://www.ub.edu/portal/web/estudis",prompt:'<span class="ps">$</span> acta --tancar --signar',
summary:`
<h3>Expedient acadèmic, actes i qualificacions</h3>
<ul>
<li>L'<b>expedient</b> recull tota la trajectòria de l'estudiant: matrícules, qualificacions, reconeixements, beques, mobilitat i títols.</li>
<li>Escala de qualificacions (<b>RD 1125/2003</b>): de 0 a 10 amb un decimal. <b>Suspens</b> (0-4,9), <b>Aprovat</b> (5,0-6,9), <b>Notable</b> (7,0-8,9) i <b>Excel·lent</b> (9,0-10). La <b>matrícula d'honor</b> es pot atorgar amb nota igual o superior a 9,0 i a un màxim del <b>5 %</b> dels matriculats (una si en són menys de 20).</li>
<li>La <b>nota mitjana</b> de l'expedient es calcula ponderant cada nota pels crèdits de l'assignatura.</li>
<li><b>Actes</b>: document oficial on el professorat responsable fa constar les qualificacions de cada convocatòria. Es tanquen i se <b>signen electrònicament</b>; un cop tancades, qualsevol modificació requereix una diligència o un procediment de revisió.</li>
<li>Avaluació continuada o única, convocatòries, revisió de qualificacions i reclamacions segons la normativa d'avaluació de la universitat.</li>
<li><b>Certificats</b> acadèmics (personals o oficials, sovint electrònics amb CSV) i el <b>Suplement Europeu al Títol</b> (SET), que descriu els estudis i facilita el reconeixement internacional.</li>
</ul>
<h3>Títols</h3>
<ul>
<li>Un cop superats tots els crèdits, l'estudiant sol·licita el títol i paga la taxa d'expedició. Els títols oficials els expedeix el <b>rector o rectora en nom del Rei</b>.</li>
<li>Es registren al <b>Registre Nacional de Titulats</b> i tenen un número de registre. Mentre s'expedeix el títol físic, es lliura un resguard que en té els mateixos efectes. Cada cop més, el títol també s'emet en format electrònic.</li>
<li>Títols propis de la universitat (formació permanent), duplicats per pèrdua o canvi de dades (p. ex. canvi de nom), i <b>homologació</b> i equivalència de títols estrangers (Ministeri).</li>
</ul>
<h3>Mobilitat internacional</h3>
<ul>
<li>Programes: <b>Erasmus+</b> (Unió Europea, estudis i pràctiques), <b>SICUE</b> (entre universitats espanyoles), convenis bilaterals amb universitats d'altres països.</li>
<li>Abans de marxar se signa l'<b>acord d'aprenentatge</b> (<i>learning agreement</i>), que fixa les assignatures que es cursaran a la destinació i la seva equivalència; en tornar, la universitat <b>reconeix</b> els crèdits a partir del certificat de notes de destinació (<i>transcript of records</i>), amb una taula d'equivalència de qualificacions.</li>
<li>L'estudiantat de mobilitat es matricula a la universitat d'origen; l'estudiantat entrant (<i>incoming</i>) també es registra a la universitat d'acollida.</li>
</ul>`,

"llei39":{url:"https://www.boe.es/buscar/act.php?id=BOE-A-2015-10565",prompt:'<span class="ps">BOE</span> Llei 39/2015',
summary:`
<h3>Objecte i interessats</h3>
<p>La <b>Llei 39/2015, d'1 d'octubre, del procediment administratiu comú de les administracions públiques</b> regula els requisits de validesa i eficàcia dels actes administratius, el procediment comú i els principis de la potestat reglamentària. S'aplica també a les universitats públiques. Es complementa amb la Llei 40/2015 (règim jurídic del sector públic).</p>
<ul>
<li><b>Interessats</b> (art. 4): qui promou el procediment, qui té drets que poden resultar afectats, i qui té interessos legítims i s'hi persona abans de la resolució.</li>
<li><b>Representació</b> (art. 5) i <b>registre electrònic d'apoderaments</b> (art. 6).</li>
<li><b>Dret i obligació de relacionar-se electrònicament</b> (art. 14): les persones físiques poden triar; hi estan obligades les persones jurídiques, els professionals col·legiats i els empleats públics en els tràmits de la seva condició, entre d'altres.</li>
<li>Identificació i signatura (art. 9-12); <b>registres</b> (art. 16), amb oficines d'assistència en matèria de registres; <b>dret a no aportar documents</b> que ja té l'administració (art. 28).</li>
</ul>
<h3>Terminis (art. 29-33)</h3>
<ul>
<li>Els terminis en <b>dies</b> són <b>hàbils</b> llevat que es digui el contrari: s'exclouen els <b>dissabtes, diumenges i festius</b>. Si són <b>naturals</b>, s'ha d'indicar expressament.</li>
<li>Els terminis en <b>mesos o anys</b> es computen <b>de data a data</b>; si no hi ha dia equivalent, acaben l'últim dia del mes. Si l'últim dia és inhàbil, es prorroga al primer dia hàbil següent.</li>
<li>Es comencen a comptar <b>l'endemà</b> de la notificació o publicació.</li>
<li>Es pot acordar l'<b>ampliació</b> (fins a la meitat del termini) i la <b>tramitació d'urgència</b> (terminis a la meitat).</li>
</ul>
<h3>Actes administratius (art. 34-52)</h3>
<ul>
<li>Els actes es presumeixen <b>vàlids</b> i produeixen efectes des que es dicten, llevat que es disposi altrament. Han de ser motivats en els casos de l'art. 35.</li>
<li><b>Notificació</b> (art. 40-46): en deu dies des que es dicta l'acte; preferentment electrònica. La notificació electrònica s'entén <b>rebutjada</b> si passen <b>10 dies naturals</b> sense accedir-hi.</li>
<li><b>Nul·litat de ple dret</b> (art. 47): lesió de drets fonamentals, òrgan manifestament incompetent, contingut impossible, constitutiu d'infracció penal, prescindir totalment del procediment, entre d'altres. <b>Anul·labilitat</b> (art. 48): qualsevol altra infracció de l'ordenament.</li>
</ul>
<h3>Procediment (art. 53-105)</h3>
<ul>
<li>Fases: <b>iniciació</b> (d'ofici o a sol·licitud de l'interessat), <b>ordenació</b>, <b>instrucció</b> (al·legacions, prova, informes, <b>tràmit d'audiència</b> de 10 a 15 dies) i <b>finalització</b> (resolució, desistiment, renúncia, caducitat, acord).</li>
<li><b>Esmena</b> de la sol·licitud (art. 68): 10 dies; si no s'esmena, es té per desistit.</li>
<li><b>Obligació de resoldre</b> (art. 21): termini màxim el de la norma reguladora, sense superar sis mesos llevat de llei; si no se n'indica cap, <b>tres mesos</b>.</li>
<li><b>Silenci administratiu</b> (art. 24-25): en procediments a sol·licitud, per regla general <b>positiu</b> (estimatori), amb excepcions (dret de petició, domini públic, responsabilitat patrimonial, impugnació d'actes…), en què és negatiu. En procediments d'ofici, els favorables decauen per silenci negatiu i els sancionadors o desfavorables <b>caduquen</b>.</li>
</ul>
<h3>Recursos (art. 112-126)</h3>
<div class="tbl"><table>
<tr><th>Recurs</th><th>Contra</th><th>Termini (acte exprés)</th></tr>
<tr><td><b>Alçada</b></td><td>Actes que <b>no</b> posen fi a la via administrativa (davant el superior jeràrquic)</td><td>1 mes; resolució en 3 mesos</td></tr>

<tr><td><b>Extraordinari de revisió</b></td><td>Actes ferms, per motius taxats (error de fet, documents nous…)</td><td>4 anys o 3 mesos segons el motiu</td></tr>
</table></div>
<p>A les universitats, les resolucions del rector o rectora i els acords del Consell Social, del Consell de Govern i del Claustre <b>posen fi a la via administrativa</b> (LOSU art. 38.4): s'hi pot interposar recurs potestatiu de reposició o anar directament al contenciós administratiu (2 mesos).</p>`,

    ${PL.map(x=>`<option value="${x.c}" ${pl===x.c?"selected":""}>${x.c} · ${x.n}</option>`).join("")}</select></label>`;
  document.getElementById("nav").innerHTML=sel+
   `<button class="res-btn sim-btn ${current==="__home"?"active":""}" onclick="openHome()"><span>Visió general</span><span class="pill">7 places</span></button>`+
   `<button class="res-btn sim-btn ${current==="__sim"?"active":""}" onclick="openSim()"><span>Simulacre d'examen</span><span class="pill">test + obertes</span></button>`+
   DATA.map(b=>{const its=b.items.filter(inPlaza); if(!its.length) return "";
    return `<div class="block"><div class="block-title">${b.block}</div>
     ${its.map(r=>`<button class="res-btn ${current===r.id?"active":""}" ${r.summary?"":"disabled"} onclick="openRes('${r.id}')"><span>${r.title}</span>${pill(r)}</button>`).join("")}
     </div>`}).join("");
}
function openHome(){current="__home";renderNav();render();toggleSide(false);window.scrollTo(0,0)}
function toggleSide(v){document.getElementById("side").classList.toggle("open",v)}
function openRes(id){current=id;tab="resum";onlyWrong=false;st._last=id;save();renderNav();render();toggleSide(false);window.scrollTo(0,0)}
function setTab(t){tab=t;onlyWrong=false;render()}

/* ============ VISTES ============ */
function render(){
  if(current==="__sim"){renderSim();return}
  if(current==="__home"){renderHome();return}
  const r=find(current); const m=document.getElementById("main");
  document.getElementById("topTitle").textContent=r?r.title:"";
  if(!r){m.innerHTML='<p class="empty">Tria un recurs del temari per començar.</p>';return}
  const s=rs(r.id);
  const host=r.url.replace(/^https?:\/\//,"").replace(/\/$/,"");
  let h=`<div class="prompt"><div class="line">${r.prompt}<span class="cursor" aria-hidden="true"></span></div>
   <div class="meta">${r.title} · ${(r.p||[]).length===7?"totes les places":"places "+(r.p||[]).join(", ")} · <a href="${r.url}" target="_blank" rel="noopener">${host}</a></div></div>
   <div class="tabs" role="tablist">
    <button class="tab ${tab==="resum"?"active":""}" onclick="setTab('resum')">Resum</button>
    <button class="tab ${tab==="test"?"active":""}" onclick="setTab('test')">Test<span class="count">${r.test.length}</span></button>
    <button class="tab ${tab==="prac"?"active":""}" onclick="setTab('prac')">Pràctica<span class="count">${r.practice.length}</span></button>
   </div>`;
  if(tab==="resum"){
    h+=`<div class="summary">${r.summary}</div>
    <div class="read-row"><label><input type="checkbox" ${s.read?"checked":""} onchange="markRead(this.checked)"> Resum llegit</label></div>`;
  } else if(tab==="test"){
    h+=renderTest(r,s);
  } else {
    h+=r.practice.map((p,i)=>`<div class="ex"><h4>Exercici ${i+1}: ${p.t}</h4><p>${p.d}</p>
     <div class="row"><button class="btn ghost" onclick="toggleSol(${i},this)">Mostra la solució</button>
     <label><input type="checkbox" ${s.done[i]?"checked":""} onchange="markDone(${i},this.checked)"> Fet</label></div>
     <div class="sol" id="sol${i}" hidden>${p.s}</div></div>`).join("");
  }
  m.innerHTML=h;
}
function renderTest(r,s){
  const n=r.test.length;
  const answered=Object.keys(s.ans).length;
  const ok=Object.entries(s.ans).filter(([i,v])=>v===r.test[i].a).length;
  const wrongIdx=Object.entries(s.ans).filter(([i,v])=>v!==r.test[i].a).map(([i])=>+i);
  let h=`<div class="score"><div class="grow"><b>${ok}/${n}</b> encerts · ${answered} respostes${s.best!==null?` · millor: ${s.best}/${n}`:""}</div>
   ${wrongIdx.length&&!onlyWrong?`<button class="btn ghost" onclick="reviewWrong()">Repassa les fallades (${wrongIdx.length})</button>`:""}
   ${onlyWrong?`<button class="btn ghost" onclick="onlyWrong=false;render()">Mostra-les totes</button>`:""}
   <button class="btn" onclick="resetTest()">Torna a començar</button></div>`;
  const idx=onlyWrong?(st._review||[]):r.test.map((_,i)=>i);
  if(onlyWrong&&!idx.length) h+='<p class="empty">No hi ha preguntes fallades per repassar.</p>';
  idx.forEach(i=>{
    const q=r.test[i]; const sel=s.ans[i]; const done=sel!==undefined;
    h+=`<div class="q"><div class="qn">Pregunta ${i+1} de ${n}</div><div class="qt">${esc(q.q)}</div>
     ${q.o.map((o,j)=>{let c="";if(done){if(j===q.a)c="right";else if(j===sel)c="wrong"}
       return `<button class="opt ${c}" ${done?"disabled":""} onclick="answer(${i},${j})"><span class="l">${"abcd"[j]})</span>${esc(o)}</button>`}).join("")}
     ${done?`<div class="expl ${sel===q.a?"ok":"ko"}"><b>${sel===q.a?"Correcte.":"Incorrecte."}</b> ${esc(q.e)}</div>`:""}</div>`;
  });
  return h;
}
function esc(t){return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function answer(i,j){
  const r=find(current), s=rs(r.id); s.ans[i]=j;
  if(Object.keys(s.ans).length===r.test.length){
    const ok=Object.entries(s.ans).filter(([k,v])=>v===r.test[k].a).length;
    if(s.best===null||ok>s.best) s.best=ok;
  }
  save(); renderNav(); const y=window.scrollY; render(); window.scrollTo(0,y);
}
function resetTest(){const s=rs(current);s.ans={};onlyWrong=false;save();renderNav();render();window.scrollTo(0,0)}
function reviewWrong(){
  const r=find(current), s=rs(current);
  const w=Object.entries(s.ans).filter(([i,v])=>v!==r.test[i].a).map(([i])=>+i);
  w.forEach(i=>delete s.ans[i]); st._review=w; onlyWrong=true; save(); renderNav(); render(); window.scrollTo(0,0);
}
function markRead(v){rs(current).read=v;save();renderNav()}
function markDone(i,v){rs(current).done[i]=v;save()}
function toggleSol(i,b){const el=document.getElementById("sol"+i);el.hidden=!el.hidden;b.textContent=el.hidden?"Mostra la solució":"Amaga la solució"}

current=(st._last&&find(st._last)&&find(st._last).summary)?st._last:"__home";
renderNav(); render();
</script>
<script>
/* ============ SIMULACRE ============ */
let simTick=null;
function blocksWithTests(){return DATA.filter(b=>b.items.some(i=>i.test&&i.test.length&&inPlaza(i)))}
function openSim(){current="__sim";renderNav();render();toggleSide(false);window.scrollTo(0,0)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),r=s%60;return m+":"+String(r).padStart(2,"0")}

function renderSim(){
  document.getElementById("topTitle").textContent="Simulacre d'examen";
  const S=st._sim;
  if(S&&!S.done) return renderSimExam();
  if(S&&S.done) return renderSimResult();
  renderSimConfig();
}

function renderSimConfig(){
  const m=document.getElementById("main");
  const bl=blocksWithTests();
  const hist=(st._simHist||[]).slice(-10).reverse();
  m.innerHTML=`<div class="prompt"><div class="line"><span class="ps">$</span> examen --simulacre<span class="cursor" aria-hidden="true"></span></div>
  <div class="meta">Plaça: <b>${plaza()==="all"?"temari complet":plaza()+" · "+PL.find(x=>x.c===plaza()).n}</b> (canvia-la al menú). Preguntes aleatòries amb temps, penalització i preguntes obertes opcionals.</div></div>
  <div class="cfg">
   <label>Preguntes tipus test<select id="cN"><option>20</option><option selected>40</option><option>60</option><option>100</option></select></label>
   <label>Temps<select id="cT"><option value="30">30 min</option><option value="45">45 min</option><option value="60" selected>60 min</option><option value="90">90 min</option><option value="0">Sense límit</option></select></label>
   <label>Penalització per resposta errònia<select id="cP"><option value="0">No resta</option><option value="0.3333" selected>Resta 1/3</option><option value="0.25">Resta 1/4</option></select></label>
   <label>Preguntes obertes curtes<select id="cO"><option value="0">Cap</option><option value="3" selected>3</option><option value="5">5</option></select></label>
   <label>Blocs inclosos<span class="chips">${bl.map((b,i)=>`<label><input type="checkbox" class="cB" value="${i}" checked> ${b.block}</label>`).join("")}</span></label>
   <div><button class="btn" onclick="startSim()">Comença el simulacre</button></div>
  </div>
  ${hist.length?`<h3>Darrers simulacres</h3><div class="tbl"><table class="hist"><tr><th>Data</th><th>Plaça</th><th>Test</th><th>Nota test (sobre 10)</th><th>Obertes</th></tr>
   ${hist.map(x=>`<tr><td>${x.d}</td><td>${x.pl&&x.pl!=="all"?x.pl:"Totes"}</td><td>${x.ok} encerts, ${x.ko} errors, ${x.bl} en blanc</td><td><b>${x.nota}</b></td><td>${x.op??"-"}</td></tr>`).join("")}</table></div>`:""}`;
}

function startSim(){
  const n=+document.getElementById("cN").value, t=+document.getElementById("cT").value,
        p=+document.getElementById("cP").value, o=+document.getElementById("cO").value;
  const bl=blocksWithTests(); const sel=[...document.querySelectorAll(".cB:checked")].map(x=>+x.value);
  if(!sel.length){alert("Tria almenys un bloc.");return}
  const names=sel.map(i=>bl[i].block);
  const pool=[];
  sel.forEach(i=>bl[i].items.filter(inPlaza).forEach(r=>(r.test||[]).forEach((q,qi)=>pool.push({r:r.id,i:qi,b:bl[i].block}))));
  const qs=shuffle(pool).slice(0,n);
  const opool=(typeof OPEN!=="undefined"?OPEN:[]).map((q,i)=>({i,b:q.b}));
  const os=shuffle(opool.filter(x=>names.some(nm=>nm.toLowerCase().indexOf(x.b.toLowerCase())>=0||x.b.toLowerCase().indexOf(nm.toLowerCase())>=0)).length?opool.filter(x=>names.some(nm=>nm.toLowerCase().indexOf(x.b.toLowerCase())>=0||x.b.toLowerCase().indexOf(nm.toLowerCase())>=0)):opool).slice(0,o);
  st._sim={pl:plaza(),cfg:{n:qs.length,t,p},qs,os:os.map(x=>x.i),ans:{},oa:{},self:{},start:Date.now(),done:false};
  save(); render(); window.scrollTo(0,0);
}

function simQ(x){const r=ALL.find(a=>a.id===x.r);return {r,q:r.test[x.i]}}

function renderSimExam(){
  const S=st._sim, m=document.getElementById("main");
  const answered=Object.keys(S.ans).length;
  let h=`<div class="score timer"><div class="grow"><b id="simClock">${S.cfg.t?fmtTime(S.cfg.t*60-(Date.now()-S.start)/1000):"Sense límit"}</b> · <span id="simCount">${answered}</span>/${S.qs.length} respostes</div>
   <button class="btn ghost" onclick="cancelSim()">Abandona</button><button class="btn" onclick="finishSim()">Lliura l'examen</button></div>`;
  S.qs.forEach((x,k)=>{const {q}=simQ(x); const sel=S.ans[k];
    h+=`<div class="q"><div class="qn">Pregunta ${k+1} · ${esc(x.b)}</div><div class="qt">${esc(q.q)}</div>
     ${q.o.map((o,j)=>`<button class="opt ${sel===j?"sel":""}" onclick="simAns(${k},${j},this)"><span class="l">${"abcd"[j]})</span>${esc(o)}</button>`).join("")}</div>`});
  if(S.os.length){h+=`<h3>Preguntes obertes</h3><p class="empty">Respon breument; en lliurar l'examen veuràs una resposta model per autoavaluar-te.</p>`;
    S.os.forEach((oi,k)=>{const q=OPEN[oi];
      h+=`<div class="q"><div class="qn">Oberta ${k+1} · ${esc(q.b)}</div><div class="qt">${esc(q.q)}</div>
      <textarea oninput="simOpen(${k},this.value)" placeholder="La teva resposta">${esc(S.oa[k]||"")}</textarea></div>`});}
  h+=`<div class="read-row"><button class="btn" onclick="finishSim()">Lliura l'examen</button></div>`;
  m.innerHTML=h;
  clearInterval(simTick);
  if(S.cfg.t){simTick=setInterval(()=>{const left=S.cfg.t*60-(Date.now()-S.start)/1000;const el=document.getElementById("simClock");
    if(!el||current!=="__sim"){clearInterval(simTick);return}
    el.textContent=fmtTime(left); if(left<=0){clearInterval(simTick);finishSim(true)}},1000)}
}
function simAns(k,j,btn){const S=st._sim; if(S.ans[k]===j) delete S.ans[k]; else S.ans[k]=j; save();
  btn.parentNode.querySelectorAll(".opt").forEach((b,i)=>b.classList.toggle("sel",S.ans[k]===i));
  const c=document.getElementById("simCount"); if(c) c.textContent=Object.keys(S.ans).length;}
function simOpen(k,v){st._sim.oa[k]=v;save()}
function cancelSim(){if(!confirm("Vols abandonar el simulacre? Es perdran les respostes."))return;clearInterval(simTick);delete st._sim;save();render()}

function finishSim(auto){
  const S=st._sim; if(!S||S.done) return;
  if(!auto){const blank=S.qs.length-Object.keys(S.ans).length;
    if(!confirm(blank?`Tens ${blank} preguntes en blanc. Vols lliurar igualment?`:"Vols lliurar l'examen?"))return}
  clearInterval(simTick);
  let ok=0,ko=0; const per={};
  S.qs.forEach((x,k)=>{const {q}=simQ(x); per[x.b]=per[x.b]||{ok:0,ko:0,bl:0,n:0}; per[x.b].n++;
    if(S.ans[k]===undefined) per[x.b].bl++; else if(S.ans[k]===q.a){ok++;per[x.b].ok++} else {ko++;per[x.b].ko++}});
  const bl=S.qs.length-ok-ko, net=Math.max(0,ok-ko*S.cfg.p);
  S.res={ok,ko,bl,net,nota:+(net/S.qs.length*10).toFixed(2),per,secs:Math.round((Date.now()-S.start)/1000),auto:!!auto};
  S.done=true; save(); render(); window.scrollTo(0,0);
}
function simSelf(k,v){const S=st._sim;S.self[k]=v;save();render()}
function closeSim(){const S=st._sim;
  const d=new Date(S.start); const op=S.os.length?`${Object.values(S.self).reduce((a,b)=>a+b,0)}/${S.os.length}`:null;
  st._simHist=(st._simHist||[]).concat([{pl:S.pl||"all",d:d.toLocaleDateString("ca-ES")+" "+d.toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"}),ok:S.res.ok,ko:S.res.ko,bl:S.res.bl,nota:S.res.nota,op}]).slice(-30);
  delete st._sim; save(); render(); window.scrollTo(0,0);}

function renderSimResult(){
  const S=st._sim,R=S.res,m=document.getElementById("main");
  const pen=S.cfg.p?` − ${R.ko} × ${S.cfg.p===0.25?"1/4":"1/3"}`:"";
  let h=`<div class="score"><div class="grow"><b>Nota del test: ${R.nota} / 10</b><br>${R.ok} encerts${pen} · ${R.ko} errors · ${R.bl} en blanc · ${fmtTime(R.secs)} min${R.auto?" · lliurat automàticament per temps":""}</div>
   <button class="btn" onclick="closeSim()">Desa i tanca</button></div>
   <h3>Resultat per blocs</h3><div class="tbl"><table><tr><th>Bloc</th><th>Encerts</th><th>Errors</th><th>En blanc</th><th>% encert</th></tr>
   ${Object.entries(R.per).sort((a,b)=>a[1].ok/a[1].n-b[1].ok/b[1].n).map(([b,v])=>`<tr><td>${esc(b)}</td><td>${v.ok}</td><td>${v.ko}</td><td>${v.bl}</td><td>${Math.round(v.ok/v.n*100)} %</td></tr>`).join("")}</table></div>
   <p class="empty">Els blocs apareixen ordenats del més fluix al més fort.</p>`;
  if(S.os.length){h+=`<h3>Preguntes obertes: autoavaluació</h3>`;
    S.os.forEach((oi,k)=>{const q=OPEN[oi],v=S.self[k];
      h+=`<div class="q"><div class="qn">Oberta ${k+1} · ${esc(q.b)}</div><div class="qt">${esc(q.q)}</div>
       <div class="expl"><b>La teva resposta:</b><br>${esc(S.oa[k]||"(en blanc)").replace(/\n/g,"<br>")}</div>
       <div class="model"><b>Resposta model:</b> ${esc(q.a)}</div>
       <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        ${[[0,"Incorrecta"],[0.5,"Parcial"],[1,"Completa"]].map(([val,l])=>`<button class="btn ${v===val?"":"ghost"}" onclick="simSelf(${k},${val})">${l}</button>`).join("")}</div></div>`});}
  h+=`<h3>Revisió del test</h3>`;
  S.qs.forEach((x,k)=>{const {q}=simQ(x),sel=S.ans[k];
    h+=`<div class="q"><div class="qn">Pregunta ${k+1} · ${esc(x.b)} · ${sel===undefined?"en blanc":sel===q.a?"correcta":"incorrecta"}</div><div class="qt">${esc(q.q)}</div>
     ${q.o.map((o,j)=>`<button class="opt ${j===q.a?"right":j===sel?"wrong":""}" disabled><span class="l">${"abcd"[j]})</span>${esc(o)}</button>`).join("")}
     ${q.e?`<div class="expl ${sel===q.a?"ok":"ko"}">${esc(q.e)}</div>`:""}</div>`});
  h+=`<div class="read-row"><button class="btn" onclick="closeSim()">Desa i tanca</button></div>`;
  m.innerHTML=h;
}

/* ============ VISIÓ GENERAL ============ */
function statsFor(code){
  const rs_=ALL.filter(r=>r.summary&&(code==="all"||(r.p||[]).includes(code)));
  let read=0,q=0,ok=0;
  rs_.forEach(r=>{const s=st[r.id]; if(s&&s.read) read++; q+=r.test.length;
    if(s) ok+=Object.entries(s.ans||{}).filter(([i,v])=>r.test[i]&&v===r.test[i].a).length;});
  const sims=(st._simHist||[]).filter(x=>(x.pl||"all")===code);
  return {n:rs_.length,read,q,ok,last:sims.length?sims[sims.length-1].nota:null};
}
function pct(a,b){return b?Math.round(a/b*100):0}
function renderHome(){
  document.getElementById("topTitle").textContent="Visió general";
  const m=document.getElementById("main"); const pl=plaza();
  let h=`<div class="prompt"><div class="line"><span class="ps">$</span> oposicio --places 7<span class="cursor" aria-hidden="true"></span></div>
   <div class="meta">Un sol temari per a les set places de Programador/a de l'Àrea TIC. Tria una plaça al menú per veure només el seu temari, o fes servir "Totes".</div></div>`;
  h+=`<h3>Progrés per plaça</h3><div class="tbl"><table><tr><th>Plaça</th><th>Recursos</th><th>Llegits</th><th>Encerts test</th><th>Darrer simulacre</th></tr>`;
  [{c:"all",n:"Temari complet"}].concat(PL).forEach(x=>{const s=statsFor(x.c);
    h+=`<tr><td><a href="#" onclick="setPlaza('${x.c}');return false;">${x.c==="all"?"Totes":x.c}</a><br><span class="empty">${x.n}</span></td>
     <td>${s.n}</td><td>${pct(s.read,s.n)} %<div class="bar"><span style="width:${pct(s.read,s.n)}%"></span></div></td>
     <td>${pct(s.ok,s.q)} %<div class="bar"><span style="width:${pct(s.ok,s.q)}%"></span></div><span class="empty">${s.ok}/${s.q}</span></td>
     <td>${s.last??"-"}</td></tr>`});
  h+=`</table></div><p class="empty">"Encerts test" compta les preguntes del mode Test de cada recurs respostes correctament.</p>`;

  const sel=PL.find(x=>x.c===pl);
  if(sel){
    const its=DATA.map(b=>({b:b.block,its:b.items.filter(i=>(i.p||[]).includes(sel.c))})).filter(x=>x.its.length);
    h+=`<h3>Fitxa de la plaça ${sel.c} · ${sel.n}</h3>
     <div class="card"><h4>Funcions específiques</h4><p>${sel.f}</p><h4>Aplicacions i tecnologies citades</h4><p>${sel.apps}</p>
     <p class="empty">Prova: un o més exercicis entre preguntes tipus test, curtes o obertes; cas pràctic (escrit o amb ordinador); i exercici pràctic relacionat amb les funcions.</p></div>
     ${its.map(x=>`<div class="card"><h4>${x.b}</h4>${x.its.map(i=>`<a href="#" onclick="openRes('${i.id}');return false;">${i.title}</a>`).join(" · ")}</div>`).join("")}`;
  }

  h+=`<h3>Matriu de blocs per plaça</h3><p class="empty">Nombre de recursos de cada bloc que entren a cada plaça.</p>
   <div class="tbl"><table><tr><th>Bloc</th>${PL.map(x=>`<th>${x.c}</th>`).join("")}</tr>
   ${DATA.map(b=>`<tr><td>${b.block}</td>${PL.map(x=>{const n=b.items.filter(i=>(i.p||[]).includes(x.c)).length;return `<td>${n||""}</td>`}).join("")}</tr>`).join("")}
   </table></div>`;

  h+=`<h3>Còpia de seguretat del progrés</h3>
   <div class="card"><p>El progrés es desa només en aquest navegador. Per passar-lo a un altre dispositiu, copia aquest text i enganxa'l a l'altre en el quadre d'importació.</p>
   <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
    <button class="btn" onclick="exportProg()">Genera la còpia</button></div>
   <textarea id="expTxt" readonly placeholder="Prem Genera la còpia i copia el text"></textarea>
   <p style="margin-top:14px">Importa una còpia (substitueix el progrés actual):</p>
   <textarea id="impTxt" placeholder="Enganxa aquí el text de la còpia"></textarea>
   <div style="margin-top:8px"><button class="btn ghost" onclick="importProg()">Importa</button> <span id="impMsg" class="empty"></span></div></div>`;
  m.innerHTML=h;
}
function exportProg(){const t=document.getElementById("expTxt");t.value=JSON.stringify(st);t.focus();t.select();
  try{navigator.clipboard&&navigator.clipboard.writeText(t.value)}catch(e){}}
function importProg(){const v=document.getElementById("impTxt").value.trim(),msg=document.getElementById("impMsg");
  try{const o=JSON.parse(v); if(typeof o!=="object"||!o) throw 0;
    if(!confirm("Això substituirà el progrés actual. Continuar?")) return;
    st=o; save(); renderNav(); render(); }
  catch(e){msg.textContent="El text no és una còpia vàlida."}}

</script>
</body>
</html>
