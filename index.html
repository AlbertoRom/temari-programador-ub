<h3>Classes i objectes a Java</h3>
<ul>
<li><b>Classe</b>: atributs (estat) i mètodes (comportament). <b>Objecte</b>: instància creada amb <code>new</code>, que viu al heap; la variable guarda una <b>referència</b>.</li>

<li>Només <b>herència simple</b> de classes, però implementació de <b>diverses interfícies</b>.</li>

<li><b>Interfície</b>: contracte. Mètodes abstractes, <code>default</code> i <code>static</code> (Java 8), <code>private</code> (Java 9) i constants. Interfícies funcionals (un sol mètode abstracte) per a lambdes.</li>

<li><b>Lligam dinàmic</b>: el mètode que s'executa depèn del tipus real de l'objecte, no del tipus de la referència. Conversions: <i>upcasting</i> implícit i <i>downcasting</i> explícit (amb <code>instanceof</code>, ara amb <i>pattern matching</i>).</li>

<li>Principis complementaris: alta cohesió i baix acoblament, DRY, KISS, llei de Demèter.</li>

<h3>POO a JavaScript: prototips</h3>
<ul>
<li>JavaScript és orientat a objectes basat en <b>prototips</b>: cada objecte té un enllaç intern a un altre objecte (<code>[[Prototype]]</code>), d'on hereta propietats. Si una propietat no és a l'objecte, es busca a la <b>cadena de prototips</b>.</li>
<li>Formes de crear objectes: literals <code>{}</code>, funcions constructores amb <code>new</code>, <code>Object.create(proto)</code> i <b>classes</b>.</li>
<li>Les <b>classes</b> (ES2015) són sintaxi sobre prototips: <code>class</code>, <code>constructor</code>, <code>extends</code>, <code>super</code>, mètodes <code>static</code>, <i>getters</i> i <i>setters</i>.</li>
<li>Encapsulament real amb <b>camps privats</b> <code>#saldo</code> (ES2022); abans es feia amb convencions (<code>_saldo</code>) o closures.</li>
<li><code>this</code> depèn de com es crida el mètode: si es passa un mètode com a callback, es perd. Solucions: funcions fletxa o <code>bind</code>.</li>
<li>Polimorfisme per <b>duck typing</b>: si un objecte té el mètode, es pot fer servir, sense importar-ne la classe.</li>
<li>Herència simple, però es poden fer <b>mixins</b> (funcions que retornen classes) per combinar comportaments.</li>
</ul>
<h3>TypeScript</h3>
<p>Superconjunt de JavaScript creat per Microsoft que afegeix <b>tipatge estàtic opcional</b>. Es compila (transpila) a JavaScript amb <code>tsc</code>; la configuració és a <code>tsconfig.json</code> (recomanable <code>"strict": true</code>). Els tipus desapareixen en temps d'execució (<i>type erasure</i>).</p>
<ul>
<li>Tipus: <code>string</code>, <code>number</code>, <code>boolean</code>, arrays, tuples, <code>enum</code>, <code>any</code> (desactiva la comprovació), <code>unknown</code> (cal comprovar-lo abans d'usar-lo), <code>void</code>, <code>never</code>, unions <code>A | B</code>, interseccions <code>A &amp; B</code>, literals.</li>
<li><b>Interfícies</b> i àlies <code>type</code>: descriuen la forma dels objectes. El sistema de tipus és <b>estructural</b>: dos tipus amb la mateixa forma són compatibles, encara que tinguin noms diferents.</li>
<li>Classes amb <b>modificadors d'accés</b> <code>public</code>, <code>private</code>, <code>protected</code> (només en compilació) i <code>readonly</code>; <b>propietats de paràmetre</b> al constructor (<code>constructor(private nom: string)</code>).</li>
<li><code>abstract class</code> i mètodes abstractes; <code>implements</code> d'una o diverses interfícies; <code>override</code>.</li>
<li><b>Genèrics</b> (<code>class Repositori&lt;T extends {id: number}&gt;</code>), tipus utilitaris (<code>Partial</code>, <code>Readonly</code>, <code>Pick</code>, <code>Omit</code>, <code>Record</code>), <i>type guards</i> (<code>typeof</code>, <code>instanceof</code>, <code>in</code>) i unions discriminades.</li>
<li><b>Decoradors</b>: funcions que anoten classes, mètodes o propietats; la base de frameworks com Angular.</li>
<li>Mòduls ES (<code>import</code> / <code>export</code>).</li>
</ul>`,

"poo-angular":{url:"https://angular.dev/essentials",prompt:'<span class="ps">@</span>Component({ ... })',
summary:`
<h3>Angular com a framework orientat a objectes</h3>
<p>Angular s'escriu en <b>TypeScript</b> i organitza l'aplicació en <b>classes</b> amb responsabilitats ben separades. Fa servir <b>decoradors</b> per afegir metadades a les classes, i un sistema d'<b>injecció de dependències</b> que aplica directament el principi d'inversió de dependències.</p>
<h3>Classes i decoradors</h3>
<div class="tbl"><table>
<tr><th>Decorador</th><th>Classe</th><th>Responsabilitat</th></tr>
<tr><td><code>@Component</code></td><td>Component</td><td>Vista i interacció: plantilla, estils i estat de la vista</td></tr>
<tr><td><code>@Injectable</code></td><td>Servei</td><td>Lògica de negoci, accés a dades, estat compartit</td></tr>
<tr><td><code>@Directive</code></td><td>Directiva</td><td>Comportament afegit a elements del DOM</td></tr>
<tr><td><code>@Pipe</code></td><td>Pipe</td><td>Transformació de valors a la plantilla</td></tr>
<tr><td><code>@NgModule</code></td><td>Mòdul</td><td>Agrupació (abans de l'era standalone)</td></tr>
</table></div>
<ul>
<li>Els components són classes amb propietats (estat) i mètodes (gestors d'esdeveniments). Les entrades (<code>input()</code> / <code>@Input</code>) i sortides (<code>output()</code> / <code>@Output</code>) són la seva interfície pública: <b>encapsulament</b>.</li>
<li>Els <b>hooks de cicle de vida</b> s'implementen amb interfícies: <code>implements OnInit, OnDestroy</code>, que obliguen a definir <code>ngOnInit()</code> i <code>ngOnDestroy()</code>.</li>
<li>El <b>ViewEncapsulation</b> encapsula també els estils de cada component.</li>
</ul>
<h3>Injecció de dependències</h3>
<ul>
<li>Les classes no creen les seves dependències amb <code>new</code>: les demanen al constructor o amb <code>inject()</code>, i l'<b>injector</b> les proporciona. Resultat: <b>baix acoblament</b> i facilitat per fer proves amb dobles (<i>mocks</i>).</li>
<li><b>Proveïdors</b>: <code>providedIn: 'root'</code> (singleton per a tota l'aplicació), proveïdors a nivell de ruta o de component (una instància per component). Jerarquia d'injectors.</li>
<li>Es poden substituir implementacions: <code>{ provide: Logger, useClass: LoggerRemot }</code>, <code>useValue</code>, <code>useFactory</code>, <code>useExisting</code>. Per a valors que no són classes, <code>InjectionToken</code>.</li>
<li>Dependre d'una <b>classe abstracta</b> com a token i proporcionar-ne la implementació concreta és la manera d'aplicar la inversió de dependències a Angular (les interfícies no existeixen en temps d'execució).</li>
</ul>
<h3>Patrons presents</h3>
<ul>
<li><b>Singleton</b> (serveis a l'arrel), <b>Observer</b> (RxJS i signals), <b>Decorator</b> (metadades), <b>Facade</b> (un servei que simplifica l'accés a diversos serveis o a l'estat).</li>
<li>Separació en <b>components de presentació</b> (només reben dades i emeten esdeveniments) i <b>components contenidors</b> (obtenen les dades dels serveis): responsabilitat única.</li>
<li>Herència de components: possible però poc recomanada; es prefereix la <b>composició</b> (serveis, directives, <i>host directives</i>).</li>
<li>Models de dades amb <b>interfícies</b> TypeScript (<code>interface Llibre { id: number; titol: string; }</code>).</li>
</ul>`,

"poo-selenium":{url:"https://www.selenium.dev/documentation/test_practices/encouraged/page_object_models/",prompt:'<span class="ps">new</span> LoginPage(driver)',
summary:`
<h3>La POO aplicada a l'automatització de proves</h3>
<p>Les proves amb Selenium també són codi i n'ha de seguir els mateixos principis. La documentació de Selenium recomana el <b>Page Object Model</b> (POM) com a pràctica principal per fer les proves mantenibles.</p>
<h3>Page Object Model</h3>
<ul>
<li>Cada pàgina (o component important de la interfície) es representa amb una <b>classe</b>.</li>
<li>La classe <b>encapsula</b> els localitzadors (atributs privats) i exposa <b>mètodes</b> que representen els serveis que ofereix la pàgina (<code>iniciaSessio()</code>, <code>cerca()</code>), no els detalls tècnics (<code>clicaBoto()</code>).</li>
<li>Els mètodes de navegació retornen el <b>Page Object de la pàgina següent</b>, cosa que permet encadenar crides (<i>fluent interface</i>).</li>
<li>Les <b>assercions</b> van a les proves, no als Page Objects (excepte la comprovació que la pàgina s'ha carregat correctament).</li>
<li>Avantatges: si canvia la interfície, només cal modificar una classe; les proves són llegibles i no dupliquen codi.</li>
</ul>
<h3>Altres principis i patrons</h3>
<ul>
<li><b>Herència</b>: una classe <code>BasePage</code> amb el <code>WebDriver</code>, les esperes i els elements comuns (capçalera, menú), de la qual hereten les pàgines. També una <code>BaseTest</code> que crea i tanca el driver (<code>@BeforeEach</code>, <code>@AfterEach</code>).</li>
<li><b>Composició</b>: <i>Page Components</i> o fragments per a parts que es repeteixen en diverses pàgines (barra de cerca, taules, diàlegs).</li>
<li><b>Factory</b>: una <code>DriverFactory</code> que crea el driver adequat (Chrome, Firefox, remot amb Grid) segons la configuració. També la <code>PageFactory</code> de Selenium amb <code>@FindBy</code>.</li>
<li><b>Singleton</b> o <code>ThreadLocal</code> per gestionar el driver en execucions en paral·lel.</li>
<li><b>Builder</b> o objectes de dades per a les dades de prova; <b>Strategy</b> per canviar el comportament segons l'entorn.</li>
<li>Variants: el patró <b>Screenplay</b> (actors, tasques i preguntes) i el <b>Loadable Component</b> de Selenium, amb els mètodes <code>load()</code> i <code>isLoaded()</code>.</li>
<li>Principis: responsabilitat única (la prova no sap com es localitzen els elements), DRY i proves independents entre si.</li>
</ul>`,

["Estructura d'un projecte de proves","Dissenya les classes per provar el flux: inici de sessió, cerca d'un llibre al catàleg i reserva.",`<pre>abstract class BasePage {
  protected final WebDriver driver;
  protected final WebDriverWait wait;
  protected BasePage(WebDriver d) {
    this.driver = d;
    this.wait = new WebDriverWait(d, Duration.ofSeconds(10));
  }
  protected WebElement visible(By by) {
    return wait.until(ExpectedConditions.visibilityOfElementLocated(by));
  }
}

class LoginPage extends BasePage {
  private final By usuari = By.id("usuari"), pass = By.id("contrasenya"),
                   entra = By.id("entra");
  LoginPage(WebDriver d) { super(d); }
  CatalegPage entra(String u, String p) {
    visible(usuari).sendKeys(u);
    driver.findElement(pass).sendKeys(p);
    driver.findElement(entra).click();
    return new CatalegPage(driver);
  }
}

class CatalegPage extends BasePage {
  private final BarraCerca barra;            // composició
  CatalegPage(WebDriver d) { super(d); barra = new BarraCerca(d); }
  FitxaPage obreResultat(String titol) {
    barra.cerca(titol);
    visible(By.linkText(titol)).click();
    return new FitxaPage(driver);
  }
}

// Prova
@Test void reservaLlibre() {
  String msg = new LoginPage(driver)
      .entra("anna", "secret")
      .obreResultat("Clean Code")
      .reserva()
      .missatgeConfirmacio();
  assertEquals("Reserva feta", msg);
}</pre>`],
["Fàbrica de drivers","Escriu una classe que creï el driver segons una propietat del sistema (chrome, firefox o remot) i que funcioni amb proves en paral·lel.",`<pre>public final class DriverFactory {
  private static final ThreadLocal&lt;WebDriver&gt; DRIVER = new ThreadLocal&lt;&gt;();
  private DriverFactory() {}

  public static WebDriver get() {
    if (DRIVER.get() == null) DRIVER.set(crea(System.getProperty("browser", "chrome")));
    return DRIVER.get();
  }
  private static WebDriver crea(String tipus) {
    return switch (tipus) {
      case "firefox" -&gt; new FirefoxDriver();
      case "remot"   -&gt; new RemoteWebDriver(URI.create("http://grid:4444").toURL(),
                                            new ChromeOptions());
      default        -&gt; new ChromeDriver(new ChromeOptions().addArguments("--headless=new"));
    };
  }
  public static void tanca() {
    if (DRIVER.get() != null) { DRIVER.get().quit(); DRIVER.remove(); }
  }
}</pre><p>Combina Factory i un "singleton per fil" amb <code>ThreadLocal</code>, perquè cada prova paral·lela tingui el seu driver.</p>`]

summary:`
<h3>Classes i objectes</h3>
<ul>
<li>Definició amb <code>class</code>, instància amb <code>new</code>. Accés a membres amb <code>-&gt;</code> i a membres estàtics o constants amb <code>::</code>. Dins la classe: <code>$this</code> (objecte actual), <code>self::</code> (la classe on s'escriu), <code>parent::</code> (classe pare) i <code>static::</code> (<i>late static binding</i>: la classe des de la qual es crida).</li>
<li>Visibilitat: <code>public</code>, <code>protected</code> i <code>private</code> per a propietats, mètodes i constants.</li>
<li>Constructor <code>__construct()</code> i destructor <code>__destruct()</code>. <b>Promoció de propietats al constructor</b> (PHP 8.0): <code>public function __construct(private string $nom) {}</code>.</li>
<li>Propietats tipades (7.4), <code>readonly</code> (8.1) i classes <code>readonly</code> (8.2). Constants de classe (<code>const</code>), també tipades (8.3).</li>
<li>Els objectes es passen per <b>identificador</b> (com una referència); per duplicar-los cal <code>clone</code> (i opcionalment <code>__clone()</code>).</li>
</ul>
<h3>Herència, abstracció i interfícies</h3>
<ul>
<li><b>Herència simple</b> amb <code>extends</code>. <code>final</code> impedeix heretar una classe o sobreescriure un mètode.</li>
<li><b>Classes abstractes</b> (<code>abstract</code>) i <b>interfícies</b> (<code>interface</code>, <code>implements</code>, se'n poden implementar diverses; poden tenir constants). Interfícies predefinides: <code>Countable</code>, <code>ArrayAccess</code>, <code>IteratorAggregate</code>, <code>JsonSerializable</code>, <code>Stringable</code>.</li>
<li><b>Traits</b>: blocs de mètodes i propietats reutilitzables que s'incorporen amb <code>use</code>; resolen la falta d'herència múltiple. Conflictes amb <code>insteadof</code> i <code>as</code>.</li>
<li><b>Enums</b> (8.1): purs o amb valor (<i>backed</i>, <code>enum Estat: string</code>); poden tenir mètodes i implementar interfícies.</li>
<li><code>instanceof</code> per comprovar tipus; declaracions de tipus en paràmetres i retorns, inclosos <code>self</code>, <code>static</code>, unions (8.0) i interseccions (8.1).</li>
</ul>
<h3>Mètodes màgics i altres</h3>
<ul>
<li><code>__get</code>, <code>__set</code>, <code>__isset</code>, <code>__unset</code> (propietats inaccessibles), <code>__call</code> i <code>__callStatic</code> (mètodes inexistents), <code>__toString</code>, <code>__invoke</code> (cridar l'objecte com una funció), <code>__serialize</code> / <code>__unserialize</code>.</li>
<li><b>Classes anònimes</b> (<code>new class { ... }</code>), <b>closures</b> i <i>first-class callable syntax</i> (<code>$obj-&gt;metode(...)</code>).</li>
<li><b>Espais de noms</b> (<code>namespace App\Model;</code>, <code>use</code>) i <b>càrrega automàtica</b> amb <code>spl_autoload_register</code> o, habitualment, amb <b>Composer</b> seguint <b>PSR-4</b> (cada classe al seu fitxer, amb la ruta igual que l'espai de noms).</li>
<li>Excepcions com a jerarquia d'objectes: <code>Throwable</code> &gt; <code>Exception</code> i <code>Error</code>; excepcions pròpies estenent <code>Exception</code> o les de SPL (<code>InvalidArgumentException</code>, <code>RuntimeException</code>).</li>
<li>Recomanacions PSR (PHP-FIG): PSR-1 i PSR-12 (estil), PSR-4 (autoload), PSR-11 (contenidor d'injecció de dependències). Frameworks com Symfony i Laravel apliquen injecció de dependències i patrons com MVC i Repository.</li>
</ul>`,

declare(strict_types=1);
namespace App\\Domini;

enum EstatExemplar: string {
    case Disponible = 'disponible';
    case Prestat    = 'prestat';
    case Reparacio  = 'reparacio';
}

interface Prestable {
    public function presta(string $niu): \\DateTimeImmutable;
}

final class Exemplar implements Prestable {
    public function __construct(
        public readonly string $codi,
        private EstatExemplar $estat = EstatExemplar::Disponible,
    ) {}

        $this-&gt;estat = EstatExemplar::Prestat;

    }

final class PdoExemplarRepository implements ExemplarRepository {
    public function __construct(private \\PDO $pdo) {}
    public function troba(string $codi): ?Exemplar {
        $st = $this-&gt;pdo-&gt;prepare('SELECT codi, estat FROM exemplars WHERE codi = ?');
        $st-&gt;execute([$codi]);
        $f = $st-&gt;fetch(\\PDO::FETCH_ASSOC);

    public function desa(Exemplar $e): void { /* UPDATE ... */ }
}

final class ServeiPrestecs {

    public function presta(string $codi, string $niu): \\DateTimeImmutable {
        $e = $this-&gt;repo-&gt;troba($codi) ?? throw new \\InvalidArgumentException('No existeix');
        $data = $e-&gt;presta($niu);
        $this-&gt;repo-&gt;desa($e);
        return $data;

summary:`
<h3>Word</h3>
<ul>
<li><b>Estils</b> (Títol 1, Títol 2, Normal…): base per a un format coherent, la navegació i la <b>taula de continguts automàtica</b> (Referències &gt; Taula de continguts).</li>
<li><b>Salts</b> de pàgina i de <b>secció</b>: les seccions permeten orientació, marges, capçaleres i numeració diferents dins el mateix document.</li>
<li><b>Combinació de correspondència</b>: document principal + font de dades (Excel, llista) per generar cartes, etiquetes o correus personalitzats.</li>
<li><b>Revisió</b>: control de canvis, comentaris, comparar i combinar documents, restringir l'edició.</li>
<li>Referències: notes al peu i al final, títols de figures, referències creuades, índex, bibliografia.</li>
<li>Formats: <code>.docx</code>, plantilla <code>.dotx</code>, amb macros <code>.docm</code>; exportació a PDF (també PDF/A). Coautoria en temps real si el fitxer és a OneDrive o SharePoint.</li>
</ul>
<h3>Excel</h3>
<ul>
<li><b>Referències</b>: relatives (<code>A1</code>), absolutes (<code>$A$1</code>) i mixtes (<code>$A1</code>, <code>A$1</code>); <code>F4</code> alterna entre elles.</li>
<li>Funcions clau (nom en anglès / castellà): <code>SUM</code>/SUMA, <code>AVERAGE</code>/PROMEDIO, <code>IF</code>/SI, <code>COUNTIF</code>/CONTAR.SI, <code>SUMIF</code>/SUMAR.SI, <code>VLOOKUP</code>/BUSCARV, <code>XLOOKUP</code>/BUSCARX, <code>INDEX</code>+<code>MATCH</code>/INDICE+COINCIDIR, <code>CONCAT</code>, <code>TEXT</code>, <code>TODAY</code>/HOY, <code>FILTER</code>, <code>UNIQUE</code>.</li>
<li>Errors: <code>#N/A</code> (no trobat), <code>#DIV/0!</code>, <code>#REF!</code> (referència no vàlida), <code>#VALUE!</code> (tipus incorrecte), <code>#NAME?</code> (funció o nom desconegut), <code>#SPILL!</code> (matriu dinàmica bloquejada).</li>
<li><b>Taules</b> (Ctrl+T) amb referències estructurades, <b>taules dinàmiques</b> per resumir dades, filtres, ordenació, <b>format condicional</b>, <b>validació de dades</b> (llistes desplegables), gràfics.</li>
<li><b>Power Query</b> (obtenir i transformar dades), macros VBA (<code>.xlsm</code>), protecció de fulls i llibres.</li>
</ul>
<h3>PowerPoint</h3>
<ul>
<li><b>Patró de diapositives</b>: defineix dissenys, tipografies i elements comuns per a tota la presentació.</li>
<li><b>Transicions</b> (entre diapositives) i <b>animacions</b> (d'objectes dins una diapositiva).</li>
<li><b>Visualització del moderador</b> amb notes, temps i la diapositiva següent. Assajar intervals.</li>
<li>Exportar a PDF o vídeo; inserir objectes d'Excel vinculats; comprovador d'accessibilitat (text alternatiu, ordre de lectura).</li>
</ul>`,

"m365":{url:"https://learn.microsoft.com/training/",prompt:'<span class="ps">M365</span> &gt; Teams &gt; SharePoint',
summary:`
<h3>Com encaixen</h3>
<p>A Microsoft 365, un <b>grup de Microsoft 365</b> és la peça comuna: en crear un equip de Teams es crea un grup, un <b>lloc de SharePoint</b> per als fitxers, una bústia i un bloc de notes compartits, i es pot afegir un pla de <b>Planner</b>. Els fitxers dels canals es desen a SharePoint; els dels xats privats, a l'<b>OneDrive</b> de qui els comparteix.</p>
<h3>SharePoint</h3>
<ul>
<li><b>Llocs de grup</b> (col·laboració d'un equip, connectats a un grup de M365) i <b>llocs de comunicació</b> (publicar informació a molta gent, com una intranet).</li>
<li><b>Biblioteques de documents</b> amb <b>historial de versions</b>, columnes de metadades, vistes, extreure/proteger (<i>check-out/check-in</i>), coautoria i alertes.</li>
<li><b>Llistes</b>: dades estructurades (com una taula) amb vistes, formularis i fluxos de Power Automate.</li>
<li><b>Permisos</b>: per defecte s'hereten del lloc; es pot trencar l'herència per a una biblioteca, carpeta o element. Grups predeterminats: propietaris, membres i visitants.</li>
<li>Diferència amb OneDrive: OneDrive és l'espai personal de cada usuari; SharePoint és l'espai compartit de l'organització.</li>
</ul>
<h3>Teams</h3>
<ul>
<li><b>Equips</b> (públics o privats) organitzats en <b>canals</b>: estàndard (tots els membres), <b>privats</b> (només uns membres, amb un lloc SharePoint propi) i <b>compartits</b> (amb persones d'altres equips o organitzacions).</li>
<li>Rols: <b>propietari</b> (gestiona membres i configuració), <b>membre</b> i <b>convidat</b> (extern).</li>
<li>Xats individuals i de grup, publicacions als canals, <b>reunions</b> (gravació, transcripció, sales de grups petits), seminaris web.</li>
<li><b>Pestanyes</b> i aplicacions integrades (Planner, Forms, Lists, OneNote, Power BI), connectors i bots.</li>
</ul>
<h3>Planner</h3>
<ul>
<li>Gestió de tasques en equip amb estil Kanban: un <b>pla</b> conté <b>cubs</b> (<i>buckets</i>, columnes) i <b>tasques</b>.</li>
<li>Cada tasca té responsables, data d'inici i venciment, prioritat, progrés (no iniciada, en curs, completada), <b>etiquetes</b>, llista de comprovació, adjunts i comentaris.</li>
<li>Vistes: <b>Tauler</b>, <b>Gràfics</b> (estat i càrrega per persona), <b>Planificació</b> (calendari) i Quadrícula.</li>
<li>S'integra a Teams com a pestanya i amb To Do (les tasques assignades apareixen a la llista personal). Les funcions avançades (dependències, cronogrames) són de la versió premium.</li>
</ul>`,

var OPEN=[
{b:"Gestió de biblioteques",q:"Descriu el flux de dipòsit d'un TFG a DSpace des que l'estudiant l'envia fins que és visible al repositori, i quins protocols permeten que el recullin altres recol·lectors.",a:"L'estudiant s'identifica (SSO), tria la col·lecció i omple el formulari de metadades (Dublin Core), puja el fitxer (bitstream) i accepta la llicència de dipòsit. L'ítem entra al flux de treball de la col·lecció, on un revisor l'accepta, el rebutja o n'edita les metadades. Un cop aprovat s'arxiva, rep un Handle, s'indexa a Solr (Discovery) i es fa visible, amb embargament si escau. Les metadades s'exposen per OAI-PMH, cosa que permet la recol·lecció per RECERCAT, Recolecta, OpenAIRE o Google Scholar."},
{b:"Gestió de biblioteques",q:"Explica la funció de MARC21, Dublin Core, METS, MODS i PREMIS en una frase cadascun.",a:"MARC21: format de catalogació bibliogràfica dels SIGB, amb camps numèrics, indicadors i subcamps. Dublin Core: 15 elements simples i genèrics per descriure recursos, base d'OAI-PMH. MODS: descripció bibliogràfica en XML, més rica que DC i més senzilla que MARC. METS: contenidor XML que empaqueta un objecte digital (metadades descriptives, administratives, fitxers i mapa estructural). PREMIS: metadades de preservació (objectes, esdeveniments, agents i drets)."},
{b:"Gestió de biblioteques",q:"Què són els paquets SIP, AIP i DIP del model OAIS?",a:"Model OAIS (ISO 14721). SIP: paquet d'enviament que el productor lliura a l'arxiu. AIP: paquet d'arxiu que es preserva a llarg termini, amb el contingut i les metadades de preservació. DIP: paquet de difusió que es lliura a l'usuari, derivat de l'AIP."},
{b:"Gestió de biblioteques",q:"Enumera tres estratègies de preservació digital i posa un exemple de format recomanat per a documents i un per a imatges.",a:"Preservació del flux de bits (còpies múltiples, regla 3-2-1, comprovació de fixesa amb sumes de verificació), migració a formats nous o estables i emulació de l'entorn original. Formats: PDF/A per a documents i TIFF sense compressió (o JPEG 2000) per a imatges."},
{b:"Gestió de biblioteques",q:"Quines tasques tècniques comporta posar en marxa una revista nova al portal OJS de la UB?",a:"Crear la revista a la instal·lació (ruta, idiomes) i assignar-ne el gestor; configurar seccions, política d'accés obert i llicència; definir el flux editorial (tipus de revisió, revisors) i els rols; activar les extensions de DOI (Crossref), ORCID i OAI-PMH; configurar el tema; i fer una prova completa d'enviament i publicació."},
{b:"Gestió de biblioteques",q:"Quins protocols fa servir un SIGB per interoperar amb altres sistemes? Cita'n almenys tres i la seva funció.",a:"Z39.50 o SRU: cerca i importació de registres entre catàlegs. OAI-PMH: recol·lecció de metadades. SIP2: comunicació amb màquines d'autopréstec. NCIP: circulació i préstec interbibliotecari. OpenURL: enllaç de la referència al text complet."},
{b:"Administració electrònica",q:"Explica quan es considera practicada o rebutjada una notificació electrònica i quina norma ho regula.",a:"Llei 39/2015. Es considera practicada quan la persona interessada hi accedeix (a la seu o per un servei com e-NOTUM). Si passen 10 dies naturals des de la posada a disposició sense accedir-hi, es considera rebutjada, es dona per efectuat el tràmit i el procediment continua."},
{b:"Administració electrònica",q:"Quins serveis de l'AOC faries servir en una aplicació que identifica la persona, consulta dades d'altres administracions, notifica la resolució i arxiva l'expedient?",a:"VÀLid per a la identificació (idCAT Mòbil, certificat, Cl@ve), Via Oberta per consultar dades d'altres administracions sense demanar documents, e-NOTUM per a les notificacions i iArxiu per a l'arxiu i la preservació de l'expedient electrònic. Opcionalment, el Signador i Representa."},
{b:"Administració electrònica",q:"Què és el codi segur de verificació (CSV) i per a què serveix?",a:"És un codi que l'administració incorpora als documents electrònics (Llei 40/2015) i que permet comprovar-ne l'autenticitat i integritat consultant l'original a la seu electrònica. Serveix, per exemple, per validar una còpia en paper d'un document electrònic."},
{b:"Administració electrònica",q:"Diferencia la signatura electrònica simple, avançada i qualificada.",a:"Segons el Reglament eIDAS: la simple són dades electròniques associades a d'altres per signar; l'avançada està vinculada de manera única al signant, permet identificar-lo i detectar qualsevol canvi posterior; la qualificada és una signatura avançada creada amb un dispositiu qualificat i basada en un certificat qualificat, i té efectes equivalents a la signatura manuscrita."},
{b:"Seguretat",q:"Descriu pas a pas el flux SAML iniciat pel proveïdor de serveis.",a:"L'usuari accedeix a l'aplicació (SP) sense sessió; el SP genera un AuthnRequest i redirigeix el navegador a l'IdP (HTTP-Redirect); l'IdP autentica l'usuari; l'IdP retorna una Response amb una asseveració signada (NameID, atributs, condicions) per HTTP-POST a l'Assertion Consumer Service del SP; el SP valida signatura, emissor, audiència, destinatari i dates, i crea la sessió local."},
{b:"Seguretat",q:"Quina diferència hi ha entre OAuth 2.0 i OpenID Connect? Quin token és per a cada cosa?",a:"OAuth 2.0 és un marc de delegació d'autorització: permet que una aplicació accedeixi a recursos en nom de l'usuari amb un access token. OpenID Connect és una capa d'identitat sobre OAuth 2.0 que afegeix l'autenticació: l'ID token (JWT amb iss, sub, aud, exp, nonce) és per al client i identifica l'usuari; l'access token és per cridar l'API."},
{b:"Seguretat",q:"Explica el funcionament de CAS amb els tiquets TGT i ST.",a:"L'aplicació redirigeix l'usuari al servidor CAS amb el paràmetre service. CAS l'autentica i crea un TGT, desat a la galeta TGC del domini CAS (dona el SSO). CAS redirigeix a l'aplicació amb un Service Ticket d'un sol ús. L'aplicació valida l'ST directament amb CAS (serviceValidate) i rep l'usuari i, en CAS 3, els atributs."},
{b:"Seguretat",q:"Compara RBAC i ABAC i posa un exemple d'ús de cadascun.",a:"RBAC assigna permisos a rols i rols a usuaris; és senzill d'administrar i auditar, però pot patir explosió de rols (exemple: rols Lector, Taulell i Administrador al SIGB). ABAC decideix amb polítiques que combinen atributs del subjecte, recurs, acció i entorn; és més flexible i contextual però més complex (exemple: el personal de secretaria del centre pot modificar expedients del seu centre en horari laboral i des de la xarxa UB)."},
{b:"Bases de dades",q:"Escriu una consulta SQL que retorni, per a cada usuari, el nombre de préstecs actius (sense data de retorn), només per als que en tinguin més de 3.",a:"SELECT niu, COUNT(*) AS actius FROM prestecs WHERE data_retorn IS NULL GROUP BY niu HAVING COUNT(*) > 3 ORDER BY actius DESC; (WHERE filtra files abans d'agrupar; HAVING filtra els grups)."},
{b:"Bases de dades",q:"Explica la 1FN, 2FN i 3FN amb un exemple breu.",a:"1FN: valors atòmics, sense grups repetitius (no guardar diversos autors en un sol camp). 2FN: cap atribut no clau depèn només d'una part d'una clau composta (a LINIA(comanda, producte, descripcio), descripcio depèn només de producte). 3FN: cap atribut no clau depèn d'un altre atribut no clau (a COMANDA(num, id_client, nom_client), nom_client depèn d'id_client)."},
{b:"Bases de dades",q:"Com es transforma una relació N:M del model entitat-relació al model relacional? Posa un exemple de la biblioteca.",a:"Amb una taula intermèdia que conté les claus primàries de les dues entitats com a claus foranes (i normalment com a clau primària composta) més els atributs de la relació. Exemple: LLIBRE i AUTOR → LLIBRE_AUTOR(isbn FK, autor_id FK, PK(isbn, autor_id))."},
{b:"Tecnologies web",q:"Dissenya els endpoints REST per gestionar reserves de llibres i indica el codi HTTP de resposta de cadascun.",a:"GET /usuaris/{niu}/reserves (200); GET /reserves/{id} (200 o 404); POST /reserves (201 + Location); DELETE /reserves/{id} (204); PATCH /reserves/{id} per canviar l'estat (200, o 409 si no es pot). Recursos en plural, sense verbs a la URL, JSON, autenticació amb token Bearer (401 si no autenticat, 403 si sense permís)."},
{b:"Tecnologies web",q:"Diferències entre SOAP i REST.",a:"SOAP: protocol de missatges XML amb sobre (Envelope, Header, Body, Fault), contracte WSDL, normalment POST a un sol endpoint, extensions WS-* com WS-Security. REST: estil arquitectònic basat en recursos amb URI i verbs HTTP, sense estat, formats JSON o XML, errors amb codis HTTP, contracte opcional amb OpenAPI; més lleuger."},
{b:"Tecnologies web",q:"Quina diferència hi ha entre Apache HTTP Server, Tomcat i WebLogic? Com els combinaries?",a:"Apache HTTP Server és un servidor web (estàtics, TLS, proxy invers, mòduls). Tomcat és un contenidor web de Servlet/JSP, no un servidor Jakarta EE complet. WebLogic és un servidor d'aplicacions Jakarta EE complet (EJB, JMS, JTA, clústers). Arquitectura típica: Apache al davant amb TLS i mod_proxy (o el Proxy Plug-in de WebLogic) que redirigeix cap a Tomcat o WebLogic."},
{b:"Contenidors i CI/CD",q:"Explica la diferència entre una imatge i un contenidor Docker, i com es conserven les dades d'una base de dades en contenidor.",a:"La imatge és una plantilla de només lectura feta de capes; el contenidor és una instància en execució de la imatge amb una capa d'escriptura. Les dades del contenidor es perden en eliminar-lo, per això la BD ha de desar-les en un volum (gestionat per Docker) o en un bind mount."},
{b:"Contenidors i CI/CD",q:"Descriu un pipeline de Jenkins per a una aplicació Java des del commit fins a producció.",a:"Webhook del repositori dispara el pipeline (Jenkinsfile declaratiu): compilar amb Maven, proves unitàries (informe JUnit), anàlisi de qualitat (SonarQube), construir la imatge Docker i pujar-la al registre, desplegar a preproducció i fer proves d'integració, aprovació manual (input) i desplegament a producció (rolling update a Kubernetes); notificacions a la secció post."},
{b:"Metodologia, disseny i POO",q:"Explica els quatre pilars de la programació orientada a objectes amb un exemple en Java.",a:"Abstracció: modelar el rellevant (classe abstracta Usuari). Encapsulament: atributs private amb mètodes d'accés. Herència: Estudiant extends Usuari. Polimorfisme: cada subclasse sobreescriu maxLlibres() i la biblioteca crida u.maxLlibres() sense saber el tipus concret (lligam dinàmic)."},
{b:"JavaScript, TypeScript i frontend",q:"A Angular, què és la injecció de dependències i quin avantatge té? Com declares un servei singleton?",a:"Les classes no creen les seves dependències amb new: les demanen (constructor o inject()) i l'injector les proporciona. Redueix l'acoblament, aplica la inversió de dependències i facilita les proves amb dobles. Singleton: @Injectable({ providedIn: 'root' })."},
{b:"PHP i Perl",q:"Com evites la injecció SQL i el XSS en una aplicació PHP?",a:"Injecció SQL: sentències preparades amb PDO i paràmetres, mai concatenar l'entrada a la consulta. XSS: escapar la sortida amb htmlspecialchars (ENT_QUOTES, UTF-8) i validar l'entrada (filter_var). A més, password_hash per a contrasenyes i tokens CSRF als formularis."},
{b:"Sistemes operatius",q:"Explica els permisos 750 i 644 a Linux i quina ordre els aplica. Què fa umask 027?",a:"750: propietari rwx, grup r-x, altres sense permisos. 644: propietari rw-, grup r--, altres r--. S'apliquen amb chmod 750 fitxer. umask 027 treu permisos per defecte: directoris nous 750 (777-027) i fitxers 640 (666-027)."},
{b:"Eines",q:"Quina diferència hi ha entre git merge i git rebase, i quan no s'ha de fer rebase?",a:"Merge integra les branques creant un commit de fusió (o fast-forward) i conserva la història tal com va passar. Rebase reaplica els commits sobre una altra base i deixa una història lineal, però reescriu els hashes. No s'ha de fer rebase de commits ja publicats en branques compartides."},
{b:"Igualtat",q:"Quins són els quatre eixos del IV Pla d'igualtat de la UB i el seu període de vigència?",a:"Vigència de l'1 de gener de 2025 al 31 de desembre de 2029. Eixos: 1) Impuls de la igualtat a la comunitat universitària; 2) Perspectiva de gènere en la docència; 3) Perspectiva de gènere en la recerca i la transferència; 4) Organització lliure de sexisme i violència de gènere."},
{b:"Igualtat",q:"Segons l'article 43 de la LOSU, de quines unitats bàsiques han de disposar les universitats?",a:"Unitats d'igualtat i de diversitat (conjuntes o separades), de defensoria universitària i d'inspecció de serveis, i serveis de salut i acompanyament psicològic i pedagògic i d'orientació professional, dotats de recursos humans i econòmics suficients. Les unitats de diversitat coordinen les polítiques d'inclusió i antidiscriminació i han de tenir un servei d'atenció a la discapacitat."},
{b:"Igualtat",q:"Segons l'article 46 de la LOSU, quines funcions té el Consell de Govern en matèria d'igualtat i inclusió, i quin percentatge mínim d'estudiantat i de PTGAS hi ha d'haver?",a:"És el màxim òrgan de govern. Ha de definir i impulsar, amb la unitat d'igualtat, un pla d'igualtat de gènere de tota la comunitat; informar de l'aprovació del Pla d'igualtat negociat amb la representació legal de les persones treballadores; i definir i impulsar, amb la unitat de diversitat, un pla d'inclusió i no-discriminació, amb protocols contra la violència, l'assetjament laboral o la discriminació. Mínim del 10 % d'estudiantat i del 10 % de PTGAS; un terç dels membres els tria el rector o rectora."}

"igualtat":{ver:2,url:"https://www.ub.edu/portal/web/igualtat/iv-pla-d-igualtat-2025-2029-",prompt:'<span class="ps">$</span> pla --punts 1.2,1.4,3',
summary:`
<div class="key">El temari només demana tres punts del IV Pla d'igualtat: <b>1.2</b> (marc normatiu de referència), <b>1.4</b> (àmbits d'aplicació) i <b>3</b> (accions previstes). Aquest resum se centra en aquests punts.</div>
<h3>Dades bàsiques del Pla</h3>
<ul>
<li>Aprovat pel <b>Consell de Govern el 10 de desembre de 2025</b>. Vigent de l'<b>1 de gener de 2025 al 31 de desembre de 2029</b> (cinc anys naturals).</li>
<li>El primer pla d'igualtat de la UB és del 2008; aquest és el quart. El III Pla tenia 7 eixos, 94 objectius i 263 accions; el IV en redueix el volum i hi associa indicadors, responsables i calendari mitjançant un <b>pla d'acció operatiu</b>.</li>
<li>Novetats: metodologia <b>participativa</b> (Design Thinking amb StartUB) i perspectiva <b>interseccional</b> transversal. Integra el nou Protocol contra les violències masclistes i LGTBIQ+ fòbiques aprovat l'octubre de 2025.</li>
<li>Arquitectura de tres instruments: IV Pla d'igualtat (tota la comunitat), <b>I Pla d'igualtat de les persones treballadores</b> (2026-2029, matèria laboral de PDI i PTGAS, negociat) i <b>Pla d'inclusió</b> (previst per al 2026, accessibilitat i antidiscriminació).</li>
</ul>
<h3>Punt 1.2 · Marc normatiu de referència</h3>
<p>El Pla s'emmarca en cinc capes normatives: internacional, europea, estatal, catalana i universitària.</p>
<div class="tbl"><table>
<tr><th>Àmbit</th><th>Normes citades</th></tr>
<tr><td>Internacional</td><td><b>CEDAW</b> (ONU, 1979); Declaració i Plataforma d'Acció de <b>Beijing</b> (1995); <b>Agenda 2030</b> i <b>ODS 5</b>; Principis de <b>Yogyakarta</b> (drets LGTBIQ+); <b>Conveni d'Istanbul</b> (Consell d'Europa, 2011) sobre violència contra les dones.</td></tr>
<tr><td>Europeu</td><td>TUE art. 2; TFUE art. 3 i 157; Carta de Drets Fonamentals (art. 20-23); directives 2006/54/CE (treball), 2004/113/CE (béns i serveis), 2010/41/UE (activitat autònoma), 2000/78/CE (ocupació), 2000/43/CE (igualtat etnicoracial), 2019/1158 (conciliació), 2023/970 (igualtat retributiva); Estratègies europees d'igualtat de gènere i LGBTIQ 2020-2025; Espai Europeu de Recerca i <b>Horizon Europe</b>, que exigeixen plans d'igualtat.</td></tr>
<tr><td>Estatal</td><td>Constitució art. <b>14</b> (igualtat) i <b>9.2</b> (obligació dels poders públics); <b>LO 3/2007</b> per a la igualtat efectiva de dones i homes (pilar); <b>RD 901/2020</b> (plans d'igualtat i registre); <b>RD 902/2020</b> (igualtat retributiva); <b>LO 1/2004</b> (violència de gènere); <b>LO 10/2022</b> (llibertat sexual); <b>LOSU 2/2023</b>; Llei 14/2011 de la ciència, reformada per la Llei 17/2022; <b>Llei 15/2022</b> integral per a la igualtat de tracte (interseccionalitat); <b>Llei 4/2023</b> (persones trans i LGTBI).</td></tr>
<tr><td>Català</td><td>Estatut d'Autonomia art. <b>41</b>; <b>Llei 17/2015</b> d'igualtat efectiva de dones i homes; <b>Llei 5/2008</b> del dret de les dones a erradicar la violència masclista; <b>Llei 19/2020</b> d'igualtat de tracte i no-discriminació; <b>Llei 11/2014</b> (drets LGTBI).</td></tr>
<tr><td>Universitari (UB)</td><td>Estatut i normativa interna, especialment el <b>Protocol per prevenir i reparar amb diligència deguda</b> les situacions de violència masclista, assetjament sexual i per raó de sexe, orientació sexual, identitat o expressió de gènere (2025). Vinculació amb el SAIQU (qualitat) i el Pla d'acció del Vicerectorat d'Igualtat.</td></tr>
</table></div>
<p>També cita estratègies de recerca: Estratègia Espanyola de Ciència, Tecnologia i Innovació 2021-2027 i l'Estratègia d'Igualtat a la Ciència (EIGEC) de 2024.</p>
<h3>Punt 1.4 · Àmbits d'aplicació</h3>
<ul>
<li>S'aplica de manera <b>transversal a tots els àmbits d'actuació</b> de la Universitat, per incorporar la perspectiva de gènere i la igualtat efectiva en tots els processos, estructures i espais.</li>
<li>Incideix de manera directa o indirecta en l'àmbit laboral, però les <b>matèries laborals</b> es recullen al <b>I Pla d'igualtat de gènere de les persones treballadores</b> i els temes d'<b>inclusió</b> al <b>Pla d'inclusió</b>.</li>
<li>Vol ser un instrument estructural que transformi la cultura institucional i els sistemes de la universitat com a ens educatiu, investigador i públic.</li>
<li>(Punt 1.5, complementari: s'adreça a totes les persones que integren la institució, hi col·laboren o s'hi relacionen.)</li>
</ul>
<h3>Punt 3 · Accions previstes (4 eixos)</h3>
<p><b>Eix 1. Impuls de la igualtat a la comunitat universitària</b> (12 objectius). Accions destacades:</p>
<ul>
<li>Pla de difusió del <b>llenguatge inclusiu</b> a tots els canals (1.1.1).</li>
<li>Commemorar l'11F, 8M, 28M, 26A, 28J i 25N (1.2.1). Paritat en actes i reconeixements (1.3.1). Combatre el currículum ocult (1.4.1). Lavabos inclusius (1.5.1).</li>
<li>Grup de treball d'estudiantat vinculat a la Unitat d'Igualtat i suport a col·lectius feministes i LGTBIQ+ (1.6). Conciliació per a l'estudiantat amb càrregues familiars (1.7).</li>
<li><b>1.8.1: incorporar el no-binarisme i la diversitat d'unitats de convivència als sistemes institucionals</b> (formularis i sistemes informàtics, que el Pla reconeix que han avançat lentament). És l'acció més lligada a la feina d'una persona programadora.</li>
<li>Crear la <b>Unitat d'Igualtat i Diversitat</b> (1.9.1). Igualtat i benestar al sistema intern de qualitat (1.10). Patrimoni amb justícia epistèmica (1.11.1). Dades pressupostàries amb perspectiva de gènere (1.12.1).</li>
</ul>
<p><b>Eix 2. Perspectiva de gènere en la docència</b> (4 objectius): percepció de l'estudiantat a les enquestes; criteri de finançament en projectes d'innovació docent; guies de la Xarxa Vives; eines per adaptar la docència, també al Campus Virtual i a les bibliografies; premi anual al professorat; jornada anual; formació biennal del PDI; assignatura optativa transversal compartida entre facultats; <b>competència transversal obligatòria</b> en gènere a totes les titulacions; grau internacional en Igualtat, Diversitat i Inclusió; cursos de formació permanent amb perspectiva de gènere; perspectiva de gènere als <b>TFG i TFM</b>; curs per a l'Escola de Doctorat.</p>
<p><b>Eix 3. Perspectiva de gènere en la recerca i la transferència</b> (6 objectius): premi anual al PDI; incentivar el lideratge de les dones; formació biennal; materials de suport per a projectes; formació sobre models de lideratge; <b>composició equilibrada</b> de les comissions acadèmiques de doctorat; comissió de gènere en emprenedoria; revisar el Codi ètic d'integritat i la Guia de direcció de tesis; ítem de gènere a la rúbrica dels plans de recerca de doctorat.</p>
<p><b>Eix 4. Organització lliure de sexisme i violència de gènere</b> (7 objectius):</p>
<ul>
<li>Clàusula de coneixement del Protocol en convenis i plecs de contractació (4.1.1); informe anual de casos (4.1.2); <b>sistema segur i confidencial per registrar i fer el seguiment dels casos</b> (4.1.3).</li>
<li>Itinerari formatiu obligatori; informació a l'estudiantat nouvingut (4.2).</li>
<li>Xarxa de <b>punts liles</b>; circuit PAT-NERE o equivalent a cada facultat (4.3).</li>
<li>Campanyes i guia de drets de les víctimes (4.4).</li>
<li>Cobertura del cost del títol en cas de canvi de nom legal; difusió del procediment de <b>canvi de nom</b> de persones trans i no binàries; guia de bones pràctiques LGTBIQ+ (4.5).</li>
<li>Estratègia de reparació i reincorporació; mapa d'experiències (4.6). Participació de l'estudiantat, <b>Consell Assessor Extern</b> i coordinació amb la xarxa pública d'atenció (4.7).</li>
</ul>
<p>El Protocol distingeix dues vies: la <b>general</b> (prevenció, suport i mesures de protecció fins i tot sense denúncia) i el <b>procediment de denúncia, investigació i reparació</b>. Es basa en el principi de <b>diligència deguda</b> i incorpora per primera vegada un eix de reparació.</p>
<h3>Seguiment i agents (context)</h3>
<p>La <b>Unitat d'Igualtat</b> elabora memòries anuals; la Comissió de Seguiment valida l'informe, que passa a la <b>Comissió d'Igualtat</b> i al <b>Consell de Govern</b>. Agents: vicerectorat competent (presideix la Comissió d'Igualtat), Comissió d'Igualtat, comissions d'igualtat de facultat i Unitat d'Igualtat.</p>`,

"losu":{ver:2,url:"https://www.boe.es/eli/es/lo/2023/03/22/2/con",prompt:'<span class="ps">BOE</span> LOSU art. 43, 44, 46',
summary:`
<div class="key">El temari només demana els <b>articles 43, 44 i 46</b> de la LOSU. Tots tres són del títol IX (universitats públiques): el 43 tanca el capítol I (estructura) i el 44 i el 46 són del capítol II (governança).</div>
<h3>Context mínim de la llei</h3>
<p><b>Llei orgànica 2/2023, de 22 de març, del sistema universitari</b>. Publicada al BOE núm. 70 el <b>23 de març de 2023</b> i en vigor el <b>12 d'abril de 2023</b>. Deroga la LO 6/2001 (LOU), la LO 4/2007 i el RDL 14/2012. Té 100 articles en un títol preliminar i deu títols.</p>
<h3>Article 43 · Unitats bàsiques</h3>
<ul>
<li>Les universitats han de tenir <b>unitats d'igualtat i de diversitat</b>, que es poden constituir <b>de manera conjunta o separada</b>.</li>
<li>També unitats de <b>defensoria universitària</b> i d'<b>inspecció de serveis</b>.</li>
<li>I <b>serveis de salut i acompanyament psicològic i pedagògic</b> i <b>serveis d'orientació professional</b>.</li>
<li>Tots han d'estar dotats amb <b>recursos humans i econòmics suficients</b>.</li>
<li>Les <b>unitats de diversitat</b> coordinen i inclouen de manera transversal les polítiques universitàries d'<b>inclusió i antidiscriminació</b> en totes les activitats de la universitat, i han de tenir un <b>servei d'atenció a la discapacitat</b>.</li>
<li>Les unitats d'igualtat impulsen el principi d'igualtat entre dones i homes en el conjunt de la universitat (plans d'igualtat, protocols).</li>
<li>La <b>inspecció de serveis</b> actua d'ofici, a instància dels òrgans de govern o després d'una denúncia escrita d'un membre de la comunitat universitària.</li>
</ul>
<h3>Article 44 · Normes generals de governança, representació i participació</h3>
<ol>
<li><b>Òrgans col·legiats</b> que els Estatuts han d'establir i regular: <b>Claustre Universitari</b>, <b>Consell de Govern</b> i <b>Consell d'Estudiants</b>. També han d'establir el <b>Consell Social</b>, i poden regular Consells d'Escola i de Facultat, Consells de Departament o altres òrgans específics.</li>
<li><b>Òrgans unipersonals</b> (entre d'altres): <b>rector o rectora</b>, <b>vicerectors o vicerectores</b>, <b>secretari o secretària general</b>, <b>gerent</b> i, si escau, degans o deganes, directors o directores d'escola, de departament o d'altres estructures.</li>
<li>El <b>mandat</b> dels titulars d'òrgans unipersonals electes és, en tots els casos, de <b>sis anys improrrogables i no renovables</b>. La <b>dedicació a temps complet</b> del professorat és requisit per exercir òrgans unipersonals de govern. <b>No es pot ser titular de més d'un càrrec alhora.</b></li>
<li>Els Estatuts han d'establir <b>mecanismes incentivadors de la participació</b> i la representació de tots els sectors en els òrgans de govern, amb <b>especial atenció a l'estudiantat</b>, i amb informació actualitzada als <b>portals de transparència</b> sobre els espais de participació.</li>
</ol>
<h3>Article 46 · El Consell de Govern</h3>
<p><b>És el màxim òrgan de govern de la universitat.</b> (El Claustre és el màxim òrgan de representació.)</p>
<p><b>Funcions</b> (apartat 2):</p>
<ul>
<li>a) Promoure i aprovar els <b>plans estratègics</b>, a proposta de l'Equip de Govern. b) Fixar les directrius i procediments de totes les polítiques.</li>
<li>c) <b>Proposar al Consell Social</b> el Pla Plurianual de Finançament. f) Proposar al Consell Social els <b>pressupostos</b> i els comptes anuals (el Consell Social els aprova).</li>
<li>d) Aprovar l'oferta i la programació docent. e) Aprovar les convocatòries de places i la <b>relació de llocs de treball</b> del PDI i del PTGAS (aprovació final de la comunitat autònoma).</li>
<li>g) Aprovar els convenis d'adscripció de centres. h) Aprovar convenis de col·laboració acadèmica i de recerca.</li>
<li>i) Definir i aprovar plans de captació, estabilització i promoció del PDI.</li>
<li>j) <b>Definir i impulsar, en coordinació amb la unitat d'igualtat, un pla d'igualtat de gènere</b> de tota la comunitat universitària.</li>
<li>k) <b>Informar de l'aprovació del Pla d'Igualtat negociat</b> amb la representació legal de les persones treballadores, que ha d'incloure com a mínim les matèries de l'article 46.2 de la LO 3/2007.</li>
<li>l) <b>Definir i impulsar, en coordinació amb la unitat de diversitat, un pla d'inclusió i no-discriminació</b> (discapacitat, origen ètnic i nacional, orientació sexual, identitat de gènere i qualsevol altra condició), i elaborar <b>protocols</b> i mesures de prevenció i resposta davant la violència, l'assetjament laboral o la discriminació.</li>
<li>m) Definir i impulsar una <b>Estratègia de Mitigació del Canvi Climàtic</b> (eficiència energètica, renovables, alimentació sostenible, mobilitat).</li>
<li>n) Aprovar la normativa de funcionament de la <b>inspecció de serveis</b> i els seus procediments de rendició de comptes anuals.</li>
<li>ñ) Qualsevol altra funció de govern que estableixin els Estatuts.</li>
</ul>
<p><b>Composició</b> (apartat 3):</p>
<ul>
<li>Membres nats: <b>rector o rectora</b> (que el presideix), <b>secretari o secretària general</b> i <b>gerent</b>.</li>
<li>Representació de les estructures de la universitat, del PDI, de l'estudiantat, del PTGAS i del <b>Consell Social</b>. Els representants del personal i de l'estudiantat els tria el <b>Claustre</b>.</li>
<li><b>Majoria</b> de personal dels cossos docents universitaris i professorat permanent laboral, amb presència de les figures no permanents, del personal investigador no permanent i del professorat associat.</li>
<li>Mínim del <b>10 % d'estudiantat</b> i mínim del <b>10 % de PTGAS</b>.</li>
<li><b>Un terç</b> dels membres el tria el rector o rectora, incloent-hi els membres nats.</li>
<li>Si hi ha campus en diverses localitats, se'n procura la representació.</li>
</ul>
<h3>Relació amb altres articles (per situar-se)</h3>
<p>Art. 45: Claustre (màxim òrgan de representació). Art. 47: Consell Social (aprova pressupostos i comptes). Art. 48: Consell d'Estudiants. Art. 50: rector o rectora i Equip de Govern. Art. 4.3: els plans d'igualtat i les mesures contra la violència són requisit per crear universitats.</p>`,

summary:`
<h3>Què és JSF</h3>
<p><b>JavaServer Faces</b> (ara <b>Jakarta Faces</b>) és el framework estàndard de Java EE per construir interfícies web <b>basades en components</b> al servidor, seguint el patró MVC. Les vistes es fan amb <b>Facelets</b> (fitxers <code>.xhtml</code>), la lògica en <b>beans</b> i la connexió entre totes dues amb l'<b>Expression Language</b> (<code>#{bean.propietat}</code>). Totes les peticions passen pel <code>FacesServlet</code>. Implementacions: Mojarra (de referència) i MyFaces.</p>
<h3>Elements</h3>
<ul>
<li>Biblioteques d'etiquetes: <code>h:</code> (HTML: <code>h:form</code>, <code>h:inputText</code>, <code>h:commandButton</code>, <code>h:dataTable</code>, <code>h:messages</code>), <code>f:</code> (core: <code>f:ajax</code>, <code>f:validator</code>, <code>f:converter</code>, <code>f:param</code>) i <code>ui:</code> (plantilles: <code>ui:composition</code>, <code>ui:define</code>, <code>ui:insert</code>, <code>ui:include</code>).</li>
<li><b>Beans</b>: avui classes CDI amb <code>@Named</code> i un àmbit: <code>@RequestScoped</code>, <code>@ViewScoped</code> (mentre l'usuari és a la mateixa vista), <code>@SessionScoped</code>, <code>@ApplicationScoped</code>. L'antic <code>@ManagedBean</code> està obsolet.</li>
<li><b>Convertidors</b> (text ↔ objecte, p. ex. dates) i <b>validadors</b> (<code>f:validateLength</code>, Bean Validation amb <code>@NotNull</code>).</li>
<li><b>Navegació</b>: el mètode d'acció retorna el nom de la vista següent (navegació implícita) o es defineix a <code>faces-config.xml</code>.</li>
<li><code>FacesContext</code> dona accés a la petició i permet afegir missatges (<code>addMessage</code>).</li>
</ul>
<h3>Cicle de vida (6 fases)</h3>
<ol>
<li><b>Restore View</b>: es crea o recupera l'arbre de components.</li>
<li><b>Apply Request Values</b>: cada component agafa el seu valor de la petició.</li>
<li><b>Process Validations</b>: conversió i validació. Si falla, salta a Render Response.</li>
<li><b>Update Model Values</b>: els valors es copien al bean.</li>
<li><b>Invoke Application</b>: s'executen les accions (<code>action</code>, <code>actionListener</code>).</li>
<li><b>Render Response</b>: es genera l'HTML.</li>
</ol>
<p>L'atribut <code>immediate="true"</code> fa que l'acció s'executi a Apply Request Values (útil en un botó "Cancel·la" que no ha de validar). Amb <code>f:ajax</code> s'indica què s'envia (<code>execute</code>) i què es repinta (<code>render</code>).</p>`,

<p>Biblioteca de <b>components per a Angular</b> de PrimeTek, germana de PrimeFaces. Es fa servir a la plaça 12991 juntament amb Angular. S'instal·la amb npm (<code>primeng</code> i un paquet de temes) i es configura amb <code>providePrimeNG()</code> a la configuració de l'aplicació.</p>

<h3>Oracle ADF</h3>
<p><b>Oracle Application Development Framework</b> és el framework empresarial d'Oracle per a aplicacions Java EE, desenvolupat amb <b>JDeveloper</b> i desplegat habitualment a <b>WebLogic</b>. Té diverses capes:</p>
<div class="tbl"><table>
<tr><th>Capa</th><th>Tecnologia</th></tr>

<tr><td>Controlador</td><td><b>ADF Controller</b>: <i>task flows</i> (fluxos de tasques)</td></tr>
<tr><td>Model (vinculació)</td><td><b>ADF Model</b>: <i>data controls</i> i <i>bindings</i> definits als fitxers <code>pageDef</code></td></tr>
<tr><td>Negoci</td><td><b>ADF Business Components</b>: <i>entity objects</i> (taules), <i>view objects</i> (consultes) i <i>application modules</i> (transacció i servei)</td></tr>
</table></div>
<h3>ADF Faces</h3>
<ul>
<li>Components: <code>af:table</code>, <code>af:inputText</code>, <code>af:inputDate</code>, <code>af:selectOneChoice</code>, <code>af:panelFormLayout</code>, <code>af:panelGroupLayout</code>, <code>af:popup</code> amb <code>af:dialog</code>, <code>af:commandButton</code> (ara <code>af:button</code>), <code>af:query</code>, gràfics DVT.</li>
<li><b>Partial Page Rendering (PPR)</b>: actualitza només parts de la pàgina. Atributs <code>partialSubmit</code> (envia només el component), <code>autoSubmit</code> (envia en canviar el valor) i <code>partialTriggers</code> (el component es repinta quan canvia el component indicat).</li>

<li><b>Skins</b> per a l'aparença.</li>
</ul>`,

<h3>Spring Framework</h3>
<ul>
<li>Base: el contenidor d'<b>inversió de control</b> (IoC), l'<code>ApplicationContext</code>, que crea i connecta els objectes (<b>beans</b>) per <b>injecció de dependències</b>. Es recomana la injecció per <b>constructor</b>.</li>

public class Llibre { @Id @GeneratedValue Long id; String titol; String autor; }

public interface LlibreRepository extends JpaRepository&lt;Llibre, Long&gt; {
  List&lt;Llibre&gt; findByAutorContainingIgnoreCase(String autor);
}

@RequestMapping("/api/llibres")
public class LlibreController {
  private final LlibreRepository repo;

  @GetMapping
  public List&lt;Llibre&gt; llista(@RequestParam(defaultValue = "") String autor) {
    return repo.findByAutorContainingIgnoreCase(autor);
  }

  @PostMapping

summary:`
<h3>Jakarta Persistence (JPA)</h3>
<p>Especificació Java per al <b>mapatge objecte-relacional</b> (ORM). Implementacions: <b>Hibernate</b> (la més usada, i la de Spring Boot) i EclipseLink. La configuració clàssica és a <code>persistence.xml</code> (unitat de persistència).</p>
<h3>Mapatge</h3>
<ul>
<li><code>@Entity</code>, <code>@Table</code>, <code>@Id</code>, <code>@Column</code>, <code>@Transient</code> (no es desa), <code>@Enumerated</code>, <code>@Lob</code>, <code>@Embedded</code>/<code>@Embeddable</code>.</li>
<li><code>@GeneratedValue</code> amb estratègies <code>AUTO</code>, <code>IDENTITY</code> (columna autoincremental), <b><code>SEQUENCE</code></b> (seqüència, habitual a Oracle) i <code>TABLE</code>.</li>
<li>Relacions: <code>@OneToOne</code>, <code>@OneToMany</code>, <code>@ManyToOne</code>, <code>@ManyToMany</code>. En les bidireccionals, el costat <b>propietari</b> és el que té la clau forana (<code>@JoinColumn</code>); l'altre fa servir <code>mappedBy</code>.</li>
<li><b>Fetch</b> per defecte: les relacions <code>...ToOne</code> són <code>EAGER</code> i les <code>...ToMany</code> són <code>LAZY</code>. <b>Cascade</b>: <code>PERSIST</code>, <code>MERGE</code>, <code>REMOVE</code>, <code>ALL</code>; <code>orphanRemoval</code>.</li>
<li>Bloqueig optimista amb <code>@Version</code>.</li>
</ul>
<h3>EntityManager i estats</h3>
<ul>
<li>Operacions: <code>persist</code>, <code>find</code>, <code>merge</code>, <code>remove</code>, <code>flush</code>, <code>refresh</code>, <code>detach</code>, <code>createQuery</code>.</li>
<li>Estats d'una entitat: <b>nova</b> (transient), <b>gestionada</b> (managed, dins el context de persistència: els canvis es desen automàticament en confirmar la transacció), <b>separada</b> (detached) i <b>eliminada</b> (removed).</li>
<li>El <b>context de persistència</b> fa de memòria cau de primer nivell: dins la mateixa transacció, un <code>find</code> del mateix id retorna el mateix objecte.</li>
</ul>
<h3>Consultes</h3>
<ul>
<li><b>JPQL</b>: sobre entitats, no taules (<code>SELECT l FROM Llibre l WHERE l.autor = :autor</code>). Paràmetres amb nom o posicionals, <code>@NamedQuery</code>, consultes natives SQL, <b>Criteria API</b> (consultes tipades programàtiques).</li>
<li>Problema <b>N+1</b>: en recórrer una llista, cada relació lazy llança una consulta. Es resol amb <code>JOIN FETCH</code> o <i>entity graphs</i>.</li>
<li>Error típic: <code>LazyInitializationException</code> en accedir a una relació lazy fora de la transacció.</li>
</ul>`,

summary:`
<h3>Log4j 2</h3>
<p>Biblioteca de registre (<i>logging</i>) d'Apache per a Java. Log4j 1.x va arribar a fi de vida el 2015; la versió actual és Log4j 2. Sovint s'hi accedeix a través de la façana <b>SLF4J</b>.</p>
<ul>
<li><b>Nivells</b>, de menys a més greu: <code>TRACE</code> &lt; <code>DEBUG</code> &lt; <code>INFO</code> &lt; <code>WARN</code> &lt; <code>ERROR</code> &lt; <code>FATAL</code> (més <code>OFF</code> i <code>ALL</code>). Un logger configurat a <code>INFO</code> mostra INFO, WARN, ERROR i FATAL.</li>
<li>Components: <b>Logger</b> (amb jerarquia per nom de paquet), <b>Appender</b> (destinació: <code>Console</code>, <code>File</code>, <b><code>RollingFile</code></b> amb polítiques de rotació per mida o temps, JDBC, SMTP) i <b>Layout</b> (format: <code>PatternLayout</code>, JSON).</li>
<li>Patró típic: <code>%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n</code> (data, nivell, logger, missatge, salt de línia).</li>
<li>Configuració a <code>log4j2.xml</code> (o YAML, JSON, properties), amb <code>&lt;Appenders&gt;</code> i <code>&lt;Loggers&gt;</code> (<code>&lt;Root&gt;</code> i loggers específics, <code>additivity</code>).</li>
<li>Bones pràctiques: <b>missatges parametritzats</b> (<code>log.debug("Usuari {}", id)</code>) en lloc de concatenar; no registrar dades personals ni contrasenyes; loggers asíncrons per rendiment.</li>
<li><b>Log4Shell</b> (CVE-2021-44228, desembre de 2021): vulnerabilitat crítica d'execució remota de codi per les cerques JNDI en els missatges. Es va corregir a les versions 2.15-2.17.</li>
</ul>
<h3>Log4php</h3>
<p>Port de Log4j per a PHP (Apache), amb els mateixos conceptes: <code>Logger::configure('config.xml')</code>, <code>$log = Logger::getLogger('app')</code>, <code>$log-&gt;info(...)</code>, appenders (<code>LoggerAppenderFile</code>, <code>LoggerAppenderDailyFile</code>, <code>LoggerAppenderRollingFile</code>) i layouts (<code>LoggerLayoutPattern</code>). El projecte està retirat (Apache Attic), però encara s'usa en aplicacions existents; l'alternativa moderna és <b>Monolog</b> (PSR-3).</p>`,

summary:`
<h3>JUnit</h3>
<p>Framework de <b>proves unitàries</b> per a Java. El temari cita JUnit 4 i 5.</p>
<div class="tbl"><table>
<tr><th>Concepte</th><th>JUnit 4</th><th>JUnit 5 (Jupiter)</th></tr>
<tr><td>Paquet</td><td><code>org.junit</code></td><td><code>org.junit.jupiter.api</code></td></tr>
<tr><td>Abans/després de cada prova</td><td><code>@Before</code>, <code>@After</code></td><td><code>@BeforeEach</code>, <code>@AfterEach</code></td></tr>
<tr><td>Una vegada per classe</td><td><code>@BeforeClass</code>, <code>@AfterClass</code></td><td><code>@BeforeAll</code>, <code>@AfterAll</code> (mètodes static)</td></tr>
<tr><td>Desactivar</td><td><code>@Ignore</code></td><td><code>@Disabled</code></td></tr>
<tr><td>Excepcions</td><td><code>@Test(expected = X.class)</code></td><td><code>assertThrows(X.class, () -&gt; ...)</code></td></tr>
<tr><td>Extensió</td><td><code>@RunWith</code>, <code>@Rule</code></td><td><code>@ExtendWith</code></td></tr>
</table></div>
<ul>
<li>JUnit 5 = <b>Platform</b> (motor per executar proves) + <b>Jupiter</b> (nou model) + <b>Vintage</b> (executa proves de JUnit 3 i 4).</li>
<li>Assercions: <code>assertEquals</code>, <code>assertTrue</code>, <code>assertNull</code>, <code>assertNotNull</code>, <code>assertThrows</code>, <code>assertAll</code> (agrupa i informa de tots els errors), <code>assertTimeout</code>.</li>
<li>Novetats de JUnit 5: <code>@DisplayName</code>, <code>@Nested</code>, <code>@Tag</code>, <b>proves parametritzades</b> (<code>@ParameterizedTest</code> amb <code>@ValueSource</code>, <code>@CsvSource</code>, <code>@MethodSource</code>), <code>@RepeatedTest</code>.</li>
<li>Bones pràctiques: patró <b>Arrange-Act-Assert</b>, proves independents i ràpides, una sola cosa per prova, dobles de prova amb <b>Mockito</b> (<code>@Mock</code>, <code>when(...).thenReturn(...)</code>, <code>verify</code>).</li>
<li>Maven executa les proves amb <b>Surefire</b> a la fase <code>test</code>; Jenkins publica l'informe XML.</li>
</ul>`,

<h3>Thymeleaf</h3>
<p>Motor de <b>plantilles al servidor</b> per a Java, molt usat amb Spring MVC i Spring Boot (<code>spring-boot-starter-thymeleaf</code>). La seva idea clau són les <b>plantilles naturals</b>: el fitxer és HTML vàlid que es pot obrir directament al navegador, i els atributs <code>th:</code> substitueixen el contingut en temps d'execució. Les plantilles van a <code>src/main/resources/templates</code>.</p>
<h3>Sintaxi</h3>
<div class="tbl"><table>
<tr><th>Expressió</th><th>Ús</th></tr>
<tr><td><code>$</code> + claus</td><td>Variables del model (<code>th:text</code> amb el nom de l'atribut)</td></tr>
<tr><td><code>*</code> + claus</td><td>Expressions de selecció sobre l'objecte de <code>th:object</code> (formularis)</td></tr>
<tr><td><code>#</code> + claus</td><td>Missatges d'internacionalització (<code>messages.properties</code>)</td></tr>
<tr><td><code>@</code> + claus</td><td>URL amb el context de l'aplicació (<code>th:href</code>)</td></tr>
<tr><td><code>~</code> + claus</td><td>Fragments</td></tr>
</table></div>
<ul>
<li>Atributs: <code>th:text</code> (escapa HTML, segur contra XSS), <code>th:utext</code> (sense escapar), <code>th:each</code> (bucle), <code>th:if</code> / <code>th:unless</code>, <code>th:switch</code>, <code>th:href</code>, <code>th:src</code>, <code>th:value</code>, <code>th:field</code> (vinculació a formulari), <code>th:object</code>, <code>th:classappend</code>.</li>
<li>Fragments i dissenys: <code>th:fragment</code>, <code>th:insert</code>, <code>th:replace</code>.</li>
<li>Objectes d'utilitat: <code>#dates</code>, <code>#temporals</code>, <code>#numbers</code>, <code>#strings</code>, <code>#lists</code>.</li>
<li>Integració amb Spring Security (mostrar blocs segons rol) i protecció CSRF automàtica als formularis.</li>
</ul>`,

"poo":{url:"https://refactoring.guru/es/design-patterns",prompt:'<span class="ps">class</span> Objecte implements Principis {',
summary:`
<h3>Pilars</h3>
<div class="tbl"><table>
<tr><th>Pilar</th><th>Idea</th></tr>
<tr><td><b>Abstracció</b></td><td>Modelar només allò rellevant d'una entitat (classes, classes abstractes, interfícies).</td></tr>
<tr><td><b>Encapsulament</b></td><td>Amagar l'estat intern i exposar operacions controlades (visibilitat privada, getters/setters, immutabilitat).</td></tr>
<tr><td><b>Herència</b></td><td>Una classe deriva d'una altra i en reutilitza el comportament: relació "és un".</td></tr>
<tr><td><b>Polimorfisme</b></td><td>Un mateix missatge provoca comportaments diferents segons l'objecte. <i>Dinàmic</i> (sobreescriptura, lligam en execució) i <i>estàtic</i> (sobrecàrrega, en compilació).</td></tr>
</table></div>
<p>Altres conceptes: classe i objecte (instància), constructor, missatge, estat i comportament, membres d'instància i de classe (estàtics), classe abstracta (no s'instancia, pot tenir codi) i interfície (contracte), <b>composició sobre herència</b>, <b>alta cohesió i baix acoblament</b>.</p>
<h3>Principis SOLID</h3>
<ul>
<li><b>S</b>, responsabilitat única: una classe ha de tenir un sol motiu per canviar.</li>
<li><b>O</b>, obert/tancat: obert a l'extensió, tancat a la modificació.</li>
<li><b>L</b>, substitució de Liskov: una subclasse ha de poder substituir la classe pare sense trencar el programa.</li>
<li><b>I</b>, segregació d'interfícies: millor diverses interfícies petites que una de gran.</li>
<li><b>D</b>, inversió de dependències: dependre d'abstraccions, no d'implementacions concretes (base de la injecció de dependències).</li>
</ul>
<p>Altres principis: DRY (no et repeteixis), KISS (fes-ho simple), YAGNI (no ho implementis si no cal), llei de Demèter (parla només amb els teus col·laboradors directes).</p>
<h3>Patrons de disseny (GoF)</h3>
<div class="tbl"><table>
<tr><th>Tipus</th><th>Patrons</th></tr>
<tr><td><b>Creacionals</b></td><td><b>Singleton</b> (una sola instància), <b>Factory Method</b>, Abstract Factory, <b>Builder</b> (construcció pas a pas), Prototype</td></tr>
<tr><td><b>Estructurals</b></td><td><b>Adapter</b> (adapta una interfície a una altra), <b>Decorator</b> (afegeix comportament sense herència), <b>Facade</b> (interfície simplificada), <b>Proxy</b>, Composite, Bridge, Flyweight</td></tr>
<tr><td><b>De comportament</b></td><td><b>Strategy</b> (algorismes intercanviables), <b>Observer</b> (notificació de canvis), <b>Template Method</b>, Command, Iterator, State, Chain of Responsibility, Mediator, Memento, Visitor</td></tr>
</table></div>
<p>El llibre de referència és <i>Design Patterns</i> (1994) de la "Gang of Four" (Gamma, Helm, Johnson, Vlissides), amb 23 patrons.</p>
<h3>On és cada llenguatge</h3>
<p>Els detalls de POO de Java, JavaScript i TypeScript, Angular, Selenium i PHP estan dins el recurs de cada tecnologia, a l'apartat "POO a…".</p>`,

["Quins són els quatre pilars de la POO?",["Classes, objectes, mètodes i atributs","Abstracció, encapsulament, herència i polimorfisme","SOLID","Cohesió, acoblament, DRY i KISS"],1,""],

["Quin patró ofereix una interfície simplificada a un subsistema complex?",["Decorator","Facade","Composite","Bridge"],1,""],
["Quin patró converteix la interfície d'una classe en una altra que el client espera?",["Adapter","Proxy","Iterator","State"],0,""],
["De quin tipus és el patró Builder?",["Estructural","Creacional","De comportament","Arquitectònic"],1,""],

"metrica3":{url:"https://manuel.cillero.es/doc/metrica-3/",prompt:'<span class="ps">$</span> metrica --proces ASI',
summary:`
<h3>Què és MÉTRICA versió 3</h3>
<p>Metodologia de <b>planificació, desenvolupament i manteniment de sistemes d'informació</b> promoguda pel Consejo Superior de Administración Electrónica (Ministerio de Administraciones Públicas, 2001) per a les administracions públiques espanyoles. Està pensada per a desenvolupament <b>estructurat</b> i <b>orientat a objectes</b>, i es basa en estàndards com ISO/IEC 12207 i ISO 15504. Té una estructura de <b>processos</b>, <b>activitats</b> i <b>tasques</b>.</p>
<h3>Processos principals</h3>
<div class="tbl"><table>
<tr><th>Sigla</th><th>Procés</th><th>Contingut</th></tr>
<tr><td><b>PSI</b></td><td>Planificació de Sistemes d'Informació</td><td>Marc estratègic i model d'informació de l'organització</td></tr>
<tr><td><b>EVS</b></td><td>Estudi de Viabilitat del Sistema</td><td>Anàlisi de necessitats i alternatives de solució, i selecció</td></tr>
<tr><td><b>ASI</b></td><td>Anàlisi del Sistema d'Informació</td><td>Especificació detallada de requisits, casos d'ús, models de dades i de processos</td></tr>
<tr><td><b>DSI</b></td><td>Disseny del Sistema d'Informació</td><td>Arquitectura i disseny detallat dels components</td></tr>
<tr><td><b>CSI</b></td><td>Construcció del Sistema d'Informació</td><td>Codificació, proves unitàries i d'integració, documentació</td></tr>
<tr><td><b>IAS</b></td><td>Implantació i Acceptació del Sistema</td><td>Proves d'implantació i d'acceptació, càrrega de dades, posada en producció</td></tr>
<tr><td><b>MSI</b></td><td>Manteniment del Sistema d'Informació</td><td>Gestió de peticions de manteniment</td></tr>
</table></div>
<p>El desenvolupament comprèn <b>EVS, ASI, DSI, CSI i IAS</b>. MÉTRICA 3 només contempla el manteniment <b>correctiu</b> i <b>evolutiu</b> (deixa fora l'adaptatiu i el perfectiu, que tracta com a projectes nous o com a part de l'evolutiu).</p>
<h3>Interfícies</h3>
<p>Activitats que s'apliquen al llarg de tots els processos: <b>Gestió de Projectes</b> (GP), <b>Seguretat</b> (SEG), <b>Assegurament de la Qualitat</b> (CAL) i <b>Gestió de la Configuració</b> (GC).</p>
<h3>Tècniques i participants</h3>
<ul>
<li>Tècniques de desenvolupament: casos d'ús, diagrames de flux de dades (DFD), model entitat-relació, normalització, diagrames UML (classes, seqüència, estats), diagrames d'estructura, prototips.</li>
<li>Tècniques de gestió: estimació (anàlisi de <b>punts de funció</b>, Mark II), diagrames de Gantt i PERT, anàlisi cost-benefici.</li>
<li>Pràctiques: catalogació, revisions formals, proves, presentacions, sessions JAD.</li>
<li>Participants per perfils: directiu (comitè de direcció), cap de projecte, consultor, analista, programador.</li>
</ul>`,

"uml":{url:"https://www.uml.org",prompt:'<span class="ps">«</span>interface» Prestable',
summary:`
<h3>UML</h3>
<p>El <b>Llenguatge Unificat de Modelatge</b> és l'estàndard de l'<b>OMG</b> per especificar, visualitzar i documentar sistemes de programari (versió 2.5). No és una metodologia, sinó una notació. Té <b>14 diagrames</b>:</p>
<div class="tbl"><table>
<tr><th>Estructurals (7)</th><th>De comportament (7)</th></tr>
<tr><td>Classes, objectes, components, desplegament, paquets, estructura composta, perfils</td><td>Casos d'ús, activitats, màquina d'estats, i d'interacció: seqüència, comunicació, temps i visió general de la interacció</td></tr>
</table></div>
<ul>
<li><b>Diagrama de classes</b>: visibilitat <code>+</code> pública, <code>-</code> privada, <code>#</code> protegida, <code>~</code> de paquet. Relacions: associació (línia, amb multiplicitat <code>1</code>, <code>0..*</code>), <b>agregació</b> (rombe buit: la part pot existir sola), <b>composició</b> (rombe ple: la part mor amb el tot), <b>generalització</b> (fletxa amb triangle buit), <b>realització</b> (triangle buit i línia discontínua: implementar una interfície), dependència (fletxa discontínua).</li>
<li><b>Casos d'ús</b>: actors, casos d'ús, frontera del sistema; relacions <code>«include»</code> (sempre s'executa) i <code>«extend»</code> (opcional, en un punt d'extensió), i generalització.</li>
<li><b>Seqüència</b>: línies de vida, missatges síncrons (fletxa plena) i asíncrons, respostes (discontínues), fragments combinats (<code>alt</code>, <code>opt</code>, <code>loop</code>).</li>
<li><b>Màquina d'estats</b>: estats, transicions, esdeveniments i condicions. <b>Activitats</b>: fluxos, decisions, bifurcacions (fork/join), carrils.</li>

</ul>
<h3>Patrons d'arquitectura</h3>

summary:`
<h3>Symfony</h3>
<p>Framework PHP de codi obert creat per Fabien Potencier (SensioLabs). Es compon de <b>components</b> reutilitzables (molts els fan servir altres projectes, com Laravel o Drupal) i segueix el patró <b>MVC</b>. Té versions <b>LTS</b>. Es gestiona amb Composer i <b>Symfony Flex</b> (receptes que configuren automàticament els paquets) i la consola <code>php bin/console</code>.</p>
<h3>Conceptes</h3>
<ul>
<li><b>Rutes</b> amb atributs PHP: <code>#[Route('/llibres/{id}', name: 'llibre_show', methods: ['GET'])]</code>. Llistat amb <code>debug:router</code>.</li>
<li><b>Controladors</b> que estenen <code>AbstractController</code> i retornen un objecte <code>Response</code> (<code>$this-&gt;render()</code>, <code>$this-&gt;json()</code>, <code>$this-&gt;redirectToRoute()</code>).</li>
<li><b>Contenidor de serveis</b> amb <b>injecció de dependències</b> i <b>autowiring</b> (per tipus del constructor). Configuració a <code>config/services.yaml</code>.</li>
<li><b>Doctrine ORM</b>: entitats amb atributs (<code>#[ORM\\Entity]</code>), repositoris, <code>EntityManager</code> (<code>persist</code>, <code>flush</code>), migracions (<code>make:migration</code>, <code>doctrine:migrations:migrate</code>). <b>MakerBundle</b> genera codi (<code>make:entity</code>, <code>make:controller</code>).</li>
<li><b>Formularis</b> (Form component), <b>Validator</b> (restriccions com <code>#[Assert\\NotBlank]</code>), <b>Security</b> (firewalls, proveïdors d'usuaris, <code>#[IsGranted]</code>, voters), <b>Messenger</b> (missatges asíncrons), esdeveniments i subscriptors.</li>
<li>Entorns <code>dev</code>, <code>prod</code>, <code>test</code> amb variables a <code>.env</code>. Barra de depuració i <b>profiler</b> en desenvolupament.</li>
<li>Estructura: <code>src/</code> (Controller, Entity, Repository), <code>templates/</code>, <code>config/</code>, <code>public/index.php</code> (controlador frontal), <code>var/</code> (memòria cau i logs).</li>
</ul>
<h3>Twig</h3>
<ul>
<li>Motor de plantilles de Symfony. Tres delimitadors: <code>{{ ... }}</code> mostra un valor, <code>{% ... %}</code> executa una instrucció (<code>if</code>, <code>for</code>, <code>set</code>, <code>block</code>) i <code>{# ... #}</code> és un comentari.</li>

</ul>`,

summary:`
<h3>Perl</h3>
<p>Llenguatge interpretat creat per <b>Larry Wall</b> el 1987, molt potent en el <b>tractament de text</b> i les <b>expressions regulars</b>; s'ha fet servir molt en scripts d'administració i en aplicacions web CGI (com GREC, a la UB). La versió viva és <b>Perl 5</b>; Raku és un llenguatge diferent (abans Perl 6). Mòduls al repositori <b>CPAN</b>.</p>
<h3>Bàsics</h3>
<ul>
<li>Sempre <code>use strict;</code> i <code>use warnings;</code>. Variables locals amb <code>my</code>.</li>
<li>Tres tipus de variables segons el <b>sigil</b>: <b>escalar</b> <code>$nom</code> (número, cadena o referència), <b>array</b> <code>@llista</code> (un element: <code>$llista[0]</code>; últim índex: <code>$#llista</code>) i <b>hash</b> <code>%h</code> (un valor: <code>$h{clau}</code>).</li>
<li><b>Context</b>: un array en context escalar retorna el nombre d'elements.</li>
<li>Comparació: numèrica <code>== != &lt; &gt; &lt;=&gt;</code> i de cadenes <code>eq ne lt gt cmp</code>. Concatenació amb <code>.</code>; repetició amb <code>x</code>.</li>
<li>Control: <code>if</code>, <code>unless</code>, <code>while</code>, <code>until</code>, <code>for</code>, <code>foreach</code>; <code>last</code> (sortir del bucle) i <code>next</code> (següent iteració). Variable per defecte <code>$_</code>.</li>
<li>Funcions amb <code>sub nom { my ($a, $b) = @_; ... }</code>: els arguments arriben a <code>@_</code>.</li>
<li><b>Referències</b>: <code>\\@array</code>, <code>\\%hash</code>, anònimes <code>[...]</code> i <code>{...}</code>; s'accedeix amb <code>-&gt;</code> (<code>$ref-&gt;[0]</code>, <code>$ref-&gt;{clau}</code>). Permeten estructures complexes.</li>
</ul>
<h3>Text, fitxers i bases de dades</h3>
<ul>
<li>Expressions regulars: <code>$s =~ m/patró/</code> (coincidència), <code>s/vell/nou/g</code> (substitució), <code>tr/a-z/A-Z/</code> (traducció de caràcters); captures a <code>$1</code>, <code>$2</code>…; modificadors <code>i</code>, <code>g</code>, <code>x</code>.</li>
<li>Fitxers: <code>open(my $fh, '&lt;', $fitxer) or die "Error: $!";</code>, llegir línia a línia amb <code>while (my $l = &lt;$fh&gt;)</code>, <code>chomp</code> per treure el salt de línia, <code>close</code>.</li>
<li>Funcions útils: <code>split</code>, <code>join</code>, <code>sort</code>, <code>keys</code>, <code>values</code>, <code>exists</code>, <code>push</code>, <code>pop</code>, <code>shift</code>, <code>grep</code>, <code>map</code>, <code>sprintf</code>.</li>
<li>Bases de dades amb <b>DBI</b>: <code>DBI-&gt;connect</code>, <code>prepare</code> amb <b>placeholders</b> <code>?</code> (contra la injecció SQL), <code>execute</code>, <code>fetchrow_hashref</code>. Web clàssic amb el mòdul <code>CGI</code>.</li>
<li>Variables especials: <code>@ARGV</code> (arguments), <code>%ENV</code>, <code>$!</code> (error del sistema), <code>$0</code> (nom del script). Mòduls amb <code>package</code> i <code>use</code>; orientació a objectes amb <code>bless</code>.</li>
</ul>`,

<p>Sistema de gestió de bases de dades de <b>Software AG</b>, d'alt rendiment, molt usat en grans sistemes (mainframe i també Linux i Windows). No és relacional: es basa en <b>llistes invertides</b>.</p>

"plsql":{url:"https://docs.oracle.com/en/database/oracle/oracle-database/19/lnpls/",prompt:'<span class="ps">SQL&gt;</span> EXEC pkg_prestecs.renova(42);',
summary:`
<h3>Estructura</h3>
<p>PL/SQL és l'extensió procedimental de SQL d'Oracle. Un <b>bloc</b> té <code>DECLARE</code> (opcional), <code>BEGIN</code>, <code>EXCEPTION</code> (opcional) i <code>END;</code>. Blocs anònims o amb nom (procediments, funcions, paquets, disparadors).</p>
<ul>
<li>Tipus: <code>VARCHAR2</code>, <code>NUMBER</code>, <code>DATE</code>, <code>BOOLEAN</code> (a PL/SQL), i tipus ancorats <b><code>%TYPE</code></b> (el d'una columna) i <b><code>%ROWTYPE</code></b> (el d'una fila).</li>
<li><b>Cursors</b>: implícits (cada DML; atributs <code>SQL%ROWCOUNT</code>, <code>SQL%FOUND</code>) i explícits (<code>OPEN</code>, <code>FETCH</code>, <code>CLOSE</code>; atributs <code>%FOUND</code>, <code>%NOTFOUND</code>, <code>%ROWCOUNT</code>, <code>%ISOPEN</code>). El <b>cursor FOR</b> obre, llegeix i tanca automàticament. <code>SELECT ... INTO</code> ha de retornar exactament una fila.</li>
<li><b>Excepcions</b> predefinides: <code>NO_DATA_FOUND</code>, <code>TOO_MANY_ROWS</code>, <code>ZERO_DIVIDE</code>, <code>DUP_VAL_ON_INDEX</code>, <code>VALUE_ERROR</code>, <code>INVALID_CURSOR</code>; <code>WHEN OTHERS</code>; excepcions pròpies amb <code>RAISE</code>; <code>RAISE_APPLICATION_ERROR(-20000 a -20999, missatge)</code>; <code>SQLCODE</code> i <code>SQLERRM</code>.</li>
<li><b>Procediments</b> (no retornen valor) i <b>funcions</b> (<code>RETURN</code>, es poden fer servir en SQL si no tenen efectes secundaris). Paràmetres <code>IN</code> (per defecte), <code>OUT</code> i <code>IN OUT</code>.</li>
<li><b>Paquets</b>: <b>especificació</b> (interfície pública) i <b>cos</b> (implementació, amb elements privats). Variables de paquet que duren tota la sessió.</li>
<li><b>Disparadors</b> (<i>triggers</i>): <code>BEFORE</code>/<code>AFTER</code>, a nivell de fila (<code>FOR EACH ROW</code>, amb <code>:NEW</code> i <code>:OLD</code>) o de sentència; <code>INSTEAD OF</code> sobre vistes; de sistema (LOGON, DDL).</li>
<li><b>Col·leccions</b>: arrays associatius (<code>INDEX BY</code>), taules niades i <code>VARRAY</code>. Operacions massives <b><code>BULK COLLECT</code></b> i <b><code>FORALL</code></b>, que redueixen els canvis de context entre PL/SQL i SQL.</li>

</ul>`,
